name: Fix OGE 6.10

on:
  push:
    paths:
      - '.github/workflows/fix-oge610.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update task
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lessons/grade9/oge/OGE_6_60min.html')
          s = p.read_text(encoding='utf-8')
          old = '''        \"title\": \"6. ФИПИ 6.10 — разные знаменатели\",\n        \"instruction\": \"Введите несократимую дробь.\",\n        \"type\": \"input\",\n        \"prompt\": \"<div class=\\\"question\\\">Найдите значение выражения $$\\\\frac1{30}+\\\\frac1{42}.$$</div>\",\n        \"answer\": [\n          \"2/35\"\n        ]'''
          new = '''        \"title\": \"6. ФИПИ 6.10 — сложная дробь\",\n        \"instruction\": \"Введите ответ.\",\n        \"type\": \"input\",\n        \"prompt\": \"<div class=\\\"question\\\">Найдите значение выражения $$\\\\frac{1}{\\\\frac{1}{30}+\\\\frac{1}{42}}.$$</div>\",\n        \"answer\": [\n          \"17,5\",\n          \"17.5\",\n          \"35/2\"\n        ]'''
          if old not in s:
              raise SystemExit('Target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/grade9/oge/OGE_6_60min.html
          git commit -m "Fix FIPI 6.10 expression and answer"
          git push
