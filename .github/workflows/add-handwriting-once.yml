name: Add handwriting tools once

on:
  push:
    paths:
      - '.github/workflows/add-handwriting-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch interactive lesson
        run: python3 .github/scripts/add_handwriting.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/grade11/ege/interactive_math_lesson.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add handwriting tools to interactive math lesson"
            git push
          fi