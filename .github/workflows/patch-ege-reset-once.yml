name: Patch EGE full reset button once

on:
  push:
    paths:
      - '.github/workflows/patch-ege-reset-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add full reset button and logic
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('lessons/grade11/ege/ege_2027_demo_profile_handwriting_check.html')
          text = path.read_text(encoding='utf-8')

          old_button = '''    <button class="tool-btn" id="clearInkBtn" type="button"><span class="ico">🗑</span> Очистить текущий лист</button>'''
          new_button = old_button + '''\n    <button class="tool-btn" id="resetAllBtn" type="button"><span class="ico">↺</span> Сбросить всё</button>'''
          if 'id="resetAllBtn"' not in text:
              if old_button not in text:
                  raise SystemExit('Button anchor not found')
              text = text.replace(old_button, new_button, 1)

          anchor = 'let inkResizeTimer;'
          reset_logic = dedent(r'''
          document.getElementById('resetAllBtn').addEventListener('click',()=>{
            if(!confirm('Сбросить все ответы и полностью удалить рукописные записи во всех заданиях? Это действие нельзя отменить.')) return;

            // Удаляем только сохранения этой демоверсии, не затрагивая другие страницы сайта.
            Object.keys(localStorage)
              .filter(k=>k.startsWith('ege2027:'))
              .forEach(k=>localStorage.removeItem(k));

            // Очищаем печатные ответы и поля развёрнутых решений.
            fields.forEach(el=>{
              if(el.matches('input')) el.value='';
              else el.innerHTML='';
            });

            // Полностью очищаем рукопись на всех листах.
            document.querySelectorAll('.task').forEach(task=>{
              inkData.set(task.id,[]);
              redrawInk(task);
            });

            // Сбрасываем результаты проверки и показанные правильные ответы.
            document.querySelectorAll('.answer-input').forEach(el=>el.classList.remove('correct','wrong'));
            document.querySelectorAll('.check-result').forEach(el=>{
              el.textContent='';
              el.classList.remove('ok','bad','empty');
            });
            document.querySelectorAll('.official-answer').forEach(el=>el.classList.remove('visible'));

            inkState.activeTask=null;
            inkState.activePointer=null;
            inkState.currentStroke=null;
            updateDone();
          });

          ''')
          if "document.getElementById('resetAllBtn').addEventListener" not in text:
              if anchor not in text:
                  raise SystemExit('JS anchor not found')
              text = text.replace(anchor, reset_logic + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/grade11/ege/ege_2027_demo_profile_handwriting_check.html
          git commit -m "Add full reset for EGE answers and handwriting"
          git push
