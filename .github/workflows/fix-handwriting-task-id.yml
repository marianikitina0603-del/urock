name: Fix handwriting task ids

on:
  push:
    paths:
      - '.github/workflows/fix-handwriting-task-id.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix drawing canvas task ids
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lessons/grade11/ege/interactive_math_lesson.html')
          s = p.read_text(encoding='utf-8')
          old = '<article class="task" id="task${n}">'
          new = '<article class="task" id="task${n}" data-task="${n}">'
          if old not in s:
              raise SystemExit('Target task template not found')
          s = s.replace(old, new, 1)
          # Also make activation re-check canvases for robustness.
          s = s.replace("function toggleDrawing(){drawingEnabled=!drawingEnabled;updateDrawToolbar()}", "function toggleDrawing(){initDrawingCanvases();drawingEnabled=!drawingEnabled;updateDrawToolbar()}")
          s = s.replace("function setDrawTool(tool){drawTool=tool;drawingEnabled=true;updateDrawToolbar()}", "function setDrawTool(tool){initDrawingCanvases();drawTool=tool;drawingEnabled=true;updateDrawToolbar()}")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/grade11/ege/interactive_math_lesson.html
          git commit -m "Fix handwriting canvas initialization"
          git push