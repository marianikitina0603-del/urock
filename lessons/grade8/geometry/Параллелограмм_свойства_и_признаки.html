<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Параллелограмм: свойства и признаки — интерактивное занятие</title>

<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>

<style>
  :root{
    --bg:#f7f4ea;
    --surface:#fffdf7;
    --surface-2:#f1f5e7;
    --text:#263125;
    --muted:#697468;
    --primary:#6c8a52;
    --primary-2:#89a46d;
    --primary-soft:#e7eedc;
    --border:#cbd6bc;
    --danger:#b55d54;
    --success:#4e7f53;
    --shadow:0 8px 24px rgba(45,60,35,.08);
    --radius:16px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg),#ffffff 68%);
    color:var(--text);
    min-height:100vh;
  }

  button,input,textarea{font:inherit}
  button{cursor:pointer}

  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    box-shadow:0 3px 16px rgba(0,0,0,.04);
  }

  .topbar-row{
    display:flex;
    align-items:stretch;
    gap:8px;
    padding:10px 14px 0;
    overflow-x:auto;
  }

  .topic-tab{
    min-width:170px;
    border:1px solid var(--border);
    border-bottom:3px solid transparent;
    border-radius:14px 14px 0 0;
    background:var(--surface);
    color:var(--text);
    padding:12px 16px;
    font-weight:800;
    text-align:center;
    transition:.2s ease;
  }
  .topic-tab small{
    display:block;
    margin-top:5px;
    font-size:.78rem;
    font-weight:600;
    color:var(--muted);
  }
  .topic-tab:hover{background:var(--primary-soft)}
  .topic-tab.active{
    color:var(--primary);
    border-color:var(--primary);
    border-bottom-color:var(--primary);
    background:var(--primary-soft);
  }

  .themebar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:8px 14px 10px;
    border-top:1px solid color-mix(in srgb,var(--border) 55%, transparent);
  }
  .theme-label{
    align-self:center;
    font-size:.9rem;
    color:var(--muted);
    margin-right:2px;
  }
  .theme-btn{
    width:31px;height:31px;border-radius:50%;
    border:2px solid #fff;
    outline:1px solid var(--border);
    transition:.2s;
  }
  .theme-btn:hover{transform:scale(1.1)}
  .theme-btn.active{outline:3px solid var(--primary)}

  .theme-sage{background:linear-gradient(135deg,#d7cfae 0 50%,#78915c 50%)}
  .theme-blue{background:linear-gradient(135deg,#dce9f7 0 50%,#376fae 50%)}
  .theme-rose{background:linear-gradient(135deg,#f4e0df 0 50%,#a95f71 50%)}
  .theme-night{background:linear-gradient(135deg,#303845 0 50%,#d4aa55 50%)}

  .layout{
    display:grid;
    grid-template-columns:280px minmax(0,1fr);
    gap:18px;
    padding:18px;
    width:min(1600px,100%);
    margin:0 auto;
    flex:1;
  }

  .sidebar{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .sidebar-card{
    overflow:hidden;
  }
  .sidebar-title{
    padding:14px 16px;
    font-weight:900;
    color:var(--primary);
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--surface),var(--primary-soft));
  }

  .task-nav{
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .task-btn{
    border:0;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    padding:12px 12px;
    text-align:left;
    font-weight:700;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .task-btn:hover{background:var(--primary-soft)}
  .task-btn.active{
    background:var(--primary);
    color:white;
  }
  .task-num{
    width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;
    background:color-mix(in srgb,var(--primary) 13%, white);
    color:var(--primary);
    font-size:.86rem;
  }
  .task-btn.active .task-num{
    background:rgba(255,255,255,.18);
    color:#fff;
  }
  .task-btn.is-done:not(.active){background:color-mix(in srgb,var(--success) 10%, transparent);}
  .task-btn.is-done:not(.active) .task-num{background:var(--success);color:#fff;}
  .task-btn.is-wrong:not(.active){box-shadow:inset 3px 0 0 var(--danger);}
  .task-btn.is-filled:not(.active){box-shadow:inset 3px 0 0 var(--primary-2);}

  .info{
    padding:15px 16px;
    line-height:1.55;
    font-size:.92rem;
  }
  .info strong{color:var(--primary)}
  .info p{margin:.35rem 0}

  .workspace{
    padding:20px;
    min-height:700px;
  }

  .task-header{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .task-header h1{
    margin:0;
    color:var(--primary);
    font-size:clamp(1.35rem,2vw,2rem);
  }
  .task-kicker{
    margin:5px 0 0;
    color:var(--muted);
  }

  .task-content{
    border-top:1px solid var(--border);
    padding-top:18px;
  }

  .example-box{
    background:var(--primary-soft);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin:14px 0;
  }

  .question{
    font-size:1.13rem;
    line-height:1.6;
    margin:12px 0 16px;
  }

  .answer-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin:18px 0;
  }
  .answer-row label{font-weight:800}
  .answer-input{
    min-width:220px;
    flex:1;
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    background:var(--surface);
    color:var(--text);
    outline:none;
  }
  .answer-input::placeholder{color:var(--muted);opacity:.9}
  .answer-input:focus{border-color:var(--primary)}

  .choice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin:16px 0;
  }
  .choice{
    display:flex;
    gap:10px;
    align-items:center;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    background:var(--surface-2);
    color:var(--text);
  }
  .choice span{color:inherit}
  .choice input{accent-color:var(--primary)}

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding-top:18px;
    margin-top:24px;
    border-top:1px solid var(--border);
  }
  .btn{
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 16px;
    font-weight:800;
    background:var(--surface);
    color:var(--text);
    transition:.2s;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{
    margin-left:auto;
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .btn-soft{
    background:var(--primary-soft);
    color:var(--primary);
  }
  .btn-danger{
    color:var(--danger);
    background:color-mix(in srgb,var(--danger) 8%, white);
  }

  .feedback{
    margin-top:14px;
    border-radius:12px;
    padding:12px 14px;
    display:none;
    font-weight:800;
  }
  .feedback.show{display:block}
  .feedback.ok{
    color:var(--success);
    background:color-mix(in srgb,var(--success) 11%, white);
    border:1px solid color-mix(in srgb,var(--success) 30%, white);
  }
  .feedback.bad{
    color:var(--danger);
    background:color-mix(in srgb,var(--danger) 10%, white);
    border:1px solid color-mix(in srgb,var(--danger) 28%, white);
  }

  .progress-line{
    height:7px;
    border-radius:999px;
    background:color-mix(in srgb,var(--border) 50%, white);
    overflow:hidden;
    margin-top:10px;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:var(--primary);
    transition:.25s;
  }

  /* Черновик */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.34);
    display:none;
    place-items:center;
    z-index:100;
    padding:18px;
  }
  .modal.open{display:grid}
  .scratchpad{
    width:min(900px,96vw);
    height:min(650px,90vh);
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .scratch-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    background:var(--primary-soft);
    border-bottom:1px solid var(--border);
  }
  .scratch-head strong{color:var(--primary)}
  .scratch-head .spacer{flex:1}
  .tool-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:9px;
    padding:8px 10px;
    font-weight:700;
  }
  #scratchCanvas{
    flex:1;
    width:100%;
    min-height:0;
    touch-action:none;
    cursor:crosshair;
    background-color:#fffef8;
    background-image:
      linear-gradient(rgba(100,120,100,.12) 1px, transparent 1px),
      linear-gradient(90deg,rgba(100,120,100,.12) 1px,transparent 1px);
    background-size:24px 24px;
  }

  .mobile-task-select{
    display:none;
    margin-bottom:12px;
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
  }

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;padding:10px}
    .sidebar{display:none}
    .workspace{padding:15px;min-height:600px}
    .mobile-task-select{display:block}
    .btn-primary{margin-left:0}
    .topic-tab{min-width:145px}
  }

  /* Печать и PDF */
  .export-actions{
    display:flex;
    gap:8px;
    margin-right:auto;
  }
  .export-btn{
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    background:var(--surface);
    color:var(--text);
    font-weight:800;
    cursor:pointer;
  }
  .export-btn:hover{background:var(--primary-soft);color:var(--primary)}

  #printSheet{display:none;}
  /* Для html2canvas/PDF печатный лист должен реально участвовать в раскладке.
     На экран он не попадает: во время экспорта располагаем его далеко за пределами окна. */
  #printSheet.export-render{
    display:block!important;
    position:fixed;
    left:-12000px;
    top:0;
    width:210mm;
    padding:10mm;
    background:#fff;
    z-index:-1;
    pointer-events:none;
  }

  /* Печатная версия: максимально близко к образцу — без интерфейса,
     без заголовков подтем, сквозная нумерация, место для решения в клетку. */
  .print-sheet{
    width:190mm;
    margin:0 auto;
    background:#fff;
    color:#111;
    font-family:"Times New Roman",Times,serif;
    font-size:11.5pt;
    line-height:1.28;
  }
  .print-page{
    width:190mm;
    min-height:277mm;
    background:#fff;
    break-after:page;
    page-break-after:always;
  }
  .print-page:last-child{
    break-after:auto;
    page-break-after:auto;
  }
  .print-task{
    margin:0 0 3.8mm;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .print-question-row{
    display:grid;
    grid-template-columns:6.5mm 1fr;
    column-gap:1.2mm;
    align-items:start;
  }
  .print-num{
    font-weight:400;
    text-align:right;
    padding-right:.5mm;
  }
  .print-prompt .question{
    font-size:11.5pt;
    line-height:1.28;
    margin:0;
  }
  .print-prompt .example-box{
    border:0;
    background:transparent;
    padding:0;
    margin:0 0 1.5mm;
  }
  .print-prompt p{margin:0 0 1.2mm;}
  .print-prompt mjx-container[display="true"]{margin:.8mm 0!important;}
  .print-options{
    margin:1.5mm 0 0 0;
    font-size:11pt;
    line-height:1.25;
  }
  .print-options span{
    display:inline-block;
    margin:0 5mm 1mm 0;
  }
  .print-prompt .choice-grid,.print-prompt .answer-row{display:none!important;}
  .solution-grid{
    margin:2.2mm 0 0 6.5mm;
    border:0.22mm solid #d6d6d6;
    background:#fff;
    position:relative;
    overflow:hidden;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  /* Клетка построена реальными линиями, а не фоновым градиентом.
     Поэтому она сохраняется и при window.print(), и при html2canvas/html2pdf. */
  .solution-grid .grid-v,
  .solution-grid .grid-h{
    position:absolute;
    display:block;
    pointer-events:none;
    z-index:1;
  }
  .solution-grid .grid-v{
    top:0;
    bottom:0;
    width:0;
    border-left:0.18mm solid #dddddd;
  }
  .solution-grid .grid-h{
    left:0;
    right:0;
    height:0;
    border-top:0.18mm solid #dddddd;
  }
  .solution-grid.grid-small{height:25mm;}
  .solution-grid.grid-medium{height:30mm;}
  .solution-grid.grid-large{height:35mm;}
  .solution-grid.grid-xlarge{height:40mm;}

  .pdf-mode{padding:0;}

  .preview-page-wrap{position:relative;margin:0 auto 12mm;}
  .preview-page-actions{
    display:flex;justify-content:flex-end;gap:7px;
    width:190mm;margin:0 auto 5px;
    font-family:Inter,Segoe UI,Arial,sans-serif;
  }
  .preview-page-actions .export-btn{font-size:12px;padding:6px 9px;}



  /* Предпросмотр печати / PDF */
  .print-preview-modal{
    position:fixed;
    inset:0;
    z-index:250;
    display:none;
    grid-template-rows:auto 1fr;
    background:rgba(20,25,20,.58);
    backdrop-filter:blur(4px);
  }
  .print-preview-modal.open{display:grid;}
  .print-preview-toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:0 4px 18px rgba(0,0,0,.12);
  }
  .print-preview-toolbar strong{color:var(--primary);margin-right:auto;}
  .print-preview-toolbar .preview-hint{
    color:var(--muted);
    font-size:.9rem;
  }
  .print-preview-body{
    overflow:auto;
    padding:22px;
  }
  .print-preview-paper{
    width:210mm;
    min-height:297mm;
    margin:0 auto 24px;
    padding:10mm;
    background:#fff;
    box-shadow:0 10px 35px rgba(0,0,0,.24);
  }
  .preview-sheet .print-page{
    width:190mm;
    min-height:277mm;
    margin:0 auto;
    box-shadow:0 0 0 1px #e7e7e7;
  }
  .preview-sheet .preview-page-wrap:last-child{margin-bottom:0;}
  .print-size-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin:1.4mm 0 0 6.5mm;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    font-size:10px;
    color:#666;
  }
  .print-size-row span{margin-right:2px;}
  .print-size-btn{
    border:1px solid #cfcfcf;
    border-radius:6px;
    background:#fff;
    color:#444;
    padding:3px 7px;
    cursor:pointer;
    font-size:10px;
    line-height:1.2;
  }
  .print-size-btn.active{
    background:#e7eedc;
    border-color:#89a46d;
    color:#38502d;
    font-weight:700;
  }
  @media (max-width:900px){
    .print-preview-toolbar{flex-wrap:wrap;}
    .print-preview-toolbar strong{width:100%;}
    .print-preview-toolbar .preview-hint{display:none;}
    .print-preview-body{padding:10px;}
    .print-preview-paper{transform-origin:top left;}
  }



  /* Расширенные интерактивные типы заданий */
  .task-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .meta-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--primary-soft);border:1px solid var(--border);font-size:.78rem;font-weight:800;color:var(--primary)}
  /* Математическая запись отображается прямо внутри поля ответа */
  .math-answer-box{position:relative;min-width:220px;flex:1;min-height:48px}
  .math-answer-box .answer-input{position:relative;z-index:2;width:100%;min-width:0;background:transparent;color:transparent;caret-color:var(--primary)}
  .math-answer-box .answer-input::placeholder{color:var(--muted);opacity:.9}
  .math-answer-box.has-value .answer-input::placeholder{color:transparent}
  .math-answer-render{position:absolute;z-index:1;inset:0;display:flex;align-items:center;padding:12px 14px;border:2px solid transparent;border-radius:12px;color:var(--text);pointer-events:none;overflow:hidden;white-space:nowrap}
  .math-answer-box:focus-within .math-answer-render{border-color:var(--primary)}
  .math-answer-render mjx-container{margin:0!important;max-width:100%}
  .math-inline-answer{position:relative;display:inline-block;min-width:92px;min-height:38px;vertical-align:middle;margin:2px 4px}
  .math-inline-answer .fill-input{position:relative;z-index:2;width:100%;min-width:92px;margin:0;background:transparent;color:transparent;caret-color:var(--primary)}
  .math-inline-answer .fill-input::placeholder{color:var(--muted)}
  .math-inline-render{position:absolute;z-index:1;inset:0;display:flex;align-items:center;justify-content:center;padding:6px 9px;border:2px solid transparent;border-radius:8px;color:var(--text);pointer-events:none;white-space:nowrap;overflow:hidden}
  .math-inline-answer:focus-within .math-inline-render{border-color:var(--primary)}
  .math-inline-render mjx-container{margin:0!important}

  /* Экранная математическая клавиатура */
  .math-keyboard{margin:6px 0 9px;padding:6px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
  .math-keyboard-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
  .math-keyboard-head strong{font-size:.78rem;color:var(--primary)}
  .math-keyboard-head span{font-size:.68rem!important;white-space:nowrap}
  .math-keyboard-body{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px;align-items:start}
  .math-keyboard-digits{display:grid;grid-template-columns:repeat(3,44px);gap:4px;width:max-content}
  .math-keyboard-ops{display:grid;grid-template-columns:repeat(5,minmax(40px,56px));gap:4px;justify-content:start}
  .math-key{min-height:34px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-weight:800;font-size:.9rem;padding:4px 3px;line-height:1;touch-action:manipulation}
  .math-key.key-zero{grid-column:span 1}
  .math-key.key-wide{grid-column:span 2}
  .math-key:hover,.math-key:focus-visible{background:var(--primary-soft);border-color:var(--primary);outline:none}
  .math-key.key-action{color:var(--primary);background:color-mix(in srgb,var(--primary-soft) 75%,var(--surface))}
  .math-key.key-danger{color:var(--danger)}
  .math-source.keyboard-target{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 16%,transparent)}
  @media(max-width:650px){
    .math-keyboard{padding:5px;margin:5px 0 8px}
    .math-keyboard-head span{display:none}
    .math-keyboard-body{grid-template-columns:max-content minmax(0,1fr);gap:6px}
    .math-keyboard-digits{grid-template-columns:repeat(3,42px);gap:4px;width:max-content}
    .math-keyboard-ops{grid-template-columns:repeat(4,minmax(40px,1fr));gap:4px}
    .math-key{min-height:38px;font-size:.92rem;padding:4px 2px}
  }
  .order-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .order-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
  .order-handle{font-size:1.15rem;color:var(--muted);cursor:grab;user-select:none}
  .order-move{display:flex;gap:4px}
  .order-move button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:4px 8px}

const SESSION_KEY = "parallelogramLesson_v1";

function loadSessionState(){
  try{
    const saved=JSON.parse(sessionStorage.getItem(SESSION_KEY) || "{}");
    return {
      topic:Number.isInteger(saved.topic) ? saved.topic : 0,
      task:Number.isInteger(saved.task) ? saved.task : 0,
      completed:saved.completed && typeof saved.completed==="object" ? saved.completed : {},
      answers:saved.answers && typeof saved.answers==="object" ? saved.answers : {},
      checked:saved.checked && typeof saved.checked==="object" ? saved.checked : {},
      attempts:saved.attempts && typeof saved.attempts==="object" ? saved.attempts : {},
      variantIndex:saved.variantIndex && typeof saved.variantIndex==="object" ? saved.variantIndex : {}
    };
  }catch(e){
    return {topic:0,task:0,completed:{},answers:{},checked:{},attempts:{},variantIndex:{}};
  }
}

};

function currentTaskKey(){
  const topic=workbook[state.topic];
  return topic ? `${topic.id}_${state.task}` : "";
}

function saveSessionState(){
  try{
    sessionStorage.setItem(SESSION_KEY,JSON.stringify({
      topic:state.topic, task:state.task, completed:state.completed,
      answers:state.answers, checked:state.checked, attempts:state.attempts,
      variantIndex:state.variantIndex
    }));
  }catch(e){ console.warn("Не удалось сохранить состояние вкладки:",e); }
}

/* Единая очередь MathJax: вызывается после каждого динамического рендера. */
let mathTypesetQueue=Promise.resolve();
function typesetDynamic(nodes){
  const list=(Array.isArray(nodes)?nodes:[nodes]).filter(Boolean);
  if(!list.length) return mathTypesetQueue;
  mathTypesetQueue=mathTypesetQueue.then(async()=>{
    try{
      if(window.MathJax?.startup?.promise) await MathJax.startup.promise;
      if(!window.MathJax?.typesetPromise) return;
      if(MathJax.typesetClear) MathJax.typesetClear(list);
      await MathJax.typesetPromise(list);
    }catch(e){ console.warn("MathJax render:",e); }
  });
  return mathTypesetQueue;
}

function adaptTask(raw){
  const t={...raw};
  if(!t.prompt && t.question!=null) t.prompt=`<div class="question">${t.question}</div>`;
  if(!t.prompt) t.prompt="";
  if(!t.instruction) t.instruction="";
  if(!t.title) t.title="Задание";
  if(t.type==="matching" && Array.isArray(t.pairs)){
    t.left=t.pairs.map(p=>p.left);
    t.right=t.pairs.map(p=>p.right);
    if(!Array.isArray(t.answer)) t.answer=t.pairs.map((_,i)=>i);
  }
  return t;
}

function baseTask(){ return adaptTask(workbook[state.topic].tasks[state.task]); }
function activeTask(){
  const base=baseTask();
  const idx=Number(state.variantIndex[currentTaskKey()]||0);
  if(idx<=0 || !Array.isArray(base.variants) || !base.variants[idx-1]) return base;
  return adaptTask({...base,...base.variants[idx-1],variants:base.variants});
}

function escapeAttr(v){ return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function taskMetaMarkup(task){
  const chips=[];
  if(task.skill) chips.push(`<span class="meta-chip">Навык: ${task.skill}</span>`);
  if(task.difficulty) chips.push(`<span class="meta-chip">Сложность: ${'●'.repeat(Math.max(1,Math.min(5,Number(task.difficulty))))}</span>`);
  (Array.isArray(task.tags)?task.tags:[]).forEach(tag=>chips.push(`<span class="meta-chip">#${tag}</span>`));
  return chips.length?`<div class="task-meta">${chips.join('')}</div>`:'';
}

function imageMarkup(task,key){

  if(!img?.src) return '';
  let width=img.width||task.imageWidth||'560px'; if(typeof width==='number') width=width+'px';
  const draw=img.draw!==false;
  return `<div class="image-toolbar" ${draw?'':'hidden'}>${draw?inkToolbarMarkup():''}</div>
    <div class="task-image-wrap" style="width:min(${escapeAttr(width)},100%)" data-image-key="${key}">

      ${draw?'<canvas class="image-draw-canvas" aria-label="Рисование по изображению"></canvas>':''}
    </div>`;
}

function mathKeyboardMarkup(){
  const digits=[
    ['7','7'],['8','8'],['9','9'],
    ['4','4'],['5','5'],['6','6'],
    ['1','1'],['2','2'],['3','3'],
    ['0','0','key-zero'],[',',','],['.','.']
  ];
  const ops=[
    ['+','+'],['−','-'],['×','*'],['÷','/'],['=','='],
    ['(', '('],[')', ')'],[';',';'],['π','pi'],['√','SQRT'],
    ['x','x'],['y','y'],['x²','^2'],['xⁿ','^'],['±','+-'],
    ['←','LEFT','key-action'],['→','RIGHT','key-action'],['⌫','BACKSPACE','key-action'],
    ['Очистить','CLEAR','key-danger key-wide']
  ];
  const buttons=arr=>arr.map(([label,value,cls=''])=>`<button type="button" class="math-key ${cls}" data-key="${escapeAttr(value)}">${label}</button>`).join('');
  return `<div class="math-keyboard" data-math-keyboard>
    <div class="math-keyboard-head"><strong>Клавиатура</strong><span style="color:var(--muted)">Вставка в позицию курсора</span></div>
    <div class="math-keyboard-body">
      <div class="math-keyboard-digits" aria-label="Цифры">${buttons(digits)}</div>
      <div class="math-keyboard-ops" aria-label="Математические действия">${buttons(ops)}</div>
    </div>

}

      <div class="math-answer-render" aria-hidden="true"></div>
    </div>
  </div>${mathKeyboardMarkup()}`;
}

function inputToTex(raw){
  let s=String(raw||'').trim();
  if(!s) return '';
  s=s.replace(/π/g,'pi').replace(/\*/g,'\\cdot ');
  s=s.replace(/sqrt\(([^()]+)\)/gi,'\\sqrt{$1}');
  s=s.replace(/pi/gi,'\\pi ');
  const simple=s.match(/^([+-]?(?:\d+(?:[.,]\d+)?|\d*\\pi(?:\s*\^\s*\d+)?))\s*\/\s*([+-]?(?:\d+(?:[.,]\d+)?|\d*\\pi(?:\s*\^\s*\d+)?))$/i);
  if(simple) s=`\\frac{${simple[1]}}{${simple[2]}}`;
  s=s.replace(/\^\s*([+-]?\d+)/g,'^{$1}').replace(/,/g,'{,}');
  return s;
}

function updateMathField(input){
  if(!input) return;
  const box=input.closest('.math-answer-box, .math-inline-answer');
  if(!box) return;
  const target=box.querySelector('.math-answer-render, .math-inline-render');
  if(!target) return;
  const tex=inputToTex(input.value);
  box.classList.toggle('has-value',Boolean(input.value));
  target.innerHTML=tex?`\\(${tex}\\)`:'';
  typesetDynamic(target);
}

function orderMarkup(task,saved){
  const items=Array.isArray(task.items)?task.items:[];
  let order=Array.isArray(saved)&&saved.length===items.length?saved.map(Number):items.map((_,i)=>i);
  return `<div class="order-list" id="orderList">${order.map((idx,pos)=>`
    <div class="order-item" draggable="true" data-index="${idx}">
      <span class="order-handle">☰</span><span>${items[idx]}</span>
      <span class="order-move"><button type="button" data-move="up" aria-label="Вверх">↑</button><button type="button" data-move="down" aria-label="Вниз">↓</button></span>
    </div>`).join('')}</div>`;
}

function matchingMarkup(task,saved){
  const left=task.left||[], right=task.right||[];
  const map=(saved&&typeof saved==='object'&&!Array.isArray(saved))?saved:{};
  return `<div class="matching-grid" id="matchingGrid">${left.map((l,i)=>`
    <div class="matching-left">${l}</div>
    <div class="match-options" data-left="${i}">${right.map((r,j)=>`<button type="button" class="btn ${Number(map[i])===j?'btn-soft':''}" data-right="${j}">${r}</button>`).join(' ')}</div>`).join('')}</div>`;
}

function fillMarkup(task,saved){
  const vals=Array.isArray(saved)?saved:[];
  const inlineField=i=>`<span class="math-inline-answer ${vals[Number(i)]?'has-value':''}"><input class="fill-input math-source" inputmode="none" data-blank="${i}" value="${escapeAttr(vals[Number(i)]||'')}" aria-label="Пропуск ${Number(i)+1}"><span class="math-inline-render" aria-hidden="true"></span></span>`;
  const prompt=(task.prompt||'').replace(/\{\{(\d+)\}\}/g,(_,i)=>inlineField(i));
  if(prompt!==task.prompt) return prompt+mathKeyboardMarkup();
  const count=Array.isArray(task.answer)?task.answer.length:Number(task.blanks||1);
  return task.prompt+`<div class="answer-row">${Array.from({length:count},(_,i)=>`<label>Поле ${i+1}: ${inlineField(i)}</label>`).join(' ')}</div>`+mathKeyboardMarkup();
}

function errorMarkup(task,saved){

}

function renderTask(){
  const topic=workbook[state.topic];
  const task=activeTask();
  const key=currentTaskKey();
  const savedAnswer=state.answers[key];

  el("topicInfo").innerHTML = `<p>${topic.info||''}</p>`;
  el("taskTitle").innerHTML = task.title;
  el("taskInstruction").innerHTML = task.instruction;
  el("feedback").className="feedback"; el("feedback").textContent="";

  let html=taskMetaMarkup(task);
  if(task.type==='fill') html += fillMarkup(task,savedAnswer);
  else html += task.prompt;
  html += imageMarkup(task,key);

  if(task.type==="input") html += mathInputMarkup(typeof savedAnswer==='string'?savedAnswer:'');
  if(task.type==="choice") html += `<div class="choice-grid">${(task.options||[]).map((o,i)=>`<label class="choice"><input type="radio" name="choice" value="${i}" ${Number(savedAnswer)===i?'checked':''}> <span>${o}</span></label>`).join('')}</div>`;
  if(task.type==="multi"){
    const selected=Array.isArray(savedAnswer)?savedAnswer.map(Number):[];
    html += `<div class="choice-grid">${(task.options||[]).map((o,i)=>`<label class="choice"><input type="checkbox" name="choice" value="${i}" ${selected.includes(i)?'checked':''}> <span>${o}</span></label>`).join('')}</div>`;
  }
  if(task.type==='order') html += orderMarkup(task,savedAnswer);
  if(task.type==='matching') html += matchingMarkup(task,savedAnswer);
  if(task.type==='error') html += errorMarkup(task,savedAnswer);

  el("taskContent").innerHTML = html;
  el("nextBtn").disabled = state.task >= topic.tasks.length-1;
  bindTaskInputs(task,key);
  bindTaskImages(key);
  setupTaskInkCanvas(key);

  if(state.checked[key]!==undefined){
    showFeedback(state.checked[key],state.checked[key]?"Верно ✓":"Ответ сохранён как неверный — можно исправить и проверить снова.");
  }
  typesetDynamic([el("topicInfo"),el("taskTitle"),el("taskInstruction"),el("taskContent")]);
}

let activeMathInput=null;

function setActiveMathInput(input){
  if(!input) return;
  document.querySelectorAll('.math-source.keyboard-target').forEach(x=>x.classList.remove('keyboard-target'));
  activeMathInput=input;
  input.classList.add('keyboard-target');
}

function insertMathKey(input,key){
  if(!input) return;
  const start=Number.isFinite(input.selectionStart)?input.selectionStart:input.value.length;
  const end=Number.isFinite(input.selectionEnd)?input.selectionEnd:start;
  let value=input.value;
  let nextPos=start;
  if(key==='CLEAR'){ value=''; nextPos=0; }
  else if(key==='BACKSPACE'){
    if(start!==end){ value=value.slice(0,start)+value.slice(end); nextPos=start; }
    else if(start>0){ value=value.slice(0,start-1)+value.slice(end); nextPos=start-1; }
  }else if(key==='LEFT'){ nextPos=Math.max(0,start-1); }
  else if(key==='RIGHT'){ nextPos=Math.min(value.length,end+1); }
  else{
    let insert=key;
    let cursorOffset=insert.length;
    if(key==='SQRT'){ insert='sqrt()'; cursorOffset=5; }
    value=value.slice(0,start)+insert+value.slice(end);
    nextPos=start+cursorOffset;
  }
  input.value=value;
  input.focus({preventScroll:true});
  try{ input.setSelectionRange(nextPos,nextPos); }catch(e){}
  input.dispatchEvent(new Event('input',{bubbles:true}));
}

function bindMathKeyboard(){
  const sources=[...document.querySelectorAll('#taskContent .math-source')];
  sources.forEach(input=>{
    input.addEventListener('focus',()=>setActiveMathInput(input));
    input.addEventListener('pointerdown',()=>setActiveMathInput(input));
  });
  if(sources.length) setActiveMathInput(sources[0]);
  document.querySelectorAll('#taskContent [data-math-keyboard] .math-key').forEach(btn=>{
    btn.addEventListener('pointerdown',e=>e.preventDefault());
    btn.addEventListener('click',()=>insertMathKey(activeMathInput,btn.dataset.key));
  });
}

function bindTaskInputs(task,key){
  const answerInput=el('studentAnswer');
  if(answerInput){
    updateMathField(answerInput);
    answerInput.addEventListener('input',e=>{saveAnswer(key,e.target.value);updateMathField(answerInput);});
  }
  document.querySelectorAll('input[name="choice"]').forEach(input=>input.addEventListener('change',()=>{
    if(task.type==='choice'){
      const selected=document.querySelector('input[name="choice"]:checked'); saveAnswer(key,selected?Number(selected.value):null);
    }else{
      saveAnswer(key,[...document.querySelectorAll('input[name="choice"]:checked')].map(x=>Number(x.value)));
    }
  }));
  document.querySelectorAll('.fill-input').forEach(input=>{
    updateMathField(input);
    input.addEventListener('input',()=>{
      const vals=[]; document.querySelectorAll('.fill-input').forEach(x=>vals[Number(x.dataset.blank)]=x.value);
      saveAnswer(key,vals);
      updateMathField(input);
    });
  });
  document.querySelectorAll('.error-line').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('.error-line').forEach(x=>x.classList.toggle('selected',x===btn)); saveAnswer(key,Number(btn.dataset.errorIndex));
  });
  document.querySelectorAll('.match-options').forEach(group=>group.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    const map=(state.answers[key]&&typeof state.answers[key]==='object'&&!Array.isArray(state.answers[key]))?{...state.answers[key]}:{};
    map[Number(group.dataset.left)]=Number(btn.dataset.right); saveAnswer(key,map);
    group.querySelectorAll('button').forEach(x=>x.classList.toggle('btn-soft',x===btn));
  }));
  bindOrderList(key);
  bindMathKeyboard();
}

function bindOrderList(key){
  const list=el('orderList'); if(!list) return;
  const save=()=>saveAnswer(key,[...list.querySelectorAll('.order-item')].map(x=>Number(x.dataset.index)));
  let dragged=null;
  list.querySelectorAll('.order-item').forEach(item=>{
    item.addEventListener('dragstart',()=>dragged=item);
    item.addEventListener('dragover',e=>{e.preventDefault(); if(!dragged||dragged===item)return; const r=item.getBoundingClientRect(); list.insertBefore(dragged,e.clientY<r.top+r.height/2?item:item.nextSibling);});
    item.addEventListener('drop',e=>{e.preventDefault();save();});
    item.querySelectorAll('[data-move]').forEach(btn=>btn.onclick=()=>{
      if(btn.dataset.move==='up'&&item.previousElementSibling) list.insertBefore(item,item.previousElementSibling);
      if(btn.dataset.move==='down'&&item.nextElementSibling) list.insertBefore(item.nextElementSibling,item);
      save();
    });
  });
}

function normalize(s){ return String(s).trim().toLowerCase().replace(/\s+/g," ").replace(/−/g,'-'); }
function answerMatches(given,expected){
  if(Array.isArray(expected)) return expected.some(x=>normalize(x)===normalize(given));
  return normalize(given)===normalize(expected);
}

function checkCurrent(){
  const task=activeTask(), base=baseTask(), key=currentTaskKey();
  let correct=false;
  const saved=state.answers[key];
  if(task.type==='input') correct=(Array.isArray(task.answer)?task.answer:[task.answer]).filter(x=>x!=null).some(a=>normalize(a)===normalize(saved||''));
  if(task.type==='choice') correct=Number(saved)===Number(task.answer);
  if(task.type==='multi') correct=JSON.stringify([...(saved||[])].map(Number).sort((a,b)=>a-b))===JSON.stringify([...(task.answer||[])].map(Number).sort((a,b)=>a-b));
  if(task.type==='order'){
    const exp=(task.answer||task.correctOrder||[]).map(Number); correct=JSON.stringify(saved||[])===JSON.stringify(exp);
  }
  if(task.type==='matching'){
    const exp=task.answer||Array.from({length:(task.left||[]).length},(_,i)=>i);
    correct=exp.every((v,i)=>Number(saved?.[i])===Number(v));
  }
  if(task.type==='fill'){
    const exp=task.answer||[]; correct=exp.every((v,i)=>answerMatches((saved||[])[i]||'',v));
  }
  if(task.type==='error') correct=Number(saved)===Number(task.answer??task.errorIndex);

  state.attempts[key]=(state.attempts[key]||0)+1;
  state.checked[key]=!!correct;
  if(correct) state.completed[key]=true;
  saveSessionState(); updateProgress(); renderTaskNav();

  if(correct){ showFeedback(true,"Верно ✓"); return; }
  const idx=Number(state.variantIndex[key]||0);
  if(Array.isArray(base.variants) && idx<base.variants.length){
    state.variantIndex[key]=idx+1; delete state.answers[key]; delete state.checked[key]; saveSessionState(); renderTask();
    showFeedback(false,"Есть ошибка. Открыт аналогичный пример того же типа — попробуйте ещё раз.");
    const fb=el('feedback'); fb.classList.add('show','bad');
    return;
  }
  showFeedback(false,"Неверно. Проверьте решение и попробуйте ещё раз.");
}

function showFeedback(ok,text){ const fb=el('feedback'); fb.className='feedback show '+(ok?'ok':'bad'); fb.innerHTML=text; typesetDynamic(fb); }

function resetCurrent(){
  const key=currentTaskKey();
  delete state.answers[key]; delete state.completed[key]; delete state.checked[key]; delete state.attempts[key]; delete state.variantIndex[key];
  delete inkMemory.task[key]; delete inkMemory.image[key];
  saveSessionState(); updateProgress(); renderTask(); renderTaskNav();
}

function nextTask(){
  const max=workbook[state.topic].tasks.length-1;
  if(state.task<max){ state.task++; saveSessionState(); renderTaskNav(); renderTask(); renderMobileSelect(); window.scrollTo({top:0,behavior:"smooth"}); }
}

function updateProgress(){
  let total=0, done=0;
  workbook.forEach(t=>t.tasks.forEach((_,i)=>{ total++; if(state.completed[t.id+"_"+i]) done++; }));
  el("progressText").textContent=`${done} из ${total}`;
  el("progressBar").style.width=(total?done/total*100:0)+"%";
}

function setupDrawCanvas(canvas,restoreData,onSave){
  if(!canvas)return;
  const parent=canvas.parentElement;
  const resize=()=>{
    const rect=parent.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    canvas.width=Math.max(1,Math.round(rect.width*dpr)); canvas.height=Math.max(1,Math.round(rect.height*dpr));
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.lineCap='round';c.lineJoin='round';
    if(restoreData){const img=new Image();img.onload=()=>c.drawImage(img,0,0,rect.width,rect.height);img.src=restoreData;}
  };
  resize();
  let drawing=false,last={x:0,y:0};
  const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);last=point(e);};
  canvas.onpointermove=e=>{if(!drawing)return;const p=point(e),c=canvas.getContext('2d');c.save();c.globalCompositeOperation=inkSettings.mode==='eraser'?'destination-out':'source-over';c.strokeStyle=inkSettings.color;c.lineWidth=inkSettings.mode==='eraser'?18:inkSettings.width;c.beginPath();c.moveTo(last.x,last.y);c.lineTo(p.x,p.y);c.stroke();c.restore();last=p;};
  const stop=()=>{if(!drawing)return;drawing=false;try{onSave?.(canvas.toDataURL('image/png'));}catch(e){}};
  canvas.onpointerup=stop;canvas.onpointercancel=stop;canvas.onpointerleave=stop;
}

const modal=el("scratchModal");
const canvas=el("scratchCanvas");
const ctx=canvas.getContext("2d");
let drawing=false,lastX=0,lastY=0,mode="pen";

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const old=ctx.getImageData(0,0,canvas.width||1,canvas.height||1);
  canvas.width=Math.max(1,Math.floor(rect.width*dpr));
  canvas.height=Math.max(1,Math.floor(rect.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap="round";
  ctx.lineJoin="round";
}

function point(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener("pointerdown",e=>{
  drawing=true;
  canvas.setPointerCapture(e.pointerId);
  const p=point(e); lastX=p.x; lastY=p.y;
});
canvas.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=point(e);
  ctx.save();
  if(mode==="eraser"){
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=18;
  } else {
    ctx.globalCompositeOperation="source-over";
    ctx.strokeStyle=inkSettings.color;
    ctx.lineWidth=inkSettings.width;
  }
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.restore();
  lastX=p.x;lastY=p.y;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));

/* Печать и PDF: печатная версия в стиле образца */
const solutionSizeLabels={
  "grid-small":"Маленькое",
  "grid-medium":"Среднее",
  "grid-large":"Большое",
  "grid-xlarge":"Очень большое"
};
const solutionSizeOrder=["grid-small","grid-medium","grid-large","grid-xlarge"];
const printGridOverrides={};

function printableOptions(rawTask){
  const task=adaptTask(rawTask);
  if(task.type==='order' && Array.isArray(task.items)) return `<div class="print-options">${task.items.map((o,i)=>`<span>${i+1}) ${o}</span>`).join("")}</div>`;
  if(task.type==='matching' && Array.isArray(task.left)) return `<div class="print-options">${task.left.map((o,i)=>`<span>${i+1}) ${o} — ______</span>`).join("<br>")}</div>`;
  if(task.type==='error' && Array.isArray(task.lines)) return `<div class="print-options">${task.lines.map((o,i)=>`<span>${i+1}) ${o}</span>`).join("<br>")}</div>`;
  if(!Array.isArray(task.options) || !task.options.length) return "";
  return `<div class="print-options">${task.options.map((o,i)=>`<span>${i+1}) ${o}</span>`).join("")}</div>`;
}

function normalizedPrintGrid(value){
  if(value===false || value==='none') return false;
  const map={small:'grid-small',medium:'grid-medium',large:'grid-large',xlarge:'grid-xlarge'};
  return map[value] || value;
}

/* Высота поля решения подбирается автоматически, но task.printGrid имеет приоритет:
   false — без клетки; small/medium/large/xlarge — фиксированный размер. */
function solutionGridClass(rawTask){
  const task=adaptTask(rawTask);
  const configured=normalizedPrintGrid(task.printGrid);
  if(configured===false) return false;
  if(typeof configured==='string' && /^grid-(small|medium|large|xlarge)$/.test(configured)) return configured;
  const plain=(task.prompt||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  const displayMath=((task.prompt||"").match(/\$\$/g)||[]).length/2;
  const title=(task.title||"").toLowerCase();
  const instruction=(task.instruction||"").toLowerCase();
  let score=0;
  if(plain.length>170) score++;
  if(plain.length>300) score++;
  if(displayMath>=2) score++;
  if(/решите|доказ|восстанов|найдите ошиб|самостоятель/.test(title+" "+instruction)) score++;
  if(score>=4) return "grid-xlarge";
  if(score>=2) return "grid-large";
  if(score===1) return "grid-medium";
  return "grid-small";
}

function allPrintableTasks(){
  const tasks=[];
  workbook.forEach((topic,topicIndex)=>topic.tasks.forEach((raw,taskIndex)=>{
    tasks.push({task:adaptTask(raw), key:`${topic.id}_${taskIndex}`, topicIndex, taskIndex});
  }));
  return tasks;
}

function sizeControls(key,current){
  if(current===false) return `<div class="print-size-row" data-size-key="${key}"><span>Поле: отключено в настройках задания</span></div>`;
  return `<div class="print-size-row" data-size-key="${key}">
    <span>Поле:</span>
    ${solutionSizeOrder.map(size=>`<button type="button" class="print-size-btn ${size===current?'active':''}" data-size="${size}">${solutionSizeLabels[size]}</button>`).join("")}
  </div>`;
}

/* Реальные линии клетки с шагом 5 мм. */
function solutionGridLines(){
  const vertical=Array.from({length:40},(_,i)=>`<i class="grid-v" style="left:${(i+1)*5}mm"></i>`).join("");
  const horizontal=Array.from({length:10},(_,i)=>`<i class="grid-h" style="top:${(i+1)*5}mm"></i>`).join("");
  return vertical+horizontal;
}

function printablePrompt(task){
  let prompt=task.prompt||'';
  if(task.type==='fill') prompt=prompt.replace(/\{\{\d+\}\}/g,'__________');
  const img=task.image ? (typeof task.image==='string'?{src:task.image}:task.image) : null;
  if(img?.src) prompt += `<div style="text-align:center;margin:2mm 0"><img src="${escapeAttr(img.src)}" alt="${escapeAttr(img.alt||'Рисунок')}" style="max-width:120mm;max-height:75mm;object-fit:contain"></div>`;
  return prompt;
}

function printTaskMarkup(item,globalNumber,{preview=false}={}){
  const {task,key}=item;
  const auto=solutionGridClass(task);
  const gridClass=auto===false?false:(printGridOverrides[key] || auto);
  return `<section class="print-task" data-task-key="${key}">
    <div class="print-question-row">
      <div class="print-num">${globalNumber}.</div>
      <div class="print-prompt">${printablePrompt(task)}${printableOptions(task)}</div>
    </div>
    ${preview?sizeControls(key,gridClass):''}
    ${gridClass===false?'':`<div class="solution-grid ${gridClass}" data-grid-key="${key}" aria-label="Место для решения">${solutionGridLines()}</div>`}
  </section>`;
}

function mmPixels(mm){
  const probe=document.createElement("div");
  probe.style.cssText=`position:absolute;visibility:hidden;width:1mm;height:${mm}mm;`;
  document.body.appendChild(probe);
  const px=probe.getBoundingClientRect().height;
  probe.remove();
  return px;
}

/* Раскладка больше не привязана к фиксированным 5 заданиям.
   Сначала браузер измеряет реальную высоту каждого задания вместе с выбранным
   полем решения и отрендеренными формулами MathJax, затем на A4 помещается
   максимально возможное число ЦЕЛЫХ заданий. */
async function buildPaginatedMarkup({preview=false,onlyPage=null}={}){
  const tasks=allPrintableTasks();
  const measure=document.createElement("div");
  measure.className="print-sheet";
  measure.style.cssText="position:fixed;left:-12000px;top:0;visibility:hidden;width:190mm;background:#fff;";
  measure.innerHTML=tasks.map((item,i)=>printTaskMarkup(item,i+1,{preview})).join("");
  document.body.appendChild(measure);
  await typesetPrintNode(measure);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

  const pageHeight=mmPixels(277);
  const pages=[];
  let current=[];
  let used=0;
  [...measure.querySelectorAll(".print-task")].forEach((node,i)=>{
    const cs=getComputedStyle(node);
    const h=node.getBoundingClientRect().height + parseFloat(cs.marginTop||0) + parseFloat(cs.marginBottom||0);
    if(current.length && used+h>pageHeight){
      pages.push(current);
      current=[];
      used=0;
    }
    current.push(i);
    used+=h;
  });
  if(current.length) pages.push(current);
  measure.remove();

  const selected=onlyPage==null ? pages : (pages[onlyPage] ? [pages[onlyPage]] : []);
  let html=`<div class="print-sheet ${preview?'preview-sheet':''}">`;
  selected.forEach((indexes,localPageIndex)=>{
    const sourcePageIndex=onlyPage==null ? localPageIndex : onlyPage;
    if(preview){
      html += `<div class="preview-page-wrap" data-preview-page="${sourcePageIndex}">
        <div class="preview-page-actions">
          <button type="button" class="export-btn print-one-page" data-page="${sourcePageIndex}">🖨 Печать страницы ${sourcePageIndex+1}</button>
          <button type="button" class="export-btn pdf-one-page" data-page="${sourcePageIndex}">⬇ PDF страницы ${sourcePageIndex+1}</button>
        </div>`;
    }
    html += `<div class="print-page" data-page-index="${sourcePageIndex}">`;
    indexes.forEach(taskIndex=>{ html += printTaskMarkup(tasks[taskIndex],taskIndex+1,{preview}); });
    html += `</div>`;
    if(preview) html += `</div>`;
  });
  html += `</div>`;
  return html;
}

async function buildPrintableSheet(onlyPage=null){
  const root=el("printSheet");
  root.innerHTML=await buildPaginatedMarkup({preview:false,onlyPage});
  return root.querySelector(".print-sheet");
}

async function typesetPrintNode(node){
  if(window.MathJax?.startup?.promise){
    try{ await MathJax.startup.promise; }catch(e){}
  }
  if(window.MathJax?.typesetPromise && node){
    try{
      if(MathJax.typesetClear) MathJax.typesetClear([node]);
      await MathJax.typesetPromise([node]);
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    }catch(e){ console.warn("MathJax print render:",e); }
  }
}

async function preparePrintableMath(onlyPage=null){
  const sheet=await buildPrintableSheet(onlyPage);
  await typesetPrintNode(sheet);
  return sheet;
}

async function exportWorkbookPdf(onlyPage=null){
  const root=el("printSheet");
  root.classList.add("export-render");
  try{
    const sheet=await preparePrintableMath(onlyPage);
    if(typeof html2pdf==="undefined"){
      alert("Модуль PDF ещё загружается. Повторите попытку через пару секунд.");
      return;
    }

    /* MathJax 3 здесь уже превратил TeX в обычные inline-SVG.
       Держим узел видимым для html2canvas до завершения снимка и ждём шрифты. */
    if(document.fonts?.ready) await document.fonts.ready;
    await typesetPrintNode(sheet);
    await new Promise(resolve=>setTimeout(resolve,60));

    sheet.classList.add("pdf-mode");
    const base=(document.title || "Рабочий лист").replace(/[\\/:*?"<>|]+/g,"_");
    const filename=onlyPage==null ? `${base}.pdf` : `${base}_страница_${onlyPage+1}.pdf`;
    const options={
      margin:[10,10,10,10],
      filename,
      image:{type:"png",quality:1},
      html2canvas:{
        scale:2.2,
        useCORS:true,
        allowTaint:false,
        backgroundColor:"#ffffff",
        scrollX:0,scrollY:0,
        logging:false
      },
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],after:[".print-page:not(:last-child)"],avoid:[".print-task","mjx-container"]}
    };
    try{
      await html2pdf().set(options).from(sheet).save();
    }finally{
      sheet.classList.remove("pdf-mode");
    }
  }finally{
    root.classList.remove("export-render");
  }
}

el("previewBtn").onclick=openPrintPreview;
el("printBtn").onclick=openPrintPreview;
el("pdfBtn").onclick=openPrintPreview;
el("closePreviewBtn").onclick=closePrintPreview;
el("previewPrintBtn").onclick=async()=>{ closePrintPreview(); await printWorkbook(); };
el("previewPdfBtn").onclick=async()=>{ closePrintPreview(); await exportWorkbookPdf(); };
el("printPreviewModal").addEventListener("click",e=>{ if(e.target===el("printPreviewModal")) closePrintPreview(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && el("printPreviewModal").classList.contains("open")) closePrintPreview(); });

/* Кнопки */
el("checkBtn").onclick=checkCurrent;
el("resetBtn").onclick=resetCurrent;
el("nextBtn").onclick=nextTask;
el("mobileTaskSelect").onchange=e=>{
  state.task=Number(e.target.value);
  saveSessionState();
  renderTaskNav();
  renderTask();
};

document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));

if(!workbook[state.topic]) state.topic=0;
if(!workbook[state.topic]?.tasks[state.task]) state.task=0;
saveSessionState();
applyTheme(state.theme);
renderAll();
</script>

<script>
(function(){
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function len(a,b){return Math.hypot(b.x-a.x,b.y-a.y);}
  function angleAt(prev,o,next){
    const v1={x:prev.x-o.x,y:prev.y-o.y},v2={x:next.x-o.x,y:next.y-o.y};
    const dot=v1.x*v2.x+v1.y*v2.y, den=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
    return Math.acos(clamp(dot/den,-1,1))*180/Math.PI;
  }
  function arcPath(prev,o,next,r){
    const a1=Math.atan2(prev.y-o.y,prev.x-o.x), a2=Math.atan2(next.y-o.y,next.x-o.x);
    let d=a2-a1; while(d<=-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
    const end=a1+d;
    const p1={x:o.x+r*Math.cos(a1),y:o.y+r*Math.sin(a1)}, p2={x:o.x+r*Math.cos(end),y:o.y+r*Math.sin(end)};
    return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 0 ${d>0?1:0} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  function lineMark(svg,p,q,count=1,cls='side-mark'){
    const mx=(p.x+q.x)/2,my=(p.y+q.y)/2,dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,tx=dx/L,ty=dy/L;
    for(let i=0;i<count;i++){
      const off=(i-(count-1)/2)*8, cx=mx+tx*off,cy=my+ty*off;
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('class',cls);l.setAttribute('x1',cx-nx*7);l.setAttribute('y1',cy-ny*7);l.setAttribute('x2',cx+nx*7);l.setAttribute('y2',cy+ny*7);svg.appendChild(l);
    }
  }
  function initDemo(root){
    if(root.dataset.ready==='1')return; root.dataset.ready='1';
    const svg=root.querySelector('.para-svg'),poly=svg.querySelector('.quad'),hb=svg.querySelector('.handle-b'),hd=svg.querySelector('.handle-d');
    const diagAC=svg.querySelector('.diag-ac'),diagBD=svg.querySelector('.diag-bd');
    const arcs=svg.querySelector('.angle-arcs'),sideMarks=svg.querySelector('.side-marks'),diagMarks=svg.querySelector('.diag-marks'),labels=svg.querySelector('.labels'),read=root.querySelector('.demo-readout');
    let A={x:115,y:260}, B={x:210,y:85}, D={x:430,y:260}, mode='sides';
    const mkText=(name,p,dx,dy)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.textContent=name;t.setAttribute('x',p.x+dx);t.setAttribute('y',p.y+dy);labels.appendChild(t);};
    function render(){
      const C={x:B.x+D.x-A.x,y:B.y+D.y-A.y};
      poly.setAttribute('points',`${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y} ${D.x},${D.y}`);
      hb.setAttribute('cx',B.x);hb.setAttribute('cy',B.y);hd.setAttribute('cx',D.x);hd.setAttribute('cy',D.y);
      diagAC.setAttribute('x1',A.x);diagAC.setAttribute('y1',A.y);diagAC.setAttribute('x2',C.x);diagAC.setAttribute('y2',C.y);
      diagBD.setAttribute('x1',B.x);diagBD.setAttribute('y1',B.y);diagBD.setAttribute('x2',D.x);diagBD.setAttribute('y2',D.y);
      arcs.innerHTML='';sideMarks.innerHTML='';diagMarks.innerHTML='';labels.innerHTML='';
      mkText('A',A,-28,22);mkText('B',B,-18,-12);mkText('C',C,10,-8);mkText('D',D,10,25);
      diagAC.classList.toggle('visible',mode==='diags');diagBD.classList.toggle('visible',mode==='diags');
      if(mode==='angles'){
        [[D,A,B],[A,B,C],[B,C,D],[C,D,A]].forEach((z,i)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','angle-path');p.setAttribute('d',arcPath(z[0],z[1],z[2],i%2===0?34:27));arcs.appendChild(p);});
      }
      if(mode==='sides'){
        lineMark(sideMarks,A,B,1);lineMark(sideMarks,C,D,1);lineMark(sideMarks,B,C,2);lineMark(sideMarks,D,A,2);
      }
      if(mode==='diags'){
        const O={x:(A.x+C.x)/2,y:(A.y+C.y)/2};
        lineMark(diagMarks,A,O,1,'diag-mark');lineMark(diagMarks,O,C,1,'diag-mark');lineMark(diagMarks,B,O,2,'diag-mark');lineMark(diagMarks,O,D,2,'diag-mark');
        const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',O.x);dot.setAttribute('cy',O.y);dot.setAttribute('r',5);dot.setAttribute('fill','#4d73b9');diagMarks.appendChild(dot);
      }
      const a=Math.round(angleAt(D,A,B)), b=180-a;
      read.innerHTML=`<span class="read-chip">AB = CD ≈ ${len(A,B).toFixed(0)}</span><span class="read-chip">BC = AD ≈ ${len(B,C).toFixed(0)}</span><span class="read-chip">∠A = ∠C ≈ ${a}°</span><span class="read-chip">∠B = ∠D ≈ ${b}°</span>`;
    }
    function drag(which,e){
      const r=svg.getBoundingClientRect(),sx=620/r.width,sy=360/r.height;
      const x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sy;
      if(which==='B') B={x:clamp(x,135,330),y:clamp(y,45,210)};
      else D={x:clamp(x,300,510),y:clamp(y,185,315)};
      render();
    }
    [['B',hb],['D',hd]].forEach(([name,h])=>{let on=false;h.addEventListener('pointerdown',e=>{on=true;h.setPointerCapture(e.pointerId);e.preventDefault();});h.addEventListener('pointermove',e=>{if(on)drag(name,e)});h.addEventListener('pointerup',()=>on=false);h.addEventListener('pointercancel',()=>on=false);});
    root.querySelectorAll('.demo-mode').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;root.querySelectorAll('.demo-mode').forEach(x=>x.classList.toggle('active',x===btn));render();});
    render();
  }
  window.initParallelogramDemos=function(){document.querySelectorAll('[data-para-demo]').forEach(initDemo)};
  const original=window.renderTask;
  if(typeof original==='function'){
    window.renderTask=function(){const r=original.apply(this,arguments);setTimeout(window.initParallelogramDemos,0);return r;};
  }
  setTimeout(window.initParallelogramDemos,0);
})();
</script>
