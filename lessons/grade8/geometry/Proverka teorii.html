<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Геометрическая экспедиция — теория 8 класса</title>
<style>
:root{
  --bg:#f4f1e8; --paper:#fffdf7; --ink:#233229; --muted:#65736a;
  --green:#587a62; --green2:#7f9a78; --gold:#c79c4b; --line:#d9d4c7;
  --danger:#a55353; --ok:#3f7a55; --shadow:0 12px 30px rgba(45,55,45,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eef2ea,#f7f2e8);color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:18px}
.top{
  background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px 20px;
  display:flex;gap:16px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:8px;z-index:20
}
.title h1{margin:0;font-size:clamp(22px,3vw,34px)}
.title p{margin:5px 0 0;color:var(--muted)}
.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.badge{background:#eef3ec;border:1px solid #d6e1d3;border-radius:999px;padding:9px 12px;font-weight:700}
.progress-wrap{margin:16px 0;background:#dfe5dd;border-radius:999px;height:12px;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--gold));transition:.35s}
.layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.top{position:static}.hud{justify-content:flex-start}}
.map,.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.map{padding:14px;height:max-content}
.map h2{font-size:18px;margin:4px 6px 12px}
.zone-btn{
 width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px;border-radius:14px;margin:7px 0;
 display:flex;gap:10px;align-items:center;color:var(--ink)
}
.zone-btn.active{border-color:var(--green);background:#edf3ed}
.zone-btn.done{background:#f3f1e6}
.zone-icon{font-size:22px}
.zone-text b{display:block}.zone-text small{color:var(--muted)}
.panel{padding:20px;min-height:590px}
.hero{display:grid;grid-template-columns:1fr .8fr;gap:20px;align-items:center}
@media(max-width:650px){.hero{grid-template-columns:1fr}}
.hero-card{background:#f0f4ee;border:1px solid #dce5d9;border-radius:18px;padding:18px}
.hero-card h3{margin-top:0}
.hero-visual{min-height:220px;border-radius:18px;background:
 radial-gradient(circle at 70% 30%,rgba(199,156,75,.35),transparent 28%),
 linear-gradient(135deg,#dde8df,#f7ead1);display:flex;align-items:center;justify-content:center;font-size:90px}
.action{border:0;background:var(--green);color:white;padding:12px 18px;border-radius:12px;font-weight:800}
.action.secondary{background:#ece9df;color:var(--ink);border:1px solid var(--line)}
.action:disabled{opacity:.45;cursor:not-allowed}
.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.section-title h2{margin:0}
.theory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:650px){.theory-grid{grid-template-columns:1fr}}
.theory{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.theory b{display:block;margin-bottom:5px}
.theory p{margin:0;color:#445048;line-height:1.45}
.quiz-card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}
.qnum{font-size:13px;color:var(--muted);font-weight:700}
.question{font-size:20px;font-weight:800;line-height:1.35;margin:8px 0 16px}
.options{display:grid;gap:9px}
.opt{
  width:100%;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 14px;
  transition:.15s
}
.opt:hover{border-color:#aebaaa}
.opt.selected{border-color:var(--green);background:#eef4ee}
.opt.correct{border-color:var(--ok);background:#e7f4ea}
.opt.wrong{border-color:var(--danger);background:#f9e9e9}
.feedback{margin-top:14px;border-radius:12px;padding:12px;display:none;line-height:1.45}
.feedback.show{display:block}.feedback.ok{background:#e9f5eb;color:#245b35}.feedback.bad{background:#f8eaea;color:#7d3434}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.small-note{font-size:13px;color:var(--muted);margin-top:10px}
.result{text-align:center;padding:30px 10px}
.result .big{font-size:70px}
.result h2{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:20px auto}
.stat{background:#f1f4ef;border-radius:14px;padding:15px}
.stat b{font-size:25px;display:block}
.hidden{display:none!important}
.modal-back{
 position:fixed;inset:0;background:rgba(25,35,29,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50
}
.modal{background:var(--paper);max-width:720px;width:100%;max-height:82vh;overflow:auto;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin-top:0}
.close-row{display:flex;justify-content:flex-end}
.kbd{font-family:monospace;background:#eee9dc;border-radius:6px;padding:2px 6px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="title">
      <h1>🧭 Геометрическая экспедиция</h1>
      <p>Теория за 8 класс • 6 локаций • 30 вопросов</p>
    </div>
    <div class="hud">
      <div class="badge">⭐ <span id="score">0</span></div>
      <div class="badge">✅ <span id="correct">0</span>/30</div>
      <div class="badge">📍 <span id="doneZones">0</span>/6</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <div class="layout">
    <aside class="map">
      <h2>Карта экспедиции</h2>
      <div id="zoneList"></div>
      <button class="zone-btn" id="rulesBtn"><span class="zone-icon">ℹ️</span><span class="zone-text"><b>Как играть</b><small>Правила и подсказки</small></span></button>
      <button class="zone-btn" id="resetBtn"><span class="zone-icon">↻</span><span class="zone-text"><b>Начать заново</b><small>Сбросить прогресс</small></span></button>
    </aside>
    <main class="panel" id="panel"></main>
  </div>
</div>

<div class="modal-back hidden" id="modalBack">
 <div class="modal">
  <div class="close-row"><button class="action secondary" id="closeModal">Закрыть</button></div>
  <div id="modalContent"></div>
 </div>
</div>

<script>
const zones = [
{
 id:"quad", icon:"▱", title:"Город четырёхугольников", subtitle:"Многоугольники, параллелограмм, трапеция, прямоугольник, ромб, квадрат",
 theory:[
  ["Выпуклый многоугольник","Лежит по одну сторону от каждой прямой, проходящей через две соседние вершины. Сумма внутренних углов n-угольника: (n − 2)·180°."],
  ["Параллелограмм","Противоположные стороны попарно параллельны; противоположные стороны и углы равны; диагонали точкой пересечения делятся пополам."],
  ["Прямоугольник и ромб","У прямоугольника все углы прямые и диагонали равны. У ромба все стороны равны, а диагонали взаимно перпендикулярны и делят углы пополам."],
  ["Квадрат","Обладает свойствами и прямоугольника, и ромба: диагонали равны, перпендикулярны, делятся пополам и делят углы пополам."]
 ],
 questions:[
  {q:"Чему равна сумма внешних углов выпуклого многоугольника?", a:["180°","360°","(n−2)·180°","90°"], c:1, e:"Сумма внешних углов любого выпуклого многоугольника равна 360°."},
  {q:"Какое утверждение является свойством параллелограмма?", a:["Диагонали всегда равны","Диагонали взаимно перпендикулярны","Диагонали точкой пересечения делятся пополам","Все углы прямые"], c:2, e:"Главное свойство диагоналей параллелограмма: они делятся точкой пересечения пополам."},
  {q:"Какой четырёхугольник является параллелограммом, у которого все углы прямые?", a:["Ромб","Трапеция","Прямоугольник","Дельтоид"], c:2, e:"Это определение прямоугольника."},
  {q:"Особое свойство диагоналей ромба:", a:["Только равны","Перпендикулярны и делят углы пополам","Не пересекаются","Всегда образуют угол 60°"], c:1, e:"Диагонали ромба взаимно перпендикулярны и являются биссектрисами его углов."},
  {q:"Какое утверждение верно для квадрата?", a:["Он имеет только свойства ромба","Он имеет только свойства прямоугольника","Он обладает свойствами и ромба, и прямоугольника","Его диагонали не равны"], c:2, e:"Квадрат сочетает свойства прямоугольника и ромба."}
 ]
},
{
 id:"sim", icon:"△", title:"Долина подобия", subtitle:"Теорема Фалеса, средняя линия, признаки подобия",
 theory:[
  ["Средняя линия треугольника","Соединяет середины двух сторон; параллельна третьей стороне и равна половине этой стороны."],
  ["Подобные треугольники","Соответственные углы равны, а соответствующие стороны пропорциональны."],
  ["Коэффициент подобия","Отношение периметров равно k, отношение площадей — k²; соответствующие медианы, высоты и биссектрисы относятся как k."],
  ["Признаки подобия","По двум углам; по двум пропорциональным сторонам и углу между ними; по трём пропорциональным сторонам."]
 ],
 questions:[
  {q:"Средняя линия треугольника по отношению к третьей стороне…", a:["перпендикулярна ей","параллельна ей и равна половине её длины","равна ей","делит её в отношении 2:1"], c:1, e:"Средняя линия параллельна третьей стороне и равна половине её длины."},
  {q:"Если два угла одного треугольника равны двум углам другого, то треугольники…", a:["равны","подобны","обязательно прямоугольные","не сравнимы"], c:1, e:"Это первый признак подобия треугольников."},
  {q:"Чему равно отношение площадей подобных треугольников?", a:["k","2k","k²","√k"], c:2, e:"Площади подобных фигур относятся как квадрат коэффициента подобия."},
  {q:"Что требуется во втором признаке подобия?", a:["Три равных угла","Две стороны пропорциональны и углы между ними равны","Только одна пара равных сторон","Равные периметры"], c:1, e:"Две стороны одного треугольника пропорциональны двум сторонам другого, а углы между ними равны."},
  {q:"Теорема Фалеса связывает равные отрезки на одной прямой с…", a:["перпендикулярными прямыми","параллельными прямыми, отсекающими равные отрезки на другой прямой","окружностью","медианами"], c:1, e:"Через концы равных отрезков проводят параллельные прямые; на второй прямой они отсекают равные отрезки."}
 ]
},
{
 id:"area", icon:"▦", title:"Мастерская площадей", subtitle:"Формулы площадей треугольников и четырёхугольников",
 theory:[
  ["Треугольник","S = ½ah. Для прямоугольного треугольника S = ½ab. Формула Герона: S = √(p(p−a)(p−b)(p−c))."],
  ["Через вписанную окружность","Для треугольника S = pr, где p — полупериметр, r — радиус вписанной окружности."],
  ["Четырёхугольники","Квадрат: S=a²; прямоугольник: S=ab; параллелограмм и ромб через высоту: S=ah."],
  ["Ромб и трапеция","Ромб через диагонали: S = ½d₁d₂. Трапеция: S = ((a+b)/2)h."]
 ],
 questions:[
  {q:"Какая формула задаёт площадь треугольника через основание a и высоту h?", a:["S=ah","S=½ah","S=a²","S=2ah"], c:1, e:"Площадь треугольника равна половине произведения основания на проведённую к нему высоту."},
  {q:"Какая формула площади ромба использует диагонали?", a:["S=d₁+d₂","S=d₁d₂","S=½d₁d₂","S=2d₁d₂"], c:2, e:"Площадь ромба равна половине произведения диагоналей."},
  {q:"Формула площади трапеции:", a:["S=(a+b)h","S=((a+b)/2)h","S=ab/2","S=a²+b²"], c:1, e:"Полусумма оснований умножается на высоту."},
  {q:"В формуле S=pr для треугольника r — это…", a:["радиус описанной окружности","радиус вписанной окружности","медиана","высота"], c:1, e:"Здесь r — радиус окружности, вписанной в треугольник."},
  {q:"Какая фигура имеет формулу площади S=a²?", a:["Параллелограмм","Квадрат","Трапеция","Любой ромб"], c:1, e:"Для квадрата площадь равна квадрату его стороны."}
 ]
},
{
 id:"right", icon:"📐", title:"Башня прямого угла", subtitle:"Синус, косинус, тангенс и теорема Пифагора",
 theory:[
  ["Синус","Синус острого угла прямоугольного треугольника — отношение противолежащего катета к гипотенузе."],
  ["Косинус","Косинус — отношение прилежащего катета к гипотенузе."],
  ["Тангенс","Тангенс — отношение противолежащего катета к прилежащему."],
  ["Теорема Пифагора","В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов: c²=a²+b²."]
 ],
 questions:[
  {q:"Синус острого угла — это отношение…", a:["прилежащего катета к гипотенузе","противолежащего катета к гипотенузе","гипотенузы к катету","катетов друг к другу всегда в любом порядке"], c:1, e:"sin α = противолежащий катет / гипотенуза."},
  {q:"Косинус острого угла — это отношение…", a:["прилежащего катета к гипотенузе","противолежащего катета к гипотенузе","гипотенузы к прилежащему катету","противолежащего катета к прилежащему"], c:0, e:"cos α = прилежащий катет / гипотенуза."},
  {q:"Тангенс острого угла равен отношению…", a:["гипотенузы к катету","противолежащего катета к прилежащему","прилежащего катета к гипотенузе","гипотенузы к противолежащему"], c:1, e:"tg α = противолежащий катет / прилежащий катет."},
  {q:"Теорема Пифагора утверждает:", a:["c=a+b","c²=a²+b²","c²=a²−b²","a²=b²+c² для любого обозначения"], c:1, e:"Квадрат гипотенузы равен сумме квадратов катетов."},

 ]
},
{
 id:"circle", icon:"◯", title:"Обсерватория окружности", subtitle:"Касательная, дуги, центральные и вписанные углы",
 theory:[
  ["Касательная","Касательная к окружности перпендикулярна радиусу, проведённому в точку касания. Верно и обратное утверждение."],
  ["Две касательные","Отрезки касательных, проведённых из одной внешней точки к окружности, равны."],
  ["Центральный угол","Его вершина находится в центре окружности; градусная мера меньшей дуги равна градусной мере соответствующего центрального угла."],
  ["Вписанный угол","Равен половине градусной меры дуги, на которую опирается. Вписанный угол, опирающийся на полуокружность, прямой."]
 ],
 questions:[

 ]
},
{
 id:"points", icon:"✦", title:"Храм замечательных точек", subtitle:"Центры треугольника, вписанная и описанная окружности",

  ["Биссектрисы","Пересекаются в центре вписанной окружности; эта точка всегда внутри треугольника."],
  ["Серединные перпендикуляры","Пересекаются в центре описанной окружности."],
  ["Медианы и высоты","Медианы пересекаются в центре тяжести и делятся этой точкой в отношении 2:1 от вершины. Высоты пересекаются в ортоцентре."],
  ["Четырёхугольники и окружности","В описанном четырёхугольнике суммы противоположных сторон равны. Во вписанном четырёхугольнике сумма противоположных углов равна 180°."]
 ],
 questions:[
  {q:"Точка пересечения биссектрис треугольника — это…", a:["ортоцентр","центр описанной окружности","центр вписанной окружности","центр тяжести"], c:2, e:"Биссектрисы пересекаются в центре вписанной окружности."},
  {q:"Точка пересечения серединных перпендикуляров — это…", a:["центр описанной окружности","центр тяжести","ортоцентр","центр вписанной окружности"], c:0, e:"Серединные перпендикуляры определяют центр окружности, описанной около треугольника."},
  {q:"В каком отношении центр тяжести делит каждую медиану, считая от вершины?", a:["1:1","2:1","3:1","1:2"], c:1, e:"Медианы пересекаются в одной точке и делятся ею в отношении 2:1 от вершины."},
  {q:"Точка пересечения высот треугольника называется…", a:["ортоцентром","инцентром","центроидом","центром окружности"], c:0, e:"Высоты или их продолжения пересекаются в ортоцентре."},
  {q:"Какое условие верно для вписанного четырёхугольника?", a:["Противоположные стороны равны","Сумма противоположных углов равна 180°","Диагонали перпендикулярны","Все стороны касаются окружности"], c:1, e:"Для четырёхугольника, вписанного в окружность, сумма противоположных углов равна 180°."}
 ]
}
];

const state = {
 zone:0, q:0, phase:"intro", score:0, correct:0,
 answered:{}, completed:new Set()
};
const panel=document.getElementById("panel"), zoneList=document.getElementById("zoneList");
const scoreEl=document.getElementById("score"), correctEl=document.getElementById("correct"),
doneZonesEl=document.getElementById("doneZones"), progressEl=document.getElementById("progress");

function key(zi,qi){return zi+"-"+qi}
function updateHud(){
 scoreEl.textContent=state.score;
 correctEl.textContent=state.correct;
 doneZonesEl.textContent=state.completed.size;
 const answeredCount=Object.keys(state.answered).length;
 progressEl.style.width=(answeredCount/30*100)+"%";
}
function renderMap(){
 zoneList.innerHTML="";
 zones.forEach((z,i)=>{
   const b=document.createElement("button"); b.className="zone-btn"+(i===state.zone?" active":"")+(state.completed.has(i)?" done":"");
   b.innerHTML=`<span class="zone-icon">${z.icon}</span><span class="zone-text"><b>${i+1}. ${z.title}</b><small>${state.completed.has(i)?"Пройдено":"5 вопросов"}</small></span>`;
   b.addEventListener("click",()=>{state.zone=i; state.q=0; state.phase="intro"; renderAll()});
   zoneList.appendChild(b);
 });
}
function renderIntro(){
 const z=zones[state.zone];
 panel.innerHTML=`
 <div class="hero">
  <div class="hero-card">
   <div class="qnum">Локация ${state.zone+1} из ${zones.length}</div>
   <h2>${z.title}</h2><p>${z.subtitle}</p>
   <p>Сначала можно быстро повторить теорию, затем пройти 5 вопросов. За верный ответ с первой попытки — <b>2 ⭐</b>, после ошибки — <b>1 ⭐</b>.</p>
   <div class="controls">
    <button class="action" id="theoryStart">Открыть теорию</button>
    <button class="action secondary" id="quizStart">Сразу к вопросам</button>
   </div>
  </div>
  <div class="hero-visual" aria-hidden="true">${z.icon}</div>
 </div>`;
 document.getElementById("theoryStart").onclick=()=>{state.phase="theory";renderPanel()};
 document.getElementById("quizStart").onclick=()=>{state.phase="quiz";renderPanel()};
}
function renderTheory(){
 const z=zones[state.zone];
 panel.innerHTML=`
 <div class="section-title"><div><div class="qnum">${z.title}</div><h2>Краткая теория</h2></div><button class="action" id="toQuiz">К вопросам →</button></div>
 <div class="theory-grid">${z.theory.map(t=>`<div class="theory"><b>${t[0]}</b><p>${t[1]}</p></div>`).join("")}</div>
 <p class="small-note">Можно возвращаться к теории в любой момент: кнопка появится рядом с вопросом.</p>`;
 document.getElementById("toQuiz").onclick=()=>{state.phase="quiz";state.q=0;renderPanel()};
}
function renderQuiz(){
 const z=zones[state.zone], q=z.questions[state.q], k=key(state.zone,state.q), prev=state.answered[k];
 panel.innerHTML=`
 <div class="section-title">
   <div><div class="qnum">${z.title}</div><h2>Испытание</h2></div>
   <button class="action secondary" id="showTheory">📖 Теория</button>
 </div>
 <div class="quiz-card">
  <div class="qnum">Вопрос ${state.q+1} из ${z.questions.length}</div>
  <div class="question">${q.q}</div>
  <div class="options" id="opts"></div>
  <div class="feedback" id="fb"></div>
  <div class="controls">
   <button class="action" id="check">Проверить</button>
   <button class="action secondary" id="next" disabled>${state.q===4?"Завершить локацию":"Следующий вопрос →"}</button>
  </div>
 </div>`;
 const opts=document.getElementById("opts"); let selected=null;
 q.a.forEach((txt,i)=>{
   const b=document.createElement("button"); b.className="opt"; b.textContent=txt;
   b.onclick=()=>{
     if(document.getElementById("next").disabled===false) return;
     [...opts.children].forEach(x=>x.classList.remove("selected")); b.classList.add("selected"); selected=i;
   }; opts.appendChild(b);
 });
 if(prev){
   selected=prev.selected; showAnswered(prev, q);
 }
 document.getElementById("showTheory").onclick=()=>openTheory(z);
 document.getElementById("check").onclick=()=>{
   if(selected===null){showMessage("Выберите вариант ответа.","bad");return}
   const firstTry=!state.answered[k];
   const isCorrect=selected===q.c;
   if(firstTry){
     state.answered[k]={selected, correct:isCorrect, attempts:1};
     if(isCorrect){state.correct++;state.score+=2}
     else{state.score+=0}
   }else{
     state.answered[k].selected=selected;
     state.answered[k].attempts++;
     if(isCorrect && !state.answered[k].correct){state.answered[k].correct=true;state.correct++;state.score+=1}
   }
   showAnswered(state.answered[k],q);
   updateHud();
 };
 document.getElementById("next").onclick=()=>{
   if(state.q<4){state.q++;renderPanel()}
   else{state.completed.add(state.zone);state.phase="zoneResult";renderAll()}
 };
}
function showAnswered(rec,q){
 const opts=document.getElementById("opts"), fb=document.getElementById("fb"), next=document.getElementById("next");
 [...opts.children].forEach((b,i)=>{
   b.classList.remove("selected","correct","wrong");
   if(i===q.c)b.classList.add("correct");
   if(i===rec.selected && i!==q.c)b.classList.add("wrong");
 });
 if(rec.correct){
   fb.className="feedback show ok"; fb.innerHTML=`<b>Верно!</b> ${q.e}`;
   next.disabled=false; document.getElementById("check").disabled=true;
 }else{
   fb.className="feedback show bad"; fb.innerHTML=`Пока неверно. ${q.e}<br><small>Выберите правильный вариант и проверьте ещё раз — за исправление можно получить 1 ⭐.</small>`;
 }
}
function showMessage(text,type){
 const fb=document.getElementById("fb"); fb.className="feedback show "+type; fb.textContent=text;
}
function renderZoneResult(){
 const z=zones[state.zone];
 const zoneCorrect=z.questions.filter((_,i)=>state.answered[key(state.zone,i)]?.correct).length;
 panel.innerHTML=`<div class="result">
   <div class="big">🏁</div><h2>${z.title} пройдена</h2>
   <p>Правильных ответов: <b>${zoneCorrect}/5</b>. Локация отмечена на карте.</p>
   <div class="controls" style="justify-content:center">
    ${state.zone<zones.length-1?'<button class="action" id="nextZone">Следующая локация →</button>':''}
    <button class="action secondary" id="reviewZone">Повторить локацию</button>
    ${state.completed.size===zones.length?'<button class="action" id="finishGame">Итоги игры</button>':''}
   </div></div>`;
 if(document.getElementById("nextZone")) document.getElementById("nextZone").onclick=()=>{state.zone++;state.q=0;state.phase="intro";renderAll()};
 document.getElementById("reviewZone").onclick=()=>{state.q=0;state.phase="theory";renderAll()};
 if(document.getElementById("finishGame")) document.getElementById("finishGame").onclick=()=>{state.phase="final";renderPanel()};
}
function renderFinal(){
 const pct=Math.round(state.correct/30*100);
 const rank=pct>=90?"Хранитель геометрии":pct>=75?"Исследователь теорем":pct>=55?"Уверенный путешественник":"Начинающий картограф";
 panel.innerHTML=`<div class="result">
  <div class="big">${pct>=75?"🏆":"🧭"}</div>
  <h2>Экспедиция завершена!</h2>
  <p>Ваш ранг: <b>${rank}</b></p>
  <div class="stats">
   <div class="stat"><b>${state.score}</b>звёзд</div>
   <div class="stat"><b>${state.correct}/30</b>верно</div>
   <div class="stat"><b>${pct}%</b>результат</div>
  </div>
  <p>${pct>=90?"Теория 8 класса освоена очень уверенно.":pct>=75?"Хороший результат. Повторите темы, где были исправления.":pct>=55?"База есть, но стоит вернуться к нескольким локациям.":"Рекомендуется пройти игру ещё раз, читая теорию перед вопросами."}</p>
  <button class="action" id="again">Пройти ещё раз</button>
 </div>`;
 document.getElementById("again").onclick=resetGame;
}
function openTheory(z){
 document.getElementById("modalContent").innerHTML=`<h3>📖 ${z.title}</h3>`+z.theory.map(t=>`<div class="theory" style="margin:10px 0"><b>${t[0]}</b><p>${t[1]}</p></div>`).join("");
 document.getElementById("modalBack").classList.remove("hidden");
}
function renderPanel(){
 if(state.phase==="intro")renderIntro();
 if(state.phase==="theory")renderTheory();
 if(state.phase==="quiz")renderQuiz();
 if(state.phase==="zoneResult")renderZoneResult();
 if(state.phase==="final")renderFinal();
}
function renderAll(){renderMap();renderPanel();updateHud()}
function resetGame(){
 state.zone=0;state.q=0;state.phase="intro";state.score=0;state.correct=0;state.answered={};state.completed=new Set();renderAll();
}
document.getElementById("rulesBtn").onclick=()=>{
 document.getElementById("modalContent").innerHTML=`<h3>Как играть</h3>
 <p>Игра состоит из 6 тематических локаций. В каждой — краткая теория и 5 вопросов.</p>
 <p><b>2 ⭐</b> — правильный ответ с первой попытки. Если ошиблись, прочитайте пояснение и исправьте ответ: за исправление получите <b>1 ⭐</b>.</p>
 <p>Никаких вычислительных задач здесь нет: игра проверяет определения, свойства, признаки и теоремы.</p>`;
 document.getElementById("modalBack").classList.remove("hidden");
};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Сбросить весь прогресс игры?"))resetGame()};
document.getElementById("closeModal").onclick=()=>document.getElementById("modalBack").classList.add("hidden");
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")e.currentTarget.classList.add("hidden")});
renderAll();
</script>
</body>
</html>
