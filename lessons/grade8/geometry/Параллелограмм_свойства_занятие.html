<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#fff 68%);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.topbar-row{display:flex;gap:8px;padding:10px 14px 0;overflow-x:auto}.topic-tab{min-width:175px;border:1px solid var(--border);border-bottom:3px solid transparent;border-radius:14px 14px 0 0;background:var(--surface);padding:11px 14px;font-weight:800;color:var(--text)}.topic-tab small{display:block;color:var(--muted);margin-top:4px}.topic-tab.active{background:var(--soft);border-color:var(--primary);color:var(--primary)}.themebar{display:flex;align-items:center;gap:8px;padding:8px 14px 10px}.export-actions{display:flex;gap:8px;margin-right:auto}.export-btn,.btn{border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:9px 12px;font-weight:800}.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-soft{background:var(--soft);color:var(--primary)}.btn-danger{color:var(--danger)}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;padding:18px;width:min(1600px,100%);margin:0 auto;flex:1}.sidebar{display:flex;flex-direction:column;gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.sidebar-title{padding:14px 16px;font-weight:900;color:var(--primary);border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--soft))}.task-nav{padding:8px;display:flex;flex-direction:column;gap:5px}.task-btn{border:0;border-radius:10px;background:transparent;padding:10px 11px;text-align:left;font-weight:700;display:flex;gap:9px;align-items:center;color:var(--text)}.task-btn:hover{background:var(--soft)}.task-btn.active{background:var(--primary);color:#fff}.task-num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-size:.84rem}.task-btn.active .task-num{background:rgba(255,255,255,.18);color:#fff}.done-dot{margin-left:auto;font-size:.82rem}.info{padding:15px 16px;line-height:1.5;font-size:.94rem}.workspace{padding:20px;min-height:720px}.task-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.task-header h1{margin:0;color:var(--primary);font-size:clamp(1.35rem,2vw,2rem)}.task-kicker{color:var(--muted);margin:.45rem 0 0}.task-content{border-top:1px solid var(--border);padding-top:18px;margin-top:14px}.question{font-size:1.1rem;line-height:1.62;margin:12px 0}.example-box,.theory-box,.tip-box,.error-box{border-radius:14px;padding:15px 16px;margin:14px 0}.example-box{background:var(--soft);border:1px solid var(--border)}.theory-box{background:#f6fbf0;border-left:5px solid var(--primary)}.tip-box{background:#fff8df;border:1px solid #ead7a0}.error-box{background:#fff0ee;border:1px solid #efc7c2}.diagram{display:flex;justify-content:center;margin:18px 0}.diagram svg{max-width:520px;width:100%;height:auto}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:16px 0}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2)}.choice input{accent-color:var(--primary);margin-top:3px}.answer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.answer-input,textarea,select.match-select{border:2px solid var(--border);border-radius:12px;padding:11px 13px;background:var(--surface);color:var(--text);outline:none}.answer-input{min-width:240px;flex:1}.answer-input:focus,textarea:focus,select.match-select:focus{border-color:var(--primary)}textarea{width:100%;min-height:130px;resize:vertical}.match-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr);gap:10px;margin:16px 0}.match-row{display:contents}.match-label{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface2)}.actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:18px;margin-top:24px;border-top:1px solid var(--border)}.btn-primary{margin-left:auto}.feedback{display:none;margin-top:14px;border-radius:12px;padding:13px 14px;font-weight:750;line-height:1.45}.feedback.show{display:block}.feedback.ok{color:var(--success);background:#eef8ef;border:1px solid #bfd8c1}.feedback.bad{color:var(--danger);background:#fff1ef;border:1px solid #ecc5c1}.feedback.warn{color:var(--warn);background:#fff8e6;border:1px solid #e8d59c}.progress-line{height:7px;border-radius:999px;background:#e9eddf;overflow:hidden;margin-top:10px}.progress-bar{height:100%;width:0;background:var(--primary);transition:.25s}.mobile-task-select{display:none;width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:12px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:800;font-size:.84rem}.rubric{width:100%;border-collapse:collapse;margin:14px 0}.rubric th,.rubric td{border:1px solid var(--border);padding:9px;text-align:left;vertical-align:top}.rubric th{background:var(--soft)}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-stats div{background:var(--surface2);border:1px solid var(--border);padding:10px;border-radius:10px;text-align:center}.scratch-modal{position:fixed;inset:0;background:rgba(0,0,0,.34);display:none;place-items:center;z-index:100;padding:18px}.scratch-modal.open{display:grid}.scratchpad{width:min(900px,96vw);height:min(650px,90vh);background:var(--surface);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.scratch-head{display:flex;gap:8px;align-items:center;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--border)}.scratch-head .spacer{flex:1}#scratchCanvas{flex:1;width:100%;touch-action:none;cursor:crosshair;background-color:#fffef8;background-image:linear-gradient(rgba(100,120,100,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(100,120,100,.12) 1px,transparent 1px);background-size:24px 24px}.print-only{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{display:none}.workspace{padding:15px}.mobile-task-select{display:block}.btn-primary{margin-left:0}.topic-tab{min-width:145px}.match-grid{grid-template-columns:1fr}.match-row{display:block}.match-label{margin-bottom:5px}}@media print{.topbar,.sidebar,.actions,.feedback,.mobile-task-select{display:none!important}.layout{display:block;padding:0}.workspace{box-shadow:none;border:0;padding:0}.task-content{border:0}.print-only{display:block}.screen-only{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>

<body>
<div class="app">
<header class="topbar"><div class="topbar-row" id="topicTabs"></div><div class="themebar"><div class="export-actions"><button class="export-btn" id="printBtn">🖨 Печать текущего задания</button></div><span class="pill">Новая тема • много практики</span></div></header>

</section>
</main>
</div>

<script>
const D=(extra='')=>`<div class="diagram"><svg viewBox="0 0 520 260" role="img" aria-label="Параллелограмм ABCD">
<polygon points="120,190 360,190 430,70 190,70" fill="#eef5e7" stroke="#6c8a52" stroke-width="4"/>
<line x1="120" y1="190" x2="430" y2="70" stroke="#9d9275" stroke-width="3" ${extra.includes('d1')?'':'opacity="0"'}/>
<line x1="190" y1="70" x2="360" y2="190" stroke="#9d9275" stroke-width="3" ${extra.includes('d2')?'':'opacity="0"'}/>
<circle cx="275" cy="130" r="4.5" fill="#263125" ${extra.includes('o')?'':'opacity="0"'}/>
<text x="98" y="210" font-size="25">A</text><text x="365" y="215" font-size="25">B</text><text x="440" y="67" font-size="25">C</text><text x="165" y="63" font-size="25">D</text><text x="284" y="126" font-size="22" ${extra.includes('o')?'':'opacity="0"'}>O</text>
</svg></div>`;
const tabs=[
{id:'r',code:'0',title:'Повторение 7 класса',info:'До 10 минут: вертикальные и смежные углы, углы при параллельных прямых, признаки равенства треугольников. Эти факты понадобятся для доказательства свойств параллелограмма.',tasks:[
{title:'1. Смежные углы',instruction:'Короткое повторение.',type:'input',prompt:`<div class="question">Один из смежных углов равен $68^\\circ$. Найдите второй.</div>`,answer:['112','112°'],hints:['Сумма смежных углов равна $180^\\circ$.','Вычти $68^\\circ$ из $180^\\circ$.']},
{title:'2. Вертикальные углы',instruction:'Вспомните свойство.',type:'choice',prompt:`<div class="question">Если $\\angle1=47^\\circ$, то чему равен вертикальный ему $\\angle3$?</div>`,options:['$47^\\circ$','$133^\\circ$','$94^\\circ$'],answer:0,hints:['Вертикальные углы равны.']},
{title:'3. Параллельные прямые',instruction:'Выберите все верные утверждения.',type:'multi',prompt:`<div class="question">Прямые $a\\parallel b$ пересечены секущей $c$. Какие факты всегда верны?</div>`,options:['Накрест лежащие углы равны','Соответственные углы равны','Сумма внутренних односторонних углов равна $180^\\circ$','Все восемь углов равны'],answer:[0,1,2],hints:['Вспомни три свойства углов при параллельных прямых.']},
{title:'4. Равенство треугольников',instruction:'Какой признак понадобится?',type:'choice',prompt:`<div class="question">В двух треугольниках известны две пары равных сторон и равные углы между ними. По какому признаку можно доказать равенство?</div>`,options:['По двум сторонам и углу между ними','По стороне и двум прилежащим углам','По трём сторонам'],answer:0,hints:['Смотри именно на расположение известного угла.']},
{title:'5. Цепочка рассуждений',instruction:'Открытый ответ.',type:'open',prompt:`<div class="question">Почему из $a\\parallel b$ и секущей $c$ можно получить пару равных углов? Назови тип этих углов и сформулируй свойство.</div>`,keywords:['накрест','соответств','равн'],threshold:2,model:'Например: накрест лежащие углы при параллельных прямых и секущей равны.',hints:['Назови один из типов углов: накрест лежащие или соответственные.']}
]},
{id:'n',code:'1',title:'Что такое параллелограмм',info:'Параллелограмм — четырёхугольник, у которого противоположные стороны попарно параллельны: $AB\\parallel CD$ и $BC\\parallel AD$. Важно отличать определение от свойств.',tasks:[
{title:'6. Определение',instruction:'Выберите точную формулировку.',type:'choice',prompt:`${D()}<div class="question">Какой четырёхугольник называется параллелограммом?</div>`,options:['У которого все стороны равны','У которого противоположные стороны попарно параллельны','У которого диагонали равны'],answer:1,hints:['Определение связано с параллельностью противоположных сторон.']},
{title:'7. Читаем обозначения',instruction:'Множественный выбор.',type:'multi',prompt:`${D()}<div class="question">Для параллелограмма $ABCD$ выберите верные записи, следующие прямо из определения.</div>`,options:['$AB\\parallel CD$','$BC\\parallel AD$','$AB=CD$','$AC=BD$'],answer:[0,1],hints:['Пока используй только определение, свойства ещё не применяй.']},
{title:'8. Определение или свойство?',instruction:'Сопоставление.',type:'match',prompt:`<div class="question">Раздели утверждения: что является определением, а что — свойством параллелограмма?</div>`,pairs:[['Противоположные стороны попарно параллельны','Определение'],['Противоположные стороны равны','Свойство'],['Противоположные углы равны','Свойство'],['Диагонали точкой пересечения делятся пополам','Свойство']],choices:['Определение','Свойство'],hints:['Определение отвечает: «что это?», свойство — «что из этого следует?».']},
{title:'9. Поиск лишнего',instruction:'Найдите утверждение, которого недостаточно.',type:'choice',prompt:`<div class="question">Какого факта самого по себе <b>недостаточно</b>, чтобы по определению назвать четырёхугольник параллелограммом?</div>`,options:['Обе пары противоположных сторон параллельны','Только одна пара противоположных сторон параллельна','$AB\\parallel CD$ и $BC\\parallel AD$'],answer:1,hints:['В определении нужны две пары противоположных сторон.']}
]},
{id:'t',code:'2',title:'Свойства',info:'Главные свойства: 1) противоположные стороны равны; 2) противоположные углы равны; 3) диагонали точкой пересечения делятся пополам. Также соседние углы в сумме дают $180^\\circ$.',tasks:[
{title:'10. Открываем свойства',instruction:'Выберите все верные утверждения.',type:'multi',prompt:`${D('d1 d2 o')}<div class="question">Что верно для любого параллелограмма $ABCD$?</div>`,options:['$AB=CD$ и $BC=AD$','$\\angle A=\\angle C$ и $\\angle B=\\angle D$','$AO=OC$ и $BO=OD$','$AC=BD$'],answer:[0,1,2],hints:['Равенство диагоналей — не общее свойство любого параллелограмма.']},
{title:'11. Как заметить доказательство',instruction:'Выберите идею доказательства.',type:'choice',prompt:`${D('d1')}<div class="theory-box"><b>Идея.</b> Проведём диагональ $AC$. Из параллельности сторон получим равные накрест лежащие углы.</div><div class="question">Какие треугольники удобно сравнить, чтобы доказать равенство противоположных сторон?</div>`,options:['$\\triangle ABC$ и $\\triangle CDA$','$\\triangle ABD$ и $\\triangle BCD$','$\\triangle ACD$ и $\\triangle BCD$'],answer:0,hints:['Диагональ $AC$ должна быть общей стороной двух выбранных треугольников.']},
{title:'12. Восстановите доказательство',instruction:'Сопоставьте шаг и обоснование.',type:'match',prompt:`${D('d1')}<div class="question">В доказательстве равенства $\\triangle ABC$ и $\\triangle CDA$ сопоставьте факт и причину.</div>`,pairs:[['$\\angle BAC=\\angle DCA$','накрест лежащие при AD ∥ BC'],['$\\angle BCA=\\angle DAC$','накрест лежащие при AB ∥ CD'],['$AC=CA$','общая сторона'],['$\\triangle ABC=\\triangle CDA$','по стороне и двум прилежащим углам']],choices:['накрест лежащие при AD ∥ BC','накрест лежащие при AB ∥ CD','общая сторона','по стороне и двум прилежащим углам'],hints:['Следи, какая параллельная пара сторон образует нужные углы с диагональю $AC$.']},
{title:'13. Почему соседние углы дают 180°',instruction:'Вопрос на рассуждение.',type:'open',prompt:`<div class="question">Объясни, почему $\\angle A+\\angle B=180^\\circ$ в параллелограмме $ABCD$.</div>`,keywords:['паралл','односторон','180'],threshold:2,model:'Так как $AD\\parallel BC$, а $AB$ — секущая, углы $A$ и $B$ являются внутренними односторонними, поэтому их сумма равна $180^\\circ$.',hints:['Посмотри на одну пару параллельных сторон и сторону, которая служит секущей.']}
]},
{id:'p',code:'3',title:'Базовая практика',info:'Сначала научись мгновенно узнавать, какое свойство нужно: стороны → равны; противоположные углы → равны; соседние углы → сумма $180^\\circ$; половины диагонали → равны.',tasks:[
{title:'14. Противоположные стороны',instruction:'Короткий ответ.',type:'input',prompt:`<div class="question">В параллелограмме $ABCD$ сторона $AB=9$ см. Найдите $CD$.</div>`,answer:['9','9 см'],hints:['Противоположные стороны параллелограмма равны.']},
{title:'15. Периметр',instruction:'Короткий ответ.',type:'input',prompt:`<div class="question">В параллелограмме $ABCD$: $AB=8$ см, $BC=5$ см. Найдите периметр.</div>`,answer:['26','26 см'],hints:['Противоположные стороны равны. Значит, $P=2(AB+BC)$.']},
{title:'16. Противоположные углы',instruction:'Короткий ответ.',type:'input',prompt:`<div class="question">Если $\\angle A=72^\\circ$, найдите $\\angle C$.</div>`,answer:['72','72°'],hints:['Противоположные углы равны.']},
{title:'17. Соседний угол',instruction:'Короткий ответ.',type:'input',prompt:`<div class="question">Если $\\angle A=118^\\circ$, найдите $\\angle B$.</div>`,answer:['62','62°'],hints:['Сумма соседних углов параллелограмма $180^\\circ$.']},
{title:'18. Диагональ пополам',instruction:'Короткий ответ.',type:'input',prompt:`${D('d1 d2 o')}<div class="question">Диагонали пересекаются в точке $O$. Если $AO=6{,}5$ см, найдите $OC$.</div>`,answer:['6.5','6,5','6,5 см','6.5 см'],hints:['Диагонали точкой пересечения делятся пополам.']},
{title:'19. Вся диагональ',instruction:'Короткий ответ.',type:'input',prompt:`${D('d1 d2 o')}<div class="question">Если $BO=4$ см, найдите длину диагонали $BD$.</div>`,answer:['8','8 см'],hints:['$BO=OD$, поэтому $BD=BO+OD$.']},
{title:'20. Что применить?',instruction:'Сопоставление.',type:'match',prompt:`<div class="question">Сопоставьте данные задачи с первым полезным свойством.</div>`,pairs:[['Дано $AB=11$, найти $CD$','противоположные стороны равны'],['Дано $\\angle A=65^\\circ$, найти $\\angle C$','противоположные углы равны'],['Дано $AO=7$, найти $AC$','диагонали делятся пополам'],['Дано $\\angle B=103^\\circ$, найти $\\angle C$','соседние углы в сумме $180^\\circ$']],choices:['противоположные стороны равны','противоположные углы равны','диагонали делятся пополам','соседние углы в сумме $180^\\circ$'],hints:['Сначала определи, что именно требуется: сторона, угол или диагональ.']}
]},
{id:'m',code:'4',title:'Рассуждаем и ищем ошибку',info:'Здесь важен не только ответ, но и логика. Перед вычислением назови свойство, которое связывает данные с искомым.',tasks:[

let ti=0,qi=0; const done=new Set(JSON.parse(localStorage.getItem('paraDone')||'[]')); let attempts=Number(localStorage.getItem('paraAttempts')||0),correct=Number(localStorage.getItem('paraCorrect')||0); const tried={};
const $=id=>document.getElementById(id); const allTasks=()=>tabs.flatMap((t,idx)=>t.tasks.map((q,j)=>({key:`${idx}-${j}`,q})));
function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/°/g,'').replace(/см/g,'').trim()}
function renderTabs(){ $('topicTabs').innerHTML=tabs.map((t,i)=>`<button class="topic-tab ${i===ti?'active':''}" data-i="${i}">${t.title}<small>${t.tasks.length} заданий</small></button>`).join(''); document.querySelectorAll('.topic-tab').forEach(b=>b.onclick=()=>{ti=+b.dataset.i;qi=0;render()}) }
function renderNav(){ const t=tabs[ti]; $('taskNav').innerHTML=t.tasks.map((q,i)=>`<button class="task-btn ${i===qi?'active':''}" data-i="${i}"><span class="task-num">${q.title.split('.')[0]}</span><span>${q.title.replace(/^\d+\.\s*/,'')}</span><span class="done-dot">${done.has(`${ti}-${i}`)?'✓':''}</span></button>`).join(''); document.querySelectorAll('.task-btn').forEach(b=>b.onclick=()=>{qi=+b.dataset.i;render()}); $('mobileTaskSelect').innerHTML=t.tasks.map((q,i)=>`<option value="${i}" ${i===qi?'selected':''}>${q.title}</option>`).join(''); $('mobileTaskSelect').onchange=e=>{qi=+e.target.value;render()}; }
function renderInput(q){return `<div class="answer-row"><label>Ответ:</label><input class="answer-input" id="ansInput" placeholder="Введите ответ"></div>`}
function renderChoice(q,multi=false){return `<div class="choice-grid">${q.options.map((o,i)=>`<label class="choice"><input type="${multi?'checkbox':'radio'}" name="choice" value="${i}"><span>${o}</span></label>`).join('')}</div>`}
function renderMatch(q){return `<div class="match-grid">${q.pairs.map((p,i)=>`<div class="match-label">${p[0]}</div><select class="match-select" data-mi="${i}"><option value="">— выбрать —</option>${q.choices.map(c=>`<option>${c}</option>`).join('')}</select>`).join('')}</div>`}
function renderAnswer(q){if(q.type==='input')return renderInput(q);if(q.type==='choice')return renderChoice(q);if(q.type==='multi')return renderChoice(q,true);if(q.type==='match')return renderMatch(q);if(q.type==='open')return `<textarea id="openText" placeholder="Запишите рассуждение своими словами"></textarea>`;if(q.type==='teacher')return renderChoice(q)+`<textarea id="teacherComment" placeholder="Комментарий ученику: что сделано хорошо и что нужно проверить"></textarea>`;return ''}
function render(){renderTabs();renderNav();const t=tabs[ti],q=t.tasks[qi];$('topicInfo').innerHTML=t.info;$('taskTitle').textContent=q.title;$('taskInstruction').textContent=q.instruction;$('taskContent').innerHTML=q.prompt+renderAnswer(q);$('feedback').className='feedback';$('feedback').innerHTML='';$('prevBtn').disabled=qi===0&&ti===0;$('nextBtn').textContent=(qi===t.tasks.length-1&&ti===tabs.length-1)?'К началу ↺':'Следующая →'; updateProgress(); if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$('taskContent'),$('topicInfo')]).catch(()=>{});}
function getAnswer(q){if(q.type==='input')return $('ansInput')?.value||'';if(q.type==='choice'||q.type==='teacher'){const x=document.querySelector('input[name=choice]:checked');return x?+x.value:null}if(q.type==='multi')return [...document.querySelectorAll('input[name=choice]:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(q.type==='match')return [...document.querySelectorAll('.match-select')].map(s=>s.value);if(q.type==='open')return $('openText')?.value||'';}
function check(){const q=tabs[ti].tasks[qi],a=getAnswer(q),key=`${ti}-${qi}`;attempts++;localStorage.setItem('paraAttempts',attempts);tried[key]=(tried[key]||0)+1;let ok=false,msg='';if(q.type==='input')ok=q.answer.some(x=>norm(x)===norm(a));else if(q.type==='choice')ok=a===q.answer;else if(q.type==='multi')ok=JSON.stringify(a)===JSON.stringify([...q.answer].sort((x,y)=>x-y));else if(q.type==='match')ok=a.every((v,i)=>v===q.pairs[i][1]);else if(q.type==='open'){const s=String(a).toLowerCase();const count=q.keywords.filter(k=>s.includes(k)).length;ok=s.trim().length>20&&count>=q.threshold;if(ok)msg=`Хорошее рассуждение. Ориентир: ${q.model}`;else msg='Ответ пока слишком короткий или не содержит ключевого обоснования.'}else if(q.type==='teacher'){const comment=($('teacherComment')?.value||'').trim();ok=a===q.answer&&comment.length>=12;msg=ok?'Да: по данной шкале работа выполнена полностью верно, отметка 5 обоснована. Комментарий ученику добавлен.':'Проверь отметку по критериям и обязательно напиши содержательный комментарий ученику.'}
const f=$('feedback');if(ok){if(!done.has(key)){done.add(key);correct++;localStorage.setItem('paraCorrect',correct);localStorage.setItem('paraDone',JSON.stringify([...done]));}f.className='feedback show ok';f.innerHTML='✓ '+(msg||'Верно. Ты выбрал нужное свойство и применил его правильно.');}else{const hs=q.hints||[];const idx=Math.min(tried[key]-1,hs.length-1);f.className='feedback show bad';f.innerHTML='Пока не так. '+(hs[idx]||msg||'Вернись к условию: что дано и какое свойство связывает это с искомым?');}updateProgress();renderNav();}
function updateProgress(){const total=allTasks().length,p=Math.round(done.size/total*100);$('progressText').textContent=`${done.size} из ${total}`;$('progressBar').style.width=p+'%';$('statCorrect').textContent=correct;$('statAttempts').textContent=attempts;$('statPercent').textContent=p+'%';}
$('checkBtn').onclick=check;$('resetBtn').onclick=()=>render();$('nextBtn').onclick=()=>{if(qi<tabs[ti].tasks.length-1)qi++;else if(ti<tabs.length-1){ti++;qi=0}else{ti=0;qi=0}render()};$('prevBtn').onclick=()=>{if(qi>0)qi--;else if(ti>0){ti--;qi=tabs[ti].tasks.length-1}render()};$('printBtn').onclick=()=>window.print();

const modal=$('scratchModal'),canvas=$('scratchCanvas'),ctx=canvas.getContext('2d');let drawing=false,erase=false;
function sizeCanvas(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round'}
$('scratchBtn').onclick=()=>{modal.classList.add('open');setTimeout(sizeCanvas,30)};$('closeScratchBtn').onclick=()=>modal.classList.remove('open');$('clearCanvasBtn').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);$('eraserBtn').onclick=()=>erase=true;$('penBtn').onclick=()=>erase=false;
function pt(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return [t.clientX-r.left,t.clientY-r.top]}
function start(e){drawing=true;const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()}function move(e){if(!drawing)return;const[x,y]=pt(e);ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.lineWidth=erase?18:2.2;ctx.strokeStyle='#263125';ctx.lineTo(x,y);ctx.stroke();e.preventDefault()}function end(){drawing=false}
canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end);
render();
</script>
