{id:'l3',type:'proofmatch',text:'Сопоставьте утверждение и обоснование.',pairs:[['Точка равноудалена от сторон угла','Она лежит на биссектрисе'],['Центр вписанной окружности лежит на трёх биссектрисах','Свойство центра вписанной окружности']],choices:['Свойство центра вписанной окружности','Она лежит на биссектрисе'],answer:[1,0]}]}

{title:'Домашнее задание',desc:'5 случайных параметрических задач из разных крупных тем. Без автоматической проверки.',homework:true,subs:[{name:'Итоговые 5 задач',theory:[],qs:[]}]}];

const state=JSON.parse(localStorage.getItem('geo8state')||'{}');
state.answers=state.answers||{};state.first=state.first||{};state.redo=state.redo||{};state.theoryUsed=state.theoryUsed||{};state.last=state.last||{t:0,s:0};
let currentT=state.last.t||0,currentS=state.last.s||0;
function save(){localStorage.setItem('geo8state',JSON.stringify(state))}
function allQuestions(){return DATA.flatMap(t=>t.subs.flatMap(s=>s.qs)).filter(q=>q.id)}
function initHomework(){if(state.homework&&state.homework.length===5)return; const makers=[
()=>{let a=rand(40,140);return {theme:'Вспоминаем 7 класс',text:`Один из смежных углов равен $${a}^\\circ$. Найдите второй.`,answer:180-a}},
()=>{let p=4*rand(5,18);return {theme:'Четырёхугольники',text:`Периметр квадрата равен ${p}. Найдите его сторону.`,answer:p/4}},
()=>{let a=rand(4,12),h=rand(3,10);return {theme:'Площадь',text:`Основание треугольника равно ${a}, высота к нему ${h}. Найдите площадь.`,answer:a*h/2}},
()=>{let m=rand(4,12);return {theme:'Подобные треугольники',text:`Средняя линия треугольника равна ${m}. Найдите параллельную ей сторону.`,answer:2*m}},
()=>{let arc=2*rand(20,80);return {theme:'Окружность',text:`Дуга окружности равна $${arc}^\\circ$. Найдите вписанный угол, опирающийся на неё.`,answer:arc/2}}]; state.homework=makers.map(f=>f());save()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
initHomework();
const start=document.getElementById('start'),workspace=document.getElementById('workspace');
const hasProgress=Object.keys(state.answers).length>0;document.getElementById('startBtn').textContent=hasProgress?'Продолжить':'Начать повторение';
document.getElementById('startBtn').onclick=()=>{start.classList.add('hidden');workspace.classList.remove('hidden');render()};
function render(){renderSidebar();renderTopic();updateProgress();save();typeset()}
function renderSidebar(){const box=document.getElementById('topicList');box.innerHTML='';DATA.forEach((t,i)=>{const b=document.createElement('button');b.className='topic-btn'+(i===currentT?' active':'');b.innerHTML=`<b>${t.title}</b><div class="topic-meta">${topicProgress(i)}</div>`;b.onclick=()=>{currentT=i;currentS=0;state.last={t:i,s:0};render()};box.appendChild(b)})}
function topicProgress(i){if(DATA[i].homework)return '5 задач';const qs=DATA[i].subs.flatMap(s=>s.qs);const done=qs.filter(q=>state.answers[q.id]?.correct).length;return `${done} из ${qs.length}`}
function renderTopic(){const t=DATA[currentT];document.getElementById('topicTitle').textContent=t.title;document.getElementById('topicDesc').textContent=t.desc;const tabs=document.getElementById('tabs');tabs.innerHTML='';t.subs.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===currentS?' active':'');b.textContent=s.name;b.onclick=()=>{currentS=i;state.last={t:currentT,s:i};renderTopic();save();typeset()};tabs.appendChild(b)});renderCards();}
function renderCards(){const box=document.getElementById('cards');box.innerHTML='';const t=DATA[currentT];if(t.homework){renderHomework(box);return}const s=t.subs[currentS];s.qs.forEach((q,idx)=>box.appendChild(cardFor(q,idx)));}
function cardFor(q,idx){const c=document.createElement('article');const rec=state.answers[q.id];c.className='card'+(rec?(rec.correct?' correct':' incorrect'):'');c.dataset.qid=q.id;c.innerHTML=`<div class="owl-reaction">${rec?rec.correct?'🦉✨':'🦉':'🦉'}</div><div class="type">${typeName(q.type)}</div><h3>Задание ${idx+1}</h3><div class="q">${q.text}</div><div class="interaction"></div><div class="feedback ${rec?(rec.correct?'good':'bad'):''}">${rec?(rec.correct?'✓ Верно!':'✕ Попробуй ещё'):''}</div><div class="card-actions"><button class="ghost scratchBtn">Черновик</button><button class="ghost forgetBtn">Не помню</button>${rec?.correct?'<button class="secondary redoBtn">Решить заново</button>':''}</div><div class="scratch-wrap"><div class="scratch-toolbar"><button class="ghost pen">Ручка</button><button class="ghost eraser">Ластик</button><button class="danger clearScratch">Очистить</button></div><canvas class="scratch"></canvas></div>`;buildInteraction(c,q);wireCard(c,q);return c}
function typeName(t){return ({choice1:'Выбор верного высказывания',choiceM:'Выбор верных высказываний',match:'Установление соответствия',number:'Краткий ответ',order:'Восстановление решения',proofmatch:'Восстановление доказательства'})[t]||t}
function buildInteraction(c,q){const i=c.querySelector('.interaction');const saved=state.answers[q.id]?.value;
if(q.type==='choice1'||q.type==='choiceM'){i.className='interaction options';q.options.forEach((o,k)=>{const lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="${q.type==='choice1'?'radio':'checkbox'}" name="${q.id}" value="${k}" ${saved?.includes?.(k)?'checked':''}> <span>${o}</span>`;i.appendChild(lab)});i.onchange=()=>check(q,[...i.querySelectorAll('input:checked')].map(x=>+x.value),c)}
if(q.type==='number'){i.innerHTML=`<div class="answer-row"><input inputmode="decimal" placeholder="Введите число" value="${saved??''}"></div>`;const inp=i.querySelector('input');inp.onchange=()=>check(q,inp.value,c);inp.onblur=()=>{if(inp.value!=='')check(q,inp.value,c)}}
if(q.type==='match'||q.type==='proofmatch'){const table=document.createElement('table');table.className='match-table';q.pairs.forEach((p,k)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${p[0]}</td><td><select data-k="${k}"><option value="">— выберите —</option>${q.choices.map((x,j)=>`<option value="${j}" ${saved?.[k]===j?'selected':''}>${x}</option>`).join('')}</select></td>`;table.appendChild(tr)});i.appendChild(table);table.onchange=()=>{const vals=[...table.querySelectorAll('select')].map(s=>s.value===''?null:+s.value);if(vals.every(v=>v!==null))check(q,vals,c)}}
if(q.type==='order'){const list=document.createElement('div');list.className='solution-list';const order=saved||shuffle([...q.steps.keys()]);order.forEach(k=>{const d=document.createElement('div');d.className='step';d.draggable=true;d.dataset.k=k;d.innerHTML=q.steps[k];list.appendChild(d)});i.appendChild(list);wireDnD(list,()=>check(q,[...list.children].map(x=>+x.dataset.k),c));}
}
function check(q,value,c){let correct=false;if(q.type==='number'){const v=parseFloat(String(value).replace(',','.'));correct=Number.isFinite(v)&&Math.abs(v-q.answer)<1e-9}else if(Array.isArray(q.answer)){correct=JSON.stringify(value)===JSON.stringify(q.answer)};if(state.first[q.id]===undefined)state.first[q.id]=correct;state.answers[q.id]={correct,value};save();rerenderCard(c,q);updateProgress();renderSidebar();}
function rerenderCard(c,q){const parent=c.parentNode;const idx=[...parent.children].indexOf(c);parent.replaceChild(cardFor(q,idx),c);typeset()}
function wireCard(c,q){c.querySelector('.scratchBtn').onclick=()=>{const w=c.querySelector('.scratch-wrap');w.classList.toggle('open');if(w.classList.contains('open'))setupCanvas(c.querySelector('canvas'))};c.querySelector('.forgetBtn').onclick=()=>{if(state.first[q.id]===undefined)state.first[q.id]=false;state.answers[q.id]={correct:false,value:'Не помню'};save();rerenderCard(c,q);updateProgress();renderSidebar()};const redo=c.querySelector('.redoBtn');if(redo)redo.onclick=()=>{state.redo[q.id]=state.answers[q.id]?.correct||false;state.answers[q.id]=null;delete state.answers[q.id];save();rerenderCard(c,q);updateProgress();renderSidebar()};}
function wireDnD(list,onDone){let drag=null;list.addEventListener('dragstart',e=>{drag=e.target.closest('.step');drag?.classList.add('dragging')});list.addEventListener('dragend',()=>{drag?.classList.remove('dragging');onDone()});list.addEventListener('dragover',e=>{e.preventDefault();const y=e.clientY;const els=[...list.querySelectorAll('.step:not(.dragging)')];const next=els.find(el=>y<el.getBoundingClientRect().top+el.offsetHeight/2);if(drag)list.insertBefore(drag,next||null)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setupCanvas(canvas){if(canvas.dataset.ready)return;canvas.dataset.ready=1;const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;const ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineWidth=2;let draw=false,erase=false;const pos=e=>{const rect=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-rect.left,p.clientY-rect.top]};const down=e=>{draw=true;ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault()};const move=e=>{if(!draw)return;ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.lineTo(...pos(e));ctx.stroke();e.preventDefault()};const up=()=>draw=false;['pointerdown'].forEach(ev=>canvas.addEventListener(ev,down));canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',up);const card=canvas.closest('.card');card.querySelector('.pen').onclick=()=>erase=false;card.querySelector('.eraser').onclick=()=>erase=true;card.querySelector('.clearScratch').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height)}
function updateProgress(){const qs=allQuestions();const done=qs.filter(q=>state.answers[q.id]?.correct).length;document.getElementById('progressText').textContent=`Выполнено ${done} из ${qs.length}`;document.getElementById('progressFill').style.width=`${qs.length?done/qs.length*100:0}%`}
function theoryOpen(){const s=DATA[currentT].subs[currentS];if(DATA[currentT].homework)return;state.theoryUsed[`${currentT}-${currentS}`]=true;save();document.getElementById('theoryTitle').textContent=s.name;document.getElementById('theoryContent').innerHTML=s.theory.map(x=>`<div class="theory-card">${x}</div>`).join('');document.getElementById('theoryDrawer').classList.add('open');document.getElementById('overlay').classList.add('open');typeset()}
document.getElementById('theoryBtn').onclick=theoryOpen;document.getElementById('closeTheory').onclick=closeTheory;document.getElementById('overlay').onclick=closeTheory;function closeTheory(){document.getElementById('theoryDrawer').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
function renderHomework(box){state.homework.forEach((h,i)=>{const c=document.createElement('article');c.className='card hw-card';c.innerHTML=`<div class="type">Домашнее задание</div><h3>Задача ${i+1} · ${h.theme}</h3><div class="q">${h.text}</div><div class="answer-row"><span>Ответ: __________________</span></div>`;box.appendChild(c)});const c=document.createElement('article');c.className='card';c.innerHTML=`<h3>Новый вариант</h3><p class="muted">При генерации изменятся числовые данные во всех пяти задачах.</p><button class="primary">Сгенерировать новый вариант</button>`;c.querySelector('button').onclick=()=>{delete state.homework;initHomework();renderCards();typeset()};box.appendChild(c)}
document.getElementById('teacherBtn').onclick=()=>{renderTeacher();document.getElementById('teacherModal').classList.add('open')};document.getElementById('closeTeacher').onclick=()=>document.getElementById('teacherModal').classList.remove('open');
function renderTeacher(){const sum=document.getElementById('teacherSummary');sum.innerHTML='<h3>Сводка по темам</h3>'+DATA.filter(t=>!t.homework).map((t,ti)=>{const qs=t.subs.flatMap(s=>s.qs),first=qs.filter(q=>state.first[q.id]===true).length,now=qs.filter(q=>state.answers[q.id]?.correct).length,used=t.subs.some((s,si)=>state.theoryUsed[`${ti}-${si}`]);return `<div class="teacher-item"><b>${t.title}</b><br>Первичная диагностика: ${pct(first,qs.length)}% → после исправлений: ${pct(now,qs.length)}%<br>Теория: ${used?'обращался':'не обращался'}</div>`}).join('');const keys=document.getElementById('teacherKeys');keys.innerHTML='';DATA.forEach(t=>t.subs.forEach(s=>s.qs.forEach(q=>{const d=document.createElement('div');d.className='teacher-item';d.innerHTML=`<b>${t.title} · ${s.name}</b><div>${q.text}</div><div><span class="badge">Ответ</span> ${answerText(q)}</div>`;keys.appendChild(d)})));state.homework.forEach((h,i)=>{const d=document.createElement('div');d.className='teacher-item';d.innerHTML=`<b>Домашнее задание ${i+1}</b><div>${h.text}</div><div><span class="badge">Ответ</span> ${h.answer}</div>`;keys.appendChild(d)});typeset()}
function answerText(q){if(q.type==='number')return q.answer;if(q.type==='choice1'||q.type==='choiceM')return q.answer.map(i=>i+1).join(', ');if(q.type==='match'||q.type==='proofmatch')return q.answer.map((x,i)=>`${i+1}→${x+1}`).join('; ');if(q.type==='order')return q.answer.map(x=>x+1).join(' → ');return ''}
function pct(a,b){return b?Math.round(a/b*100):0}
document.getElementById('printBtn').onclick=()=>document.getElementById('printMenu').classList.toggle('open');document.getElementById('printMenu').onclick=e=>{const mode=e.target.dataset.print;if(!mode)return;document.body.dataset.print=mode;window.print();document.getElementById('printMenu').classList.remove('open')};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Сбросить весь прогресс?')){localStorage.removeItem('geo8state');location.reload()}};
document.getElementById('pdfBtn').onclick=()=>{const report=document.createElement('div');report.style.padding='24px';report.innerHTML=`<h1>Отчёт по повторению геометрии за 8 класс</h1><p>Дата: ${new Date().toLocaleDateString('ru-RU')}</p>${DATA.filter(t=>!t.homework).map((t,ti)=>{const qs=t.subs.flatMap(s=>s.qs),first=qs.filter(q=>state.first[q.id]===true).length,now=qs.filter(q=>state.answers[q.id]?.correct).length,used=t.subs.some((s,si)=>state.theoryUsed[`${ti}-${si}`]);return `<h3>${t.title}</h3><p>Первичная диагностика: <b>${pct(first,qs.length)}%</b> → После исправлений: <b>${pct(now,qs.length)}%</b><br>Обращение к теории: ${used?'да':'нет'}</p>`}).join('')}`;html2pdf().set({margin:10,filename:'otchet_geometriya_8_klass.pdf',html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(report).save()};
function typeset(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise()}
</script>
