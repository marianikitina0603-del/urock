<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Повторение курса алгебры — 8 класс</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<style>
:root{
  --green:#98FB98;
  --cream:#FFFFE0;
  --deep:#245c3a;
  --deep2:#173f29;
  --white:#fff;
  --line:#b8d9b8;
  --good:#d8f7df;
  --bad:#ffe0e0;
  --shadow:0 10px 28px rgba(36,92,58,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,var(--cream),#fff 48%,#efffef);color:#203529}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,224,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.brand h1{margin:0;font-size:clamp(22px,3vw,34px);color:var(--deep2)}
.brand p{margin:3px 0 0;color:#53705e}
.scorebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--green);padding:10px 14px;border-radius:18px;font-weight:700}
button{border:none;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;transition:.2s;font-size:14px}
button:hover{transform:translateY(-1px)}
.primary{background:var(--deep);color:white}.soft{background:var(--green);color:var(--deep2)}.light{background:var(--cream);border:1px solid var(--line);color:var(--deep2)}.danger{background:#ffe6e6;color:#7c2d2d}
.layout{max-width:1200px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:245px 1fr;gap:20px}
.sidebar{align-self:start;position:sticky;top:108px;background:white;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.navbtn{width:100%;text-align:left;margin:5px 0;padding:11px 12px;border-radius:12px;background:#f7fff7;color:#284f37;border:1px solid transparent}.navbtn.active{background:var(--green);border-color:#6fd66f}
.content{min-width:0}.section{display:none;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.section.active{display:block}.section h2{margin-top:0;color:var(--deep2);font-size:28px}.section-intro{background:var(--cream);border-left:6px solid var(--green);padding:14px 16px;border-radius:14px;margin-bottom:18px}
.task{background:#fff;border:1px solid #dfeadf;border-radius:18px;padding:17px;margin:16px 0}.task.correct{border-color:#57b86b;background:var(--good)}.task.wrong{border-color:#e18484;background:var(--bad)}.task-title{font-weight:800;color:var(--deep2);margin-bottom:8px}.options{display:grid;gap:8px;margin:10px 0}.option{padding:10px 12px;border:1px solid #d9e6d9;border-radius:12px;background:#fbfffb}
input[type=text],input[type=number]{width:min(360px,100%);padding:11px 12px;border:1px solid #bfcfbe;border-radius:12px;font-size:16px}.feedback{margin-top:9px;font-weight:700;min-height:22px}.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.theory{display:none;margin:10px 0 0;padding:14px;background:var(--cream);border-radius:14px;border:1px dashed #b7c897}.theory.show{display:block}.scratch{display:none;margin-top:12px;padding:12px;border-radius:14px;background:#f8fff8;border:1px solid #cfe3cf}.scratch.show{display:block}.canvas-wrap{position:relative}canvas{width:100%;height:230px;background:white;border:1px solid #afc9af;border-radius:12px;touch-action:none;display:block}.progress{height:12px;background:#edf5ed;border-radius:999px;overflow:hidden;min-width:190px;border:1px solid #c8ddc8}.progress>div{height:100%;width:0;background:var(--deep)}.summary-card{background:linear-gradient(135deg,var(--green),var(--cream));padding:18px;border-radius:18px;margin-top:18px}.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.skill{background:white;padding:12px;border-radius:12px;border:1px solid #cae1ca}.small{font-size:13px;color:#5c725f}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:6px}.navbtn{min-width:190px}.skills{grid-template-columns:1fr}}
@media print{header,.sidebar,.task-actions,.footer-actions{display:none!important}body{background:#fff}.layout{display:block;margin:0;padding:0}.section{display:block!important;box-shadow:none;border:none;page-break-after:always}.theory{display:block!important}.scratch{display:block!important}canvas{height:180px}}
</style>
</head>
<body>
<header><div class="topbar"><div class="brand"><h1>Повторение курса алгебры — 8 класс</h1><p>Автопроверка • теория • черновик • итоговый результат</p></div><div class="scorebox"><span>Баллы: <b id="score">0</b>/<b id="total">0</b></span><div class="progress"><div id="progressBar"></div></div></div></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="content" id="content"></main></div>
<script>
const sections = [
{id:'rational',title:'1. Рациональные выражения',intro:'Повторим ОДЗ, сокращение дробей и действия с рациональными выражениями.',theory:`<b>Главное:</b> знаменатель дроби не может быть равен нулю. При сокращении используем разложение на множители: $$\\frac{a^2-b^2}{a-b}=a+b,\\quad a\\ne b.$$`,tasks:[{type:'text',q:'Сократите дробь: $\\frac{x^2-9}{x-3}$, $x\\ne3$.',a:['x+3','x + 3'],hint:'Используйте формулу разности квадратов.'},{type:'choice',q:'Укажите ОДЗ выражения $\\frac{5}{x-7}$.',opts:['$x\\ne 0$','$x\\ne 5$','$x\\ne 7$','$x>7$'],a:2},{type:'text',q:'Вычислите при $x=4$: $\\frac{x^2-4}{x-2}$.',a:['6'],hint:'Сначала можно сократить дробь.'}]},
{id:'quadratic',title:'2. Квадратные корни',intro:'Свойства арифметического квадратного корня и преобразование выражений.',theory:`Для $a\\ge0$, $b\\ge0$: $\\sqrt{ab}=\\sqrt a\\sqrt b$. Также $\\sqrt{a^2}=|a|$.`,tasks:[{type:'text',q:'Вычислите: $\\sqrt{144}$.',a:['12']},{type:'choice',q:'Чему равно $\\sqrt{49a^2}$?',opts:['$7a$','$49a$','$7|a|$','$|49a|$'],a:2},{type:'text',q:'Упростите: $\\sqrt{50}$. Ответ запишите в виде $k\\sqrt2$.',a:['5sqrt2','5√2','5\\sqrt2','5 sqrt2']}]},
{id:'equations',title:'3. Квадратные уравнения',intro:'Неполные и полные квадратные уравнения, дискриминант и теорема Виета.',theory:`Для $ax^2+bx+c=0$, $a\\ne0$: $$D=b^2-4ac,\\qquad x_{1,2}=\\frac{-b\\pm\\sqrt D}{2a}.$$ Если $x_1,x_2$ — корни, то $x_1+x_2=-\\frac ba$, $x_1x_2=\\frac ca$.`,tasks:[{type:'text',q:'Решите: $x^2-9=0$. Укажите корни через точку с запятой.',a:['-3;3','3;-3','-3; 3','3; -3']},{type:'choice',q:'Сколько корней имеет уравнение $x^2+4x+5=0$?',opts:['0','1','2','Бесконечно много'],a:0},{type:'text',q:'Найдите сумму корней уравнения $2x^2-7x+3=0$.',a:['3.5','3,5','7/2']}]},
{id:'inequalities',title:'4. Неравенства',intro:'Линейные неравенства и системы неравенств.',theory:`При умножении или делении неравенства на отрицательное число знак меняется на противоположный. Например: $-2x>6 \\Rightarrow x<-3$.`,tasks:[{type:'text',q:'Решите: $3x-5>7$. Ответ: $x>$ ...',a:['4']},{type:'choice',q:'Какой промежуток является решением $-2x\\le 6$?',opts:['$x\\le-3$','$x\\ge-3$','$x\\le3$','$x\\ge3$'],a:1},{type:'text',q:'Найдите наименьшее целое решение системы $x>1$, $x\\le5$.',a:['2']}]},
{id:'functions',title:'5. Функции и графики',intro:'Линейная функция, функция $y=\\frac{k}{x}$ и чтение графиков по формуле.',theory:`Линейная функция: $y=kx+b$. Число $k$ отвечает за наклон, $b$ — ордината точки пересечения с осью $Oy$.`,tasks:[{type:'choice',q:'Какой график имеет функция $y=2x-3$?',opts:['Прямая','Парабола','Гипербола','Окружность'],a:0},{type:'text',q:'Найдите значение $y$ при $x=4$ для $y=-2x+5$.',a:['-3']},{type:'choice',q:'Для функции $y=\\frac{6}{x}$ укажите запрещённое значение $x$.',opts:['$-6$','$0$','$1$','$6$'],a:1}]},
{id:'powers',title:'6. Степени',intro:'Свойства степеней с целым показателем.',theory:`Для $a\\ne0$: $a^m\\cdot a^n=a^{m+n}$, $\\frac{a^m}{a^n}=a^{m-n}$, $(a^m)^n=a^{mn}$, $a^{-n}=\\frac1{a^n}$.`,tasks:[{type:'text',q:'Упростите: $a^3\\cdot a^5=a^{\\,?}$',a:['8']},{type:'text',q:'Вычислите: $2^{-3}$. Ответ можно записать дробью.',a:['1/8','0.125','0,125']},{type:'choice',q:'Чему равно $(x^2)^4$?',opts:['$x^6$','$x^8$','$x^{16}$','$2x^4$'],a:1}]},
{id:'word',title:'7. Текстовые задачи',intro:'Составление уравнений по условию задачи.',theory:`Полезно вводить переменную, составлять математическую модель, решать её и обязательно проверять смысл ответа.`,tasks:[{type:'text',q:'Одно число на 5 больше другого, а их сумма равна 27. Найдите меньшее число.',a:['11']},{type:'text',q:'Прямоугольник имеет длину на 3 см больше ширины. Периметр 26 см. Найдите ширину.',a:['5']},{type:'choice',q:'Скорость автомобиля 60 км/ч. Какое расстояние он проедет за 2,5 ч?',opts:['24 км','120 км','150 км','180 км'],a:2}]}
];
let state={};sections.forEach(s=>s.tasks.forEach((t,i)=>state[`${s.id}-${i}`]={checked:false,correct:false}));
const sidebar=document.getElementById('sidebar'),content=document.getElementById('content');
function render(){sections.forEach((s,si)=>{const nb=document.createElement('button');nb.className='navbtn'+(si===0?' active':'');nb.textContent=s.title;nb.onclick=()=>showSection(s.id,nb);sidebar.appendChild(nb);const sec=document.createElement('section');sec.id=s.id;sec.className='section'+(si===0?' active':'');sec.innerHTML=`<h2>${s.title}</h2><div class="section-intro">${s.intro}</div><button class="soft" onclick="toggleTheory('${s.id}')">📘 Показать / скрыть теорию</button><div class="theory" id="theory-${s.id}">${s.theory}</div>`;s.tasks.forEach((t,i)=>{const d=document.createElement('div');d.className='task';d.id=`task-${s.id}-${i}`;let input='';if(t.type==='choice'){input=`<div class="options">`+t.opts.map((o,idx)=>`<label class="option"><input type="radio" name="${s.id}-${i}" value="${idx}"> ${o}</label>`).join('')+`</div>`}else{input=`<input type="text" id="input-${s.id}-${i}" placeholder="Введите ответ">`}d.innerHTML=`<div class="task-title">Задание ${i+1}</div><div>${t.q}</div>${input}<div class="task-actions"><button class="primary" onclick="checkTask('${s.id}',${i})">Проверить</button><button class="light" onclick="toggleScratch('${s.id}',${i})">✏️ Черновик</button>${t.hint?`<button class="light" onclick="alert('${t.hint.replace(/'/g,"\\'")}')">💡 Подсказка</button>`:''}</div><div class="feedback" id="fb-${s.id}-${i}"></div><div class="scratch" id="scratch-${s.id}-${i}"><div class="small">Пишите мышью, стилусом или пальцем.</div><div class="canvas-wrap"><canvas id="canvas-${s.id}-${i}" width="900" height="230"></canvas></div><div class="task-actions"><button class="danger" onclick="clearCanvas('${s.id}',${i})">Очистить черновик</button></div></div>`;sec.appendChild(d)});const summary=document.createElement('div');summary.className='summary-card';summary.innerHTML=`<b>Раздел завершён?</b> Проверьте все задания, затем переходите к следующей теме.`;sec.appendChild(summary);content.appendChild(sec)});document.getElementById('total').textContent=sections.reduce((a,s)=>a+s.tasks.length,0);const final=document.createElement('section');final.id='final';final.className='section';final.innerHTML=`<h2>Итоги повторения</h2><div class="section-intro">Здесь можно получить общий результат и рекомендации по темам.</div><button class="primary" onclick="buildReport()">Сформировать итоговый отчёт</button><div id="report"></div><div class="footer-actions"><button class="light" onclick="window.print()">🖨️ Печать</button><button class="danger" onclick="resetAll()">Сбросить результаты</button></div>`;content.appendChild(final);const fbtn=document.createElement('button');fbtn.className='navbtn';fbtn.textContent='📊 Итоги';fbtn.onclick=()=>showSection('final',fbtn);sidebar.appendChild(fbtn);if(window.MathJax)MathJax.typesetPromise()}
function normalize(v){return(v??'').toString().trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/\\sqrt\{?2\}?/g,'sqrt2')}
function checkTask(sid,i){const s=sections.find(x=>x.id===sid),t=s.tasks[i],key=`${sid}-${i}`;let ok=false;if(t.type==='choice'){const el=document.querySelector(`input[name="${sid}-${i}"]:checked`);ok=!!el&&Number(el.value)===t.a}else{const val=normalize(document.getElementById(`input-${sid}-${i}`).value);ok=t.a.some(a=>normalize(a)===val)}state[key]={checked:true,correct:ok};const task=document.getElementById(`task-${sid}-${i}`),fb=document.getElementById(`fb-${sid}-${i}`);task.classList.remove('correct','wrong');task.classList.add(ok?'correct':'wrong');fb.textContent=ok?'✓ Верно!':'✗ Пока неверно. Проверьте решение и попробуйте ещё раз.';updateScore()}
function updateScore(){const all=Object.values(state),score=all.filter(x=>x.correct).length,checked=all.filter(x=>x.checked).length;document.getElementById('score').textContent=score;document.getElementById('progressBar').style.width=(checked/all.length*100)+'%'}
function toggleTheory(id){document.getElementById('theory-'+id).classList.toggle('show')}
function toggleScratch(sid,i){const box=document.getElementById(`scratch-${sid}-${i}`);box.classList.toggle('show');if(box.classList.contains('show'))initCanvas(`canvas-${sid}-${i}`)}
const canvasInit=new Set();function initCanvas(id){if(canvasInit.has(id))return;canvasInit.add(id);const c=document.getElementById(id),ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#203529';let drawing=false;function p(e){const r=c.getBoundingClientRect();const x=(e.clientX-r.left)*(c.width/r.width),y=(e.clientY-r.top)*(c.height/r.height);return{x,y}}c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)});c.addEventListener('pointermove',e=>{if(!drawing)return;const q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()});c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false)}
function clearCanvas(sid,i){const c=document.getElementById(`canvas-${sid}-${i}`);c.getContext('2d').clearRect(0,0,c.width,c.height)}
function showSection(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function buildReport(){const report=document.getElementById('report');const all=Object.values(state),score=all.filter(x=>x.correct).length,total=all.length;const pct=Math.round(score/total*100);let skillHTML='';sections.forEach(s=>{const arr=s.tasks.map((_,i)=>state[`${s.id}-${i}`]);const good=arr.filter(x=>x.correct).length;const p=Math.round(good/arr.length*100);let rec=p===100?'Тема усвоена уверенно.':p>=67?'Повторить отдельные типы заданий.':'Рекомендуется повторить теорию и решить дополнительные упражнения.';skillHTML+=`<div class="skill"><b>${s.title}</b><br>${good}/${arr.length} верно — ${p}%<div class="small">${rec}</div></div>`});let level=pct>=85?'Отличная готовность':pct>=70?'Хорошая готовность':pct>=50?'Базовый уровень, есть пробелы':'Нужно системное повторение';report.innerHTML=`<div class="summary-card"><h3>${level}</h3><p><b>Результат:</b> ${score} из ${total} (${pct}%).</p><div class="skills">${skillHTML}</div></div>`;if(window.MathJax)MathJax.typesetPromise([report])}
function resetAll(){if(!confirm('Сбросить все ответы и результаты?'))return;location.reload()}
render();
</script>
</body>
</html>
