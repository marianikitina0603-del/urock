<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Итоговый тест по информатике</title>
<style>
:root {
  --bg:#f7f3e9; --card:#fffdf7; --sage:#7f9a87; --sage2:#dfe9df;
  --text:#26332b; --muted:#66736b; --line:#d8ded7; --ok:#2f7d4a; --bad:#b44949;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(247,243,233,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1050px;margin:auto;padding:18px}
h1{font-size:28px;margin:0 0 6px} .sub{color:var(--muted);margin-bottom:14px}
.progress{height:10px;background:#e7e3d9;border-radius:99px;overflow:hidden} .progress>div{height:100%;width:0;background:var(--sage);transition:.2s}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0 4px}
.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--sage);color:white;border-color:var(--sage)}
main{max-width:1050px;margin:auto;padding:16px 18px 60px}
.section{display:none} .section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px rgba(0,0,0,.03)}
.qnum{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:7px} .qtext{font-size:18px;font-weight:650;line-height:1.4;margin-bottom:12px}
.option{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;background:white}
.option:hover{border-color:#aab9ac;background:#fbfcf9} .option input{margin-right:9px}
.option.correct{border-color:var(--ok);background:#edf8f0} .option.wrong{border-color:var(--bad);background:#fbefef}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:var(--sage);color:white} .secondary{background:var(--sage2);color:var(--text)} .danger{background:#f0dddd;color:#7b3434}
.result{background:#eef4ec;border:1px solid #cad7c8;border-radius:16px;padding:18px;margin:18px 0;display:none}
.result strong{font-size:25px}
.data-table{border-collapse:collapse;width:100%;font-size:13px;margin:12px 0;overflow:auto}
.data-table th,.data-table td{border:1px solid var(--line);padding:5px;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:8px}
@media(max-width:650px){h1{font-size:22px} .qtext{font-size:16px} .card{padding:14px}}
@media print{header,.controls,.result{display:none!important} .section{display:block!important} body{background:white} .card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Итоговый тест по информатике</h1>
    <div class="sub" id="summaryLine">Вопросы загружаются…</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<main>
  <div id="sections"></div>
  <div class="result" id="result"></div>
  <div class="controls">
    <button class="primary" onclick="finishTest()">Завершить тест</button>
    <button class="secondary" onclick="window.print()">Печать</button>
    <button class="danger" onclick="resetTest()">Сбросить ответы</button>
  </div>
</main>

роцессор", "Монитор", "Клавиатура"], "answer": 1}, {"q": "Хостинг — это:", "opts": ["Тема сайта", "Объём сайта", "Шаблон сайта", "Место размещения сайта в интернете"], "answer": 4}, {"q": "Начальный этап создания сайта — это выбор:", "opts": ["Темы сайта", "Объёма сайта", "Шаблона сайта", "Места размещения сайта в интернете"], "answer": 1}]}];
const TABLE_HTML = "<table class='data-table'><tr><th>Фамилия имя</th><th>Математика</th><th>Физика</th><th>Сочинение</th><th>Сумма баллов</th><th>Средний балл</th></tr><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><td>Аманов Алишер</td><td>5</td><td>4</td><td>3</td><td>12</td><td>4,0</td></tr><tr><td>Жусупов Рамазан</td><td>4</td><td>5</td><td>4</td><td>13</td><td>4,3</td></tr><tr><td>Константинов Никита</td><td>4</td><td>5</td><td>4</td><td>13</td><td>4,3</td></tr><tr><td>Орехова Татьяна</td><td>3</td><td>5</td><td>5</td><td>13</td><td>4,3</td></tr><tr><td>Орлова Анна</td><td>3</td><td>2</td><td>0</td><td>5</td><td>1,7</td></tr></table>";
const state = JSON.parse(sessionStorage.getItem('informatics-test-state') || '{}');
const TOTAL = TESTS.reduce((sum,t)=>sum+t.questions.length,0);
document.getElementById('summaryLine').textContent =
  `${TOTAL} вопросов · ${TESTS.length} тематических блоков · 1 балл за правильный ответ`;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

const tabs=document.getElementById('tabs'), sections=document.getElementById('sections');
TESTS.forEach((t,ti)=>{
  const b=document.createElement('button');
  b.className='tab'+(ti===0?' active':'');
  b.textContent=`${t.num}. ${t.title}`;
  b.onclick=()=>showTab(ti);
  tabs.appendChild(b);

  const sec=document.createElement('section');
  sec.className='section'+(ti===0?' active':'');
  sec.dataset.index=ti;
  sec.innerHTML=`<h2>${esc(t.title)}</h2>`;
  t.questions.forEach((q,qi)=>{
    const key=`t${t.num}q${qi+1}`;
    const card=document.createElement('div');
    card.className='card';
    let extra = (t.num===5 && qi===2) ? TABLE_HTML : '';
    card.innerHTML=`<div class="qnum">Вопрос ${qi+1} из ${t.questions.length}</div>
      <div class="qtext">${esc(q.q)}</div>${extra}
      <div class="opts">${q.opts.map((o,oi)=>`
        <label class="option"><input type="radio" name="${key}" value="${oi+1}" ${Number(state[key])===oi+1?'checked':''}> ${esc(o)}</label>`
      ).join('')}</div>`;
    sec.appendChild(card);
  });
  const c=document.createElement('div');
  c.className='controls';
  c.innerHTML=`<button class="secondary" onclick="checkSection(${ti})">Проверить раздел</button>`;
  sec.appendChild(c);
  sections.appendChild(sec);
});

document.addEventListener('change',e=>{
  if(e.target.matches('input[type=radio]')){
    state[e.target.name]=Number(e.target.value);
    sessionStorage.setItem('informatics-test-state',JSON.stringify(state));
    updateProgress();
  }
});

function showTab(i){
  document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',j===i));
  document.querySelectorAll('.section').forEach((x,j)=>x.classList.toggle('active',j===i));
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  const total=TOTAL, done=Object.keys(state).filter(k=>k.startsWith('t')).length;
  document.getElementById('bar').style.width=(done/total*100)+'%';
}
function checkSection(i){
  const t=TESTS[i], sec=document.querySelector(`.section[data-index="${i}"]`);
  t.questions.forEach((q,qi)=>{
    const key=`t${t.num}q${qi+1}`, chosen=Number(state[key]);
    const labels=sec.querySelectorAll('.card')[qi].querySelectorAll('.option');
    labels.forEach((lab,oi)=>{
      lab.classList.remove('correct','wrong');
      if(oi+1===q.answer) lab.classList.add('correct');
      if(chosen===oi+1 && chosen!==q.answer) lab.classList.add('wrong');
    });
  });
}
function finishTest(){
  let score=0, answered=0;
  TESTS.forEach(t=>t.questions.forEach((q,qi)=>{
    const v=Number(state[`t${t.num}q${qi+1}`]);
    if(v) answered++;
    if(v===q.answer) score++;
  }));
  const pct=Math.round(score/TOTAL*100);
  let grade= pct>=96 ? '5 — Отлично' : pct>=81 ? '4 — Хорошо' : pct>=67 ? '3 — Удовлетворительно' : '2 — Неудовлетворительно';
  const r=document.getElementById('result');
  r.style.display='block';
  r.innerHTML=`<strong>${score} / ${TOTAL}</strong><br>${pct}% правильных ответов<br><b>Оценка: ${grade}</b><div class="note">Отвечено: ${answered} из ${TOTAL}.</div>`;
  TESTS.forEach((_,i)=>checkSection(i));
  r.scrollIntoView({behavior:'smooth',block:'center'});
}
function resetTest(){
  if(!confirm('Сбросить все выбранные ответы?')) return;
  sessionStorage.removeItem('informatics-test-state');
  location.reload();
}
updateProgress();
</script>
