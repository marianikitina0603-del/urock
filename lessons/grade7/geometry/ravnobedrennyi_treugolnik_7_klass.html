n{font-size:1.05rem;margin:1rem 0}.answer-zone{display:grid;gap:10px}.option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fffdf8}.option input{margin-top:.28rem}.short{width:min(100%,460px);padding:.65rem .75rem;border:1px solid var(--line);border-radius:10px;background:white}.feedback{min-height:2.2rem;margin-top:10px;padding:9px 12px;border-radius:12px}.feedback.good{background:var(--goodbg);color:#245936;border:1px solid #a8c9af;animation:pop .25s ease}.feedback.bad{background:var(--badbg);color:#7c3932;border:1px solid #ddb3ab}@keyframes pop{50%{transform:scale(1.01)}}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.theory{background:var(--green2);border:1px solid #b7c9b3;border-radius:14px;padding:14px;align-self:start}.theory h3{margin-top:0}.progressline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}.navrow .counter{text-align:center;color:var(--muted)}.scratch-wrap{margin-top:12px}.scratch-wrap summary{cursor:pointer;font-weight:700;color:var(--accent)}.scratch-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.scratch{width:100%;height:210px;border:1px solid var(--line);border-radius:12px;background-color:white;background-image:linear-gradient(#dbe4d9 1px,transparent 1px),linear-gradient(90deg,#dbe4d9 1px,transparent 1px);background-size:18px 18px;touch-action:none}.small{font-size:.85rem;color:var(--muted)}.drag-bank,.drop-row{display:flex;gap:8px;flex-wrap:wrap}.drag-item{padding:8px 11px;background:white;border:1px solid var(--line);border-radius:10px;cursor:grab}.drop{min-height:48px;min-width:130px;padding:7px;border:2px dashed #abb9a8;border-radius:10px;background:#fbfaf4}.order-list{display:grid;gap:8px}.order-step{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 12px <script>
/* =========================================================
   ЕДИНЫЙ БЛОК ДАННЫХ. Здесь можно менять содержание листа.

const settings={
  attempts:2,                         // число попыток до показа ответа
  theme:'beige-green',                // бежево-зелёная пастельная тема
  showOneTaskAtATime:true,            // задания показываются по одному
  shuffleChoiceOptions:true           // варианты перемешиваются при открытии
};

const sections=[
 {id:'review',title:'Повторение: прямоугольный треугольник',short:'Повторение', theory:`<b>Прямоугольный треугольник</b> имеет один угол 90°. Сумма двух острых углов равна 90°. Сторона напротив прямого угла — <b>гипотенуза</b>, две другие — <b>катеты</b>. Если острый угол равен 30°, то противолежащий ему катет равен половине гипотенузы.`},
 {id:'isosceles',title:'Равнобедренный треугольник',short:'Равнобедренный', theory:`В <b>равнобедренном треугольнике</b> две стороны равны и называются боковыми, третья — основанием. Углы при основании равны. Медиана, проведённая <b>к основанию</b>, одновременно является биссектрисой и высотой.`},
 {id:'equilateral',title:'Равносторонний треугольник',short:'Равносторонний', theory:`В <b>равностороннем треугольнике</b> все три стороны равны, все три угла равны 60°. Его периметр: \(P=3a\). Равносторонний треугольник является частным случаем равнобедренного.`}
];

const tasks=[
 {id:2,section:'review',type:'short',difficulty:'базовая',skill:'сумма углов треугольника',text:'№2. Продолжите предложение: Если сумма двух углов треугольника равна 90°. то ……',answer:['треугольник прямоугольный','то треугольник прямоугольный','третий угол равен 90','третий угол равен 90°','третий угол 90'],hint:'Вспомните, чему равна сумма всех углов треугольника.',explain:'Сумма углов треугольника равна 180°. Если два угла вместе дают 90°, третий угол равен 90°, значит треугольник прямоугольный.'},
 {id:5,section:'review',type:'short',difficulty:'базовая',skill:'острые углы прямоугольного треугольника',text:'№5. Если в прямоугольном треугольнике, один из улов равен 27 , то другой острый угол равен…',answer:[63,'63°'],hint:'Два острых угла прямоугольного треугольника в сумме дают 90°.',explain:'\(90°-27°=63°\).'},
 {id:7,section:'review',type:'shortmulti',difficulty:'повышенная',skill:'катет напротив угла 30°',text:'№7. Дан прямоугольный треугольник АВС с прямым углом С. Известно, что АВ+ВС=25,8 см и угол а равен 30 градусам.Найти АВ, ВС.',fields:[{label:'АВ =',answer:17.2},{label:'ВС =',answer:8.6}],hint:'Если угол A равен 30°, то катет ВС равен половине гипотенузы АВ.',explain:'Пусть \(AB=x\). Тогда \(BC=x/2\), поэтому \(x+x/2=25,8\). Отсюда \(AB=17,2\) см, \(BC=8,6\) см.'},
 {id:4,section:'review',type:'multi',difficulty:'средняя',skill:'распознавание свойств треугольников',text:'№4. Выберите неверное утверждение:',options:['А) Треугольник называется равносторонним, если все его стороны равны;','Б) Против большего угла треугольника лежит и большая сторона','В) В равнобедренном треугольнике медиана является и биссектрисой, и высотой','Г) В прямоугольном треугольнике гипотенуза равна сумме катетов'],correct:[2,3],hint:'Проверьте отдельно утверждение про медиану: любую ли медиану имеют в виду? И сравните гипотенузу с суммой катетов.',explain:'Буквально неверны В и Г. В утверждении В не уточнено, что медиана проведена к основанию; только такая медиана является также высотой и биссектрисой. Г неверно: гипотенуза меньше суммы катетов.'},

 {id:1,section:'isosceles',type:'short',difficulty:'базовая',skill:'периметр равнобедренного треугольника',text:'№1.  △  ABC-равнобедренный, АС-основание, АС=6,2 см. АВ в 2 раза больше. Найдите периметр треугольника ABC.',answer:[31,'31 см'],hint:'Если АС — основание, то АВ и ВС — равные боковые стороны.',explain:'\(AB=2·6,2=12,4\) см, значит \(BC=12,4\) см. \(P=12,4+12,4+6,2=31\) см.'},
 {id:3,section:'isosceles',type:'single',difficulty:'базовая',skill:'неравенство треугольника и перевод единиц',text:'№3. Существует ли треугольник, стороны которого равны 37 см; 4 дм; 8,5 дм?',options:['Да, существует','Нет, не существует'],correct:1,hint:'Сначала переведите все длины в одни единицы, затем сложите две меньшие стороны.',explain:'4 дм = 40 см, 8,5 дм = 85 см. \(37+40=77<85\), поэтому треугольник не существует.'},
 {id:6,section:'isosceles',type:'shortmulti',difficulty:'средняя',skill:'уравнение по периметру равнобедренного треугольника',text:'№6. Периметр равнобедренного треугольника равен 44,5 см. Найдите его стороны, если боковая сторона на 2 см больше основания.',fields:[{label:'Основание =',answer:13.5},{label:'Боковая сторона =',answer:15.5}],hint:'Обозначьте основание через x, тогда каждая боковая сторона равна x+2.',explain:'\(x+2(x+2)=44,5\), значит \(3x=40,5\), \(x=13,5\). Боковые стороны по 15,5 см.'},
 {id:9,section:'isosceles',type:'shortmulti',difficulty:'средняя',skill:'углы равнобедренного треугольника',text:'№9. В равнобедренном треугольнике ABC стороны AB и BC равны. Угол A равен 52°. Найдите углы B и C.',fields:[{label:'∠B =',answer:76},{label:'∠C =',answer:52}],hint:'Основание — AC, поэтому углы при основании равны.',explain:'\(∠A=∠C=52°\). Тогда \(∠B=180°-52°-52°=76°\).'},
 {id:10,section:'isosceles',type:'single',difficulty:'средняя',skill:'свойство медианы к основанию',text:'№10. В равнобедренном треугольнике ABC основание AC. Медиана BM проведена к основанию. Что обязательно верно?',options:['BM ⟂ AC','∠A = ∠B','AB = AC','BM = AC'],correct:0,hint:'Медиана, проведённая к основанию равнобедренного треугольника, имеет ещё два свойства.',explain:'Медиана BM к основанию одновременно является высотой, поэтому \(BM⊥AC\).'},
 {id:8,section:'isosceles',type:'shortmulti',difficulty:'повышенная',skill:'периметр и неравенство треугольника',text:'№8. Известно, что периметр равнобедренного треугольника равен 80,4 см. Одна из сторон в 2 раза больше другой. Найти стороны треугольника. Сколько решений имеет задача.',fields:[{label:'Меньшая сторона =',answer:16.08},{label:'Большая боковая сторона =',answer:32.16},{label:'Число решений =',answer:1}],hint:'Рассмотрите оба возможных отношения основания и боковой стороны, затем проверьте неравенство треугольника.',explain:'Рабочий случай: боковая сторона в 2 раза больше основания. Тогда \(2·2x+x=80,4\), \(x=16,08\), боковые стороны по 32,16 см. Если основание в 2 раза больше боковой стороны, получается вырожденный случай: основание равно сумме двух боковых сторон. Поэтому решение одно.'},

 {id:11,section:'equilateral',type:'short',difficulty:'базовая',skill:'периметр равностороннего треугольника',text:'№11. Сторона равностороннего треугольника равна 8,4 см. Найдите его периметр.',answer:[25.2,'25,2','25.2 см','25,2 см'],hint:'У равностороннего треугольника три одинаковые стороны.',explain:'\(P=3·8,4=25,2\) см.'},
 {id:12,section:'equilateral',type:'fill',difficulty:'базовая',skill:'свойства равностороннего треугольника',text:'№12. Заполните пропуски: «В равностороннем треугольнике все стороны ___, а каждый угол равен ___».',bank:['равны','60°','90°','параллельны'],answers:['равны','60°'],hint:'Вспомните определение равностороннего треугольника и сумму его углов.',explain:'Все стороны равны. Три равных угла в сумме дают 180°, поэтому каждый равен 60°.'},
 {id:13,section:'equilateral',type:'single',difficulty:'средняя',skill:'связь видов треугольников',text:'№13. Какое утверждение верно для любого равностороннего треугольника?',options:['Он является равнобедренным','Он является прямоугольным','Один из его углов больше 60°','Его стороны могут иметь три разные длины'],correct:0,hint:'Сравните определение равнобедренного и равностороннего треугольников.',explain:'В равностороннем треугольнике можно выбрать любые две стороны: они равны, поэтому такой треугольник является равнобедренным.'},
 {id:14,section:'equilateral',type:'shortmulti',difficulty:'повышенная',skill:'периметр и сторона равностороннего треугольника',text:'№14. Периметр равностороннего треугольника на 18 см больше длины одной его стороны. Найдите сторону и периметр треугольника.',fields:[{label:'Сторона =',answer:9},{label:'Периметр =',answer:27}],hint:'Если сторона равна x, то периметр равен 3x. Составьте уравнение 3x = x + 18.',explain:'\(3x=x+18\), значит \(2x=18\), \(x=9\) см. Периметр \(27\) см.'},

 {id:15,section:'isosceles',type:'order',difficulty:'сложная',skill:'восстановление решения задачи на периметр равнобедренного треугольника',text:'№15. В равнобедренном треугольнике боковая сторона на 4 см длиннее основания, а периметр равен 50 см. Восстановите правильный порядок решения.',steps:['Обозначим основание через \(x\) см, тогда боковая сторона равна \(x+4\) см.','Составим уравнение: \(x+2(x+4)=50\).','Раскроем скобки: \(3x+8=50\).','Получим: \(3x=42\), поэтому \(x=14\).','Боковые стороны: \(14+4=18\) см. Ответ: 14 см, 18 см, 18 см.'],hint:'Сначала вводят неизвестное, затем составляют уравнение по периметру, решают его и только после этого находят остальные стороны.',explain:'Правильная последовательность приводит к уравнению \(x+2(x+4)=50\). Основание равно 14 см, боковые стороны — по 18 см.'},
 {id:16,section:'isosceles',type:'order',difficulty:'сложная',skill:'восстановление решения задачи на углы равнобедренного треугольника',text:'№16. В равнобедренном треугольнике угол при вершине в 4 раза больше угла при основании. Восстановите решение задачи и найдите все углы.',steps:['Пусть каждый угол при основании равен \(x°\).','Тогда угол при вершине равен \(4x°\).','По сумме углов треугольника: \(x+x+4x=180°\).','Отсюда \(6x=180°\), значит \(x=30°\).','Углы треугольника: \(30°, 30°, 120°\).'],hint:'У равнобедренного треугольника два угла при основании равны. После обозначения неизвестного используйте сумму углов 180°.',explain:'Два угла при основании равны по 30°, а угол при вершине равен \(4·30°=120°\).'},
 {id:17,section:'equilateral',type:'order',difficulty:'сложная',skill:'восстановление решения задачи на периметры равносторонних треугольников',text:'№17. Сторона одного равностороннего треугольника на 3,5 см больше стороны другого. Разность их периметров равна 10,5 см. Восстановите рассуждение, показывающее, почему это условие выполняется при любой длине меньшей стороны.',steps:['Пусть сторона меньшего треугольника равна \(x\) см.','Тогда сторона большего треугольника равна \(x+3,5\) см.','Их периметры равны \(3x\) и \(3(x+3,5)\).','Разность периметров: \(3(x+3,5)-3x\).','После упрощения получаем \(10,5\) см независимо от \(x\).'],hint:'Периметр равностороннего треугольника в 3 раза больше его стороны. Выразите оба периметра через одну переменную.',explain:'При увеличении стороны равностороннего треугольника на 3,5 см его периметр увеличивается втрое сильнее: на \(3·3,5=10,5\) см.'},
 {id:18,section:'equilateral',type:'order',difficulty:'сложная',skill:'восстановление доказательства свойства равностороннего треугольника',text:'№18. Восстановите доказательство: «Каждый угол равностороннего треугольника равен 60°».',steps:['В равностороннем треугольнике все три стороны равны.','Следовательно, углы, лежащие напротив равных сторон, тоже равны.','Обозначим величину каждого угла через \(x\).','Сумма углов треугольника равна 180°, поэтому \(3x=180°\).','Отсюда \(x=60°\), значит каждый угол равен 60°.'],hint:'Начните с равенства сторон, затем перейдите к равенству углов и примените сумму углов треугольника.',explain:'Равные стороны дают равные противолежащие углы. Три равных угла в сумме составляют 180°, поэтому каждый равен 60°.'}
];

/* =========================================================

const state={section:'contents',indexBySection:{},answers:{},attempts:{},history:{},done:{},wrongEver:{}};
sections.forEach(s=>state.indexBySection[s.id]=0);
const tabs=[{id:'contents',title:'Содержание'},...sections.map(s=>({id:s.id,title:s.short})),{id:'teacher',title:'Для учителя'}];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffledOrder(n){let a=shuffle([...Array(n).keys()]);if(n>1&&a.every((v,i)=>v===i))[a[0],a[1]]=[a[1],a[0]];return a}
const optionOrders={};
tasks.forEach(t=>{if(t.options){optionOrders[t.id]=t.options.map((_,i)=>i);if(settings.shuffleChoiceOptions)shuffle(optionOrders[t.id])}if(t.bank){optionOrders['b'+t.id]=shuffle([...t.bank])}if(t.type==='order'){optionOrders['o'+t.id]=shuffledOrder(t.steps.length)}});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){let s=String(v??'').toLowerCase().trim().replace(/,/g,'.').replace(/\s+/g,' ').replace(/[;.!?]+$/g,'').replace(/\s*(см|дм|мм|м|°|градус(а|ов)?|градусов?)\s*$/,'').trim();let n=Number(s);return Number.isFinite(n)?n:s}
function eq(a,b){let A=norm(a),B=norm(b);return typeof A==='number'&&typeof B==='number'?Math.abs(A-B)<1e-7:A===B}
function completedCount(){return Object.keys(state.done).length}
function total(){return tasks.length}
function sectionTasks(id){return tasks.filter(t=>t.section===id)}
function saveCurrentAnswer(){if(!sections.some(s=>s.id===state.section))return;let list=sectionTasks(state.section),t=list[state.indexBySection[state.section]||0],root=t?document.querySelector(`[data-task=\"${t.id}\"]`):null;if(t&&root)state.answers[t.id]=readAnswer(t,root)}
function navigate(id){saveCurrentAnswer();state.section=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function setupTabs(){const tabsEl=document.getElementById('tabs'), sel=document.getElementById('mobileSelect');tabsEl.innerHTML=tabs.map(t=>`<button class="btn tab ${state.section===t.id?'active':''}" data-nav="${t.id}">${t.title}</button>`).join('');sel.innerHTML=tabs.map(t=>`<option value="${t.id}" ${state.section===t.id?'selected':''}>${t.title}</option>`).join('');tabsEl.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));sel.onchange=()=>navigate(sel.value)}
function theoryBox(section){let s=sections.find(x=>x.id===section);return `<aside class="theory" id="theory-${section}"><h3>Теория</h3>${s.theory}</aside>`}
function taskAnswerHTML(t){const saved=state.answers[t.id];if(t.type==='single'||t.type==='multi'){let typ=t.type==='single'?'radio':'checkbox';return `<div class="answer-zone">${optionOrders[t.id].map(i=>`<label class="option"><input type="${typ}" name="q${t.id}" value="${i}" ${(Array.isArray(saved)?saved.includes(i):saved===i)?'checked':''}> <span>${t.options[i]}</span></label>`).join('')}</div>`}
if(t.type==='short')return `<input class="short" id="short-${t.id}" value="${esc(saved??'')}" placeholder="Введите ответ">`;
if(t.type==='shortmulti')return `<div class="answer-zone">${t.fields.map((f,i)=>`<label>${f.label} <input class="short multi-field" data-i="${i}" value="${esc(saved?.[i]??'')}" placeholder="ответ"></label>`).join('')}</div>`;
if(t.type==='fill'){let vals=saved||Array(t.answers.length).fill('');return `<div class="drop-row">${t.answers.map((_,i)=>`<div><div class="small">Пропуск ${i+1}</div><div class="drop" data-drop="${i}" tabindex="0">${vals[i]?`<span class="drag-item" draggable="true">${esc(vals[i])}</span>`:''}</div></div>`).join('')}</div><div class="small" style="margin-top:8px">Банк:</div><div class="drag-bank" id="bank-${t.id}">${optionOrders['b'+t.id].filter(x=>!vals.includes(x)).map(x=>`<span class="drag-item" draggable="true" tabindex="0">${esc(x)}</span>`).join('')}</div>`}
if(t.type==='order'){let order=(saved&&saved.length===t.steps.length?saved:optionOrders['o'+t.id]);return `<div class="small" style="margin-bottom:8px">Перетащите шаги или используйте кнопки ↑ / ↓.</div><div class="order-list" id="order-${t.id}">${order.map(i=>`<div class="order-step" draggable="true" tabindex="0" data-step="${i}"><span class="order-handle">↕</span><span>${t.steps[i]}</span><span class="order-controls"><button type="button" class="btn order-up" aria-label="Поднять шаг">↑</button><button type="button" class="btn order-down" aria-label="Опустить шаг">↓</button></span></div>`).join('')}</div>`}
return ''}
function scratch(id){return `<details class="scratch-wrap"><summary>Черновик</summary><div class="scratch-toolbar"><button class="btn" data-tool="pen">Ручка</button><button class="btn" data-tool="eraser">Ластик</button><button class="btn" data-clear>Очистить</button></div><canvas class="scratch" data-canvas="${id}" aria-label="Черновик для рисования"></canvas></details>`}
function taskCard(t,idx,list){let hist=(state.history[t.id]||[]).join(' → ');return `<article class="card task-card" data-task="${t.id}"><div class="task-shell"><div><div class="task-title"><h2>Задание ${idx+1}</h2><span class="meta">${t.difficulty}</span></div><div class="small">Навык: ${t.skill}</div><div class="question">${t.text}</div>${taskAnswerHTML(t)}<div class="actions"><button class="btn primary check" data-id="${t.id}">Проверить</button><button class="btn theory-toggle screen-only" data-sec="${t.section}">Теория</button></div><div class="feedback" id="fb-${t.id}">${hist?`История попыток: ${hist}`:''}</div>${scratch(t.id)}<div class="print-solution-space print-only"></div><div class="teacher-answer print-only"><b>Ответ:</b> ${answerText(t)}<br><b>Пояснение:</b> ${t.explain}</div></div>${theoryBox(t.section)}</div><div class="navrow"><button class="btn prevTask">← Назад</button><div class="counter">Задание ${idx+1} из ${list.length}</div><button class="btn nextTask">Далее →</button></div></article>`}
function answerText(t){if(t.type==='single')return t.options[t.correct];if(t.type==='multi')return t.correct.map(i=>t.options[i]).join('; ');if(t.type==='short')return Array.isArray(t.answer)?String(t.answer[0]):String(t.answer);if(t.type==='shortmulti')return t.fields.map(f=>`${f.label} ${String(f.answer).replace('.',',')}`).join('; ');if(t.type==='fill')return t.answers.join('; ');if(t.type==='order')return t.steps.map((x,i)=>`${i+1}) ${x}`).join(' ');return ''}
function renderContents(){return `<section class="panel active" id="contents"><div class="card hero"><h1>Равнобедренный и равносторонний треугольники</h1><p>7 класс · рабочий лист с повторением главы «Прямоугольный треугольник».</p><div class="progressline"><b>Выполнено ${completedCount()} из ${total()}</b><span>Проверка ответа — только по кнопке «Проверить».</span></div></div><div class="subgrid">${sections.map((s,i)=>`<a href="#" class="toclink" data-goto="${s.id}"><b>${i+1}. ${s.title}</b><br><span class="small">${sectionTasks(s.id).length} заданий</span></a>`).join('')}</div></section>`}
function renderSection(id){let list=sectionTasks(id),idx=Math.min(state.indexBySection[id]||0,list.length-1),t=list[idx];return `<section class="panel active"><div class="progressline"><b>${sections.find(s=>s.id===id).title}</b><span>Выполнено ${completedCount()} из ${total()}</span></div>${taskCard(t,idx,list)}</section>`}
function mastery(p){return p>=85?'высокий':p>=70?'достаточный':p>=50?'базовый':'требует повторения'}
function renderTeacher(){let rows=sections.map(s=>{let ts=sectionTasks(s.id),ok=ts.filter(t=>state.done[t.id]).length,p=Math.round(ok/ts.length*100);return `<tr><td>${s.title}</td><td>${ok}/${ts.length}</td><td>${p}%</td><td>${mastery(p)}</td></tr>`}).join('');let p=Math.round(completedCount()/total()*100);let errors=tasks.filter(t=>state.wrongEver[t.id]);let strengths=sections.filter(s=>sectionTasks(s.id).every(t=>state.done[t.id])).map(s=>s.short);let difficult=[...new Set(errors.map(t=>t.skill))];return `<section class="panel active report" id="teacher"><div class="card"><h1>Для учителя</h1><p><b>Общий результат:</b> ${completedCount()} из ${total()} — ${p}% · <span class="badge">${mastery(p)}</span></p><table><thead><tr><th>Подтема</th><th>Верно</th><th>Процент</th><th>Уровень</th></tr></thead><tbody>${rows}</tbody></table><h3>Сильные стороны</h3><p>${strengths.length?strengths.join(', '):'Пока недостаточно выполненных заданий для вывода.'}</p><h3>Зоны затруднений</h3><p>${difficult.length?difficult.join('; '):'Ошибок пока не зафиксировано.'}</p><h3>Анализ ошибок и история попыток</h3>${errors.length?errors.map(t=>`<p><b>№${t.id} · ${t.skill}</b><br>История: ${(state.history[t.id]||[]).join(' → ')}<br><span class="small">${t.explain}</span></p>`).join(''):'<p>Ошибок пока не зафиксировано.</p>'}<div class="actions"><button class="btn" id="printStudent">Печать ученического листа</button><button class="btn" id="printTeacher">Печать листа учителя</button><button class="btn" id="printReport">Печать подробного отчёта</button></div></div></section>`}
function render(){setupTabs();let main=document.getElementById('main');main.innerHTML=state.section==='contents'?renderContents():state.section==='teacher'?renderTeacher():renderSection(state.section);bind();if(window.MathJax?.typesetPromise)MathJax.typesetPromise([main]).catch(()=>{})}
function readAnswer(t,root){if(t.type==='single'){let x=root.querySelector(`input[name=q${t.id}]:checked`);return x?Number(x.value):null}if(t.type==='multi')return [...root.querySelectorAll(`input[name=q${t.id}]:checked`)].map(x=>Number(x.value)).sort();if(t.type==='short')return root.querySelector(`#short-${t.id}`).value;if(t.type==='shortmulti')return [...root.querySelectorAll('.multi-field')].map(x=>x.value);if(t.type==='fill')return [...root.querySelectorAll('.drop')].map(x=>x.textContent.trim());if(t.type==='order')return [...root.querySelectorAll('.order-step')].map(x=>Number(x.dataset.step));}
function isCorrect(t,v){if(t.type==='single')return v===t.correct;if(t.type==='multi')return JSON.stringify(v)===JSON.stringify([...t.correct].sort());if(t.type==='short')return (Array.isArray(t.answer)?t.answer:[t.answer]).some(a=>eq(v,a));if(t.type==='shortmulti')return t.fields.every((f,i)=>eq(v[i],f.answer));if(t.type==='fill')return t.answers.every((a,i)=>eq(v[i],a));if(t.type==='order')return JSON.stringify(v)===JSON.stringify(t.steps.map((_,i)=>i));return false}
function checkTask(id){let t=tasks.find(x=>x.id===id),root=document.querySelector(`[data-task="${id}"]`),v=readAnswer(t,root);state.answers[id]=v;state.attempts[id]=(state.attempts[id]||0)+1;let good=isCorrect(t,v);state.history[id]=state.history[id]||[];state.history[id].push(good?'✅':'❌');if(good)state.done[id]=true;else state.wrongEver[id]=true;let fb=root.querySelector(`#fb-${id}`);if(good){fb.className='feedback good';fb.innerHTML=`✅ Верно! ${t.explain}<br><span class="small">История: ${state.history[id].join(' → ')}</span>`}else{fb.className='feedback bad';if(state.attempts[id]>=settings.attempts){fb.innerHTML=`Ответ пока неверный. Правильный ответ: <b>${answerText(t)}</b><br>${t.explain}<br><span class="small">История: ${state.history[id].join(' → ')}</span>`}else{fb.innerHTML=`Ответ пока неверный. Подсказка: ${t.hint}<br><span class="small">История: ${state.history[id].join(' → ')}</span>`}}if(window.MathJax?.typesetPromise)MathJax.typesetPromise([fb]).catch(()=>{})}
function moveTask(delta){saveCurrentAnswer();let id=state.section,list=sectionTasks(id),idx=state.indexBySection[id]+delta;if(idx<0){let si=sections.findIndex(s=>s.id===id);if(si===0)return navigate('contents');let prev=sections[si-1];state.indexBySection[prev.id]=sectionTasks(prev.id).length-1;return navigate(prev.id)}if(idx>=list.length){let si=sections.findIndex(s=>s.id===id);if(si===sections.length-1)return navigate('teacher');state.indexBySection[sections[si+1].id]=0;return navigate(sections[si+1].id)}state.indexBySection[id]=idx;render();window.scrollTo({top:0,behavior:'smooth'})}
function bindDrag(t,root){let dragging=null;root.querySelectorAll('.drag-item').forEach(el=>{el.ondragstart=()=>dragging=el.textContent.trim();el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){dragging=el.textContent.trim();e.preventDefault()}}});root.querySelectorAll('.drop').forEach(d=>{d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(!dragging)return;let old=[...root.querySelectorAll('.drop')].find(x=>x.textContent.trim()===dragging);if(old)old.innerHTML='';d.innerHTML=`<span class="drag-item" draggable="true">${esc(dragging)}</span>`;renderFillBank(t,root);bindDrag(t,root)};d.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&dragging){d.innerHTML=`<span class="drag-item" draggable="true">${esc(dragging)}</span>`;renderFillBank(t,root);bindDrag(t,root);e.preventDefault()}}})}
function renderFillBank(t,root){let used=[...root.querySelectorAll('.drop')].map(x=>x.textContent.trim()).filter(Boolean);root.querySelector(`#bank-${t.id}`).innerHTML=optionOrders['b'+t.id].filter(x=>!used.includes(x)).map(x=>`<span class="drag-item" draggable="true" tabindex="0">${esc(x)}</span>`).join('')}
function bindOrder(t,root){let list=root.querySelector(`#order-${t.id}`),dragged=null;if(!list)return;function save(){state.answers[t.id]=[...list.querySelectorAll('.order-step')].map(x=>Number(x.dataset.step));if(window.MathJax?.typesetPromise)MathJax.typesetPromise([list]).catch(()=>{})}function move(el,dir){let sib=dir<0?el.previousElementSibling:el.nextElementSibling;if(!sib)return;if(dir<0)list.insertBefore(el,sib);else list.insertBefore(sib,el);save()}list.querySelectorAll('.order-step').forEach(el=>{el.ondragstart=()=>{dragged=el;el.classList.add('dragging')};el.ondragend=()=>{el.classList.remove('dragging');dragged=null;save()};el.ondragover=e=>{e.preventDefault();if(!dragged||dragged===el)return;let r=el.getBoundingClientRect(),before=e.clientY<r.top+r.height/2;list.insertBefore(dragged,before?el:el.nextSibling)};el.querySelector('.order-up').onclick=()=>move(el,-1);el.querySelector('.order-down').onclick=()=>move(el,1);el.onkeydown=e=>{if(e.altKey&&e.key==='ArrowUp'){move(el,-1);e.preventDefault()}if(e.altKey&&e.key==='ArrowDown'){move(el,1);e.preventDefault()}}})}
function initCanvas(c){let ctx=c.getContext('2d'),drawing=false,tool='pen';function resize(){let r=c.getBoundingClientRect(),img=c.toDataURL();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineWidth=2}resize();let pos=e=>{let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]};let start=e=>{drawing=true;let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};let move=e=>{if(!drawing)return;let [x,y]=pos(e);ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.lineWidth=tool==='eraser'?14:2;ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};let end=()=>drawing=false;c.onpointerdown=start;c.onpointermove=move;c.onpointerup=end;c.onpointerleave=end;let wrap=c.closest('.scratch-wrap');wrap.querySelector('[data-tool=pen]').onclick=()=>tool='pen';wrap.querySelector('[data-tool=eraser]').onclick=()=>tool='eraser';wrap.querySelector('[data-clear]').onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
function bind(){document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{e.preventDefault();navigate(a.dataset.goto)});document.querySelectorAll('.check').forEach(b=>b.onclick=()=>checkTask(Number(b.dataset.id)));document.querySelectorAll('.prevTask').forEach(b=>b.onclick=()=>moveTask(-1));document.querySelectorAll('.nextTask').forEach(b=>b.onclick=()=>moveTask(1));document.querySelectorAll('.theory-toggle').forEach(b=>b.onclick=()=>document.querySelector(`#theory-${b.dataset.sec}`).classList.toggle('mobile-open'));document.querySelectorAll('.scratch').forEach(initCanvas);let t=tasks.find(x=>state.section!== 'contents'&&x.id===sectionTasks(state.section)[state.indexBySection[state.section]]?.id);if(t?.type==='fill')bindDrag(t,document.querySelector(`[data-task="${t.id}"]`));if(t?.type==='order')bindOrder(t,document.querySelector(`[data-task="${t.id}"]`));if(document.getElementById('printStudent'))document.getElementById('printStudent').onclick=()=>printMode('student');if(document.getElementById('printTeacher'))document.getElementById('printTeacher').onclick=()=>printMode('teacher');if(document.getElementById('printReport'))document.getElementById('printReport').onclick=()=>window.print()}
function printMode(mode){let old=state.section;document.body.classList.remove('teacher-mode-print','student-mode-print');document.body.classList.add(mode+'-mode-print');let main=document.getElementById('main');main.innerHTML=sections.map(s=>`<section class="panel active"><h1>${s.title}</h1>${sectionTasks(s.id).map((t,i)=>taskCard(t,i,sectionTasks(s.id))).join('')}</section>`).join('')+`<section class="student-ref print-only"><h1>Справочный материал</h1><p><b>Прямоугольный треугольник:</b> сумма острых углов 90°; катет напротив угла 30° равен половине гипотенузы.</p><p><b>Равнобедренный:</b> углы при основании равны; медиана к основанию является высотой и биссектрисой.</p><p><b>Равносторонний:</b> все стороны равны, каждый угол 60°, \(P=3a\).</p></section>`;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([main]).then(()=>{window.print();state.section=old;render()});else{window.print();state.section=old;render()}}
document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsPop').classList.toggle('hidden');document.getElementById('fontSel').onchange=e=>document.documentElement.style.setProperty('--font',`'${e.target.value}',sans-serif`);document.getElementById('sizeSel').onchange=e=>document.documentElement.style.setProperty('--fs',e.target.value+'px');document.getElementById('scaleSel').onchange=e=>document.documentElement.style.setProperty('--scale',Number(e.target.value)/100);document.getElementById('fullscreenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.getElementById('resetBtn').onclick=()=>{if(confirm('Сбросить все результаты текущей сессии?')){state.answers={};state.attempts={};state.history={};state.done={};state.wrongEver={};sections.forEach(s=>state.indexBySection[s.id]=0);state.section='contents';render()}};
render();
</script>
</body>
