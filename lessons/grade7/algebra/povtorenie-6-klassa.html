<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Повторение курса 6 класса — рациональные числа, дроби, проценты, пропорции</title>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f7f4ea;--surface:#fffdf7;--surface2:#f1f5e7;--text:#263125;--muted:#697468;--primary:#6c8a52;--soft:#e7eedc;--border:#cbd6bc;--danger:#b55d54;--success:#4e7f53}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#fff 68%);color:var(--text)}button,input{font:inherit}.topbar{position:sticky;top:0;z-index:10;background:#fffffff0;border-bottom:1px solid var(--border);padding:10px 14px}.tabs{display:flex;gap:8px;overflow:auto}.tab{min-width:190px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:11px 14px;font-weight:800;cursor:pointer}.tab.active{background:var(--soft);color:var(--primary);border-color:var(--primary)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;width:min(1500px,100%);padding:18px;margin:auto}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 24px #2d3c2314}.side-title{padding:14px 16px;font-weight:900;color:var(--primary);border-bottom:1px solid var(--border);background:linear-gradient(var(--surface),var(--soft))}.nav{padding:8px;display:grid;gap:5px}.nav button{border:0;border-radius:10px;background:transparent;padding:11px;text-align:left;font-weight:700;cursor:pointer}.nav button:hover{background:var(--soft)}.nav button.active{background:var(--primary);color:#fff}.info{padding:15px;line-height:1.5;color:var(--muted)}.workspace{padding:20px;min-height:650px}.workspace h1{margin:0;color:var(--primary);font-size:clamp(1.35rem,2vw,2rem)}.instruction{color:var(--muted);margin:6px 0 16px}.content{border-top:1px solid var(--border);padding-top:18px}.question{font-size:1.12rem;line-height:1.6;margin:12px 0 16px}.scheme{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.scheme>div,.box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:15px}.scheme strong{display:block;color:var(--primary);margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:var(--soft);border:1px solid var(--border);border-radius:999px;padding:7px 10px;font-weight:800}.algorithm{counter-reset:n;display:grid;gap:10px}.step{counter-increment:n;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}.step:before{content:counter(n);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:900}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}.choice{display:flex;gap:9px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2)}.answer{display:flex;gap:10px;align-items:center;margin:18px 0}.answer input{flex:1;min-width:180px;padding:11px 13px;border:2px solid var(--border);border-radius:11px;background:var(--surface);outline:none}.answer input:focus{border-color:var(--primary)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}.btn{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{margin-left:auto;background:var(--primary);color:#fff;border-color:var(--primary)}.btn.soft{background:var(--soft);color:var(--primary)}.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:800}.feedback.show{display:block}.feedback.ok{background:#edf7ee;color:var(--success)}.feedback.bad{background:#fff0ef;color:var(--danger)}.progress{height:7px;background:#e8ecdf;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--primary)}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{display:none}.workspace{padding:15px}.btn.primary{margin-left:0}}
</style>
</head>
<body>
<header class="topbar"><div class="tabs" id="tabs"></div></header>
<main class="layout">
<aside class="sidebar">
<section class="card"><div class="side-title">Задания</div><nav class="nav" id="nav"></nav></section>
<section class="card" style="margin-top:14px"><div class="side-title">Подсказка по теме</div><div class="info" id="info"></div></section>
<section class="card" style="margin-top:14px"><div class="side-title">Прогресс</div><div class="info"><p><strong id="progressText">0 из 0</strong> заданий выполнено</p><div class="progress"><div id="progressBar"></div></div></div></section>
</aside>
<section class="card workspace"><h1 id="title"></h1><p class="instruction" id="instruction"></p><div class="content" id="content"></div><div class="actions"><button class="btn" id="reset">↻ Сбросить</button><button class="btn soft" id="next">Следующая задача →</button><button class="btn primary" id="check">✓ Проверить</button></div><div class="feedback" id="feedback"></div></section>
</main>
<script>
const workbook=[
{id:'t1',title:'Рациональные числа',info:'Рациональные числа: определите знаки, выполните действие с модулями и поставьте знак результата. Прибыль считаем положительной величиной, долг и убыток — отрицательной.',tasks:[
{title:'1. Теория-схема',instruction:'Изучите схему и ответьте на вопрос.',type:'choice',prompt:`<div class="question"><strong>Действия с рациональными числами</strong></div><div class="scheme"><div><strong>1. Сравни знаки</strong><p>$+$ и $+$</p><p>$-$ и $-$</p><p>разные знаки</p></div><div><strong>2. Выбери действие</strong><p><b>Сложение:</b> одинаковые знаки → сложи модули.</p><p>Разные знаки → вычти меньший модуль из большего.</p></div><div><strong>3. Поставь знак</strong><p>При разных знаках результат получает знак числа с <b>большим модулем</b>.</p></div><div><strong>4. Умножение и деление</strong><div class="chips"><span class="chip">$+\\cdot+=+$</span><span class="chip">$-\\cdot-=+$</span><span class="chip">$+\\cdot-=-$</span><span class="chip">$-\\cdot+=-$</span></div><p>Для деления правило знаков такое же.</p></div></div><div class="box"><b>Вычитание:</b> замените вычитание сложением противоположного числа: $a-b=a+(-b)$.</div><div class="question">Какой знак будет у результата $-18+7$?</div>`,options:['Положительный','Отрицательный','Нулевой'],answer:1},
{title:'2. Прибыль и долг',instruction:'Введите итоговое изменение баланса.',type:'input',prompt:`<div class="question">У магазина утром был долг 850 руб., а к вечеру он получил прибыль 1200 руб. Считайте долг отрицательной величиной, а прибыль — положительной. Каков итоговый баланс?</div>`,answer:['350','350 руб','350 рублей']},
{title:'3. Найдите ошибку',instruction:'Выберите строку, где допущена ошибка.',type:'choice',prompt:`<div class="question">Ученик вычислял изменение баланса:</div><div class="box">1) долг 430 руб. → $-430$<br>2) прибыль 270 руб. → $+270$<br>3) $-430+270=-(430+270)=-700$</div>`,options:['1','2','3'],answer:2},
{title:'4. Два изменения подряд',instruction:'Введите итоговый баланс.',type:'input',prompt:`<div class="question">Баланс был равен $-250$ руб. Затем поступила прибыль 480 руб., после чего возник расход 190 руб. Чему стал равен баланс?</div>`,answer:['40','+40','40 руб','40 рублей']},
{title:'5. Умножение со знаком',instruction:'Введите результат.',type:'input',prompt:`<div class="question">Предприниматель четыре дня подряд получал убыток по 135 руб. в день. Запишите общее изменение баланса.</div>`,answer:['-540','−540']},
{title:'6. Сравните ситуации',instruction:'Выберите все верные утверждения.',type:'multi',prompt:`<div class="question">Отметьте верные утверждения.</div>`,options:['Прибыль 500 руб. и долг 500 руб. взаимно уничтожаются.','Долг 300 руб. и новый долг 200 руб. дают итог −100 руб.','Если к долгу 900 руб. прибавить прибыль 1200 руб., баланс станет положительным.','Произведение двух отрицательных чисел отрицательно.'],answer:[0,2]},
{title:'7. Цепочка операций',instruction:'Введите итоговое число.',type:'input',prompt:`<div class="question">Вычислите: $$-36:6+4\\cdot(-3)-(-5).$$</div>`,answer:['-13','−13']},
{title:'8. Итоговая задача',instruction:'Введите итоговый баланс.',type:'input',prompt:`<div class="question">В начале недели баланс проекта составлял $-1200$ руб. В понедельник получили прибыль 750 руб., во вторник — 980 руб., а в среду возник расход 640 руб. Каков баланс после среды?</div>`,answer:['-110','−110','-110 руб','−110 руб']}
]},
{id:'t2',title:'Дроби, проценты, пропорции',info:'Универсальный алгоритм: определите целое, выясните, что требуется найти, составьте математическую модель, выполните расчёты и проверьте ответ по смыслу.',tasks:[
{title:'1. Универсальный алгоритм',instruction:'Изучите алгоритм и выберите правильный первый шаг.',type:'choice',prompt:`<div class="question"><strong>Универсальный алгоритм решения</strong></div><div class="algorithm"><div class="step"><div><b>Определи целое:</b> общее количество, массу, первоначальную стоимость.</div></div><div class="step"><div><b>Выясни, что требуется найти:</b> значение доли, количество частей или итоговую цену.</div></div><div class="step"><div><b>Составь математическую модель:</b> пропорцию или действие умножения.</div></div><div class="step"><div><b>Выполни расчёты.</b></div></div><div class="step"><div><b>Проверь ответ по смыслу.</b> Если стоимость товара снижается из-за акции, итоговая цена должна быть меньше исходной.</div></div></div><div class="question">С чего нужно начать решение задачи на проценты?</div>`,options:['Сразу составить пропорцию','Определить целое','Сразу выполнить вычисления'],answer:1},
{title:'2. Доля от целого',instruction:'Введите ответ.',type:'input',prompt:`<div class="question">Для школьной ярмарки приготовили 84 пирожка. $\\frac{3}{7}$ всех пирожков были с яблоками. Сколько пирожков было с яблоками?</div>`,answer:['36']},
{title:'3. Найдите целое',instruction:'Введите ответ.',type:'input',prompt:`<div class="question">18 учеников составляют $\\frac{3}{5}$ всей группы. Сколько учеников в группе?</div>`,answer:['30']},
{title:'4. Скидка',instruction:'Введите новую цену.',type:'input',prompt:`<div class="question">Рюкзак стоил 2400 руб. Во время акции цену снизили на 15%. Сколько рублей стал стоить рюкзак?</div>`,answer:['2040','2040 руб','2040 рублей']},
{title:'5. Повышение цены',instruction:'Введите новую цену.',type:'input',prompt:`<div class="question">Цена билета была 800 руб. Затем она увеличилась на 12%. Какой стала цена?</div>`,answer:['896','896 руб','896 рублей']},
{title:'6. Пропорция',instruction:'Введите ответ.',type:'input',prompt:`<div class="question">Для 6 порций каши требуется 450 г крупы. Сколько граммов крупы потребуется для 10 таких порций?</div>`,answer:['750','750 г']},
{title:'7. Проверка по смыслу',instruction:'Выберите верное рассуждение.',type:'choice',prompt:`<div class="question">Товар стоил 1500 руб. После скидки 20% ученик получил ответ 1800 руб. Как лучше всего обнаружить ошибку?</div>`,options:['Ответ должен быть меньше 1500 руб., потому что цена снизилась.','Ответ должен быть больше 1500 руб., потому что 20% — положительное число.','Проверка по смыслу здесь не помогает.'],answer:0},
{title:'8. Две операции с процентами',instruction:'Введите итоговую цену.',type:'input',prompt:`<div class="question">Куртка стоила 5000 руб. Сначала цену снизили на 20%, а затем новую цену снизили ещё на 10%. Сколько стала стоить куртка?</div>`,answer:['3600','3600 руб','3600 рублей']},
{title:'9. Смешанная задача',instruction:'Введите ответ.',type:'input',prompt:`<div class="question">В школьной библиотеке 320 новых книг. $\\frac{3}{8}$ из них — художественные, а 25% художественных книг уже выдали ученикам. Сколько художественных книг осталось на полках?</div>`,answer:['90']}
]}];
let state={topic:0,task:0,completed:{}};const $=id=>document.getElementById(id);function norm(s){return String(s).trim().toLowerCase().replace(/\\s+/g,' ')}function renderTabs(){$('tabs').innerHTML=workbook.map((t,i)=>`<button class="tab ${i===state.topic?'active':''}" data-i="${i}">${i+1}. ${t.title}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.topic=+b.dataset.i;state.task=0;renderAll()})}function renderNav(){const t=workbook[state.topic];$('nav').innerHTML=t.tasks.map((x,i)=>`<button class="${i===state.task?'active':''}" data-i="${i}">${x.title}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.task=+b.dataset.i;renderTask();renderNav()})}function renderTask(){const topic=workbook[state.topic],t=topic.tasks[state.task];$('info').textContent=topic.info;$('title').textContent=t.title;$('instruction').textContent=t.instruction;$('feedback').className='feedback';let h=t.prompt;if(t.type==='input')h+=`<div class="answer"><b>Ответ:</b><input id="studentAnswer" autocomplete="off" placeholder="Введите ответ"></div>`;if(t.type==='choice'||t.type==='multi')h+=`<div class="choices">${t.options.map((o,i)=>`<label class="choice"><input type="${t.type==='choice'?'radio':'checkbox'}" name="choice" value="${i}"> <span>${o}</span></label>`).join('')}</div>`;$('content').innerHTML=h;$('next').disabled=state.task>=topic.tasks.length-1;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('content')]).catch(()=>{})}function check(){const topic=workbook[state.topic],t=topic.tasks[state.task];let ok=false;if(t.type==='input'){const v=norm($('studentAnswer')?.value||'');ok=t.answer.some(a=>norm(a)===v)}else{const vals=[...document.querySelectorAll('input[name="choice"]:checked')].map(x=>+x.value).sort((a,b)=>a-b);ok=t.type==='choice'?vals[0]===t.answer:JSON.stringify(vals)===JSON.stringify([...t.answer].sort((a,b)=>a-b))}const f=$('feedback');f.className='feedback show '+(ok?'ok':'bad');f.textContent=ok?'Верно ✓':'Неверно. Проверьте решение и попробуйте ещё раз.';if(ok){state.completed[topic.id+'_'+state.task]=true;progress()}}function progress(){let total=0,done=0;workbook.forEach(t=>t.tasks.forEach((_,i)=>{total++;if(state.completed[t.id+'_'+i])done++}));$('progressText').textContent=`${done} из ${total}`;$('progressBar').style.width=(total?done/total*100:0)+'%'}function renderAll(){renderTabs();renderNav();renderTask();progress()}$('check').onclick=check;$('reset').onclick=()=>{if($('studentAnswer'))$('studentAnswer').value='';document.querySelectorAll('input[name="choice"]').forEach(x=>x.checked=false);$('feedback').className='feedback'};$('next').onclick=()=>{if(state.task<workbook[state.topic].tasks.length-1){state.task++;renderNav();renderTask();window.scrollTo({top:0,behavior:'smooth'})}};renderAll();
</script>
</body>
</html>
