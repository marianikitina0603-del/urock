.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);box-shadow:0 3px 16px rgba(0,0,0,.04)}.topbar-row{display:flex;align-items:stretch;gap:8px;padding:10px 14px 0;overflow-x:auto}.topic-tab{min-width:170px;border:1px solid var(--border);border-bottom:3px solid transparent;border-radius:14px 14px 0 0;background:var(--surface);color:var(--text);padding:12px 16px;font-weight:800;text-align:center;transition:.2s}.topic-tab small{display:block;margin-top:5px;font-size:.78rem;font-weight:600;color:var(--muted)}.topic-tab:hover{background:var(--soft)}.topic-tab.active{color:var(--primary);border-color:var(--primary);background:var(--soft)}
.themebar{display:flex;justify-content:flex-end;gap:8px;padding:8px 14px 10px;border-top:1px solid color-mix(in srgb,var(--border) 55%, transparent)}.theme-label{align-self:center;font-size:.9rem;color:var(--muted)}.theme-btn{width:31px;height:31px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--border)}.theme-sage{background:linear-gradient(135deg,#d7cfae 0 50%,#78915c 50%)}.theme-blue{background:linear-gradient(135deg,#dce9f7 0 50%,#376fae 50%)}.theme-rose{background:linear-gradient(135deg,#f4e0df 0 50%,#a95f71 50%)}.theme-night{background:linear-gradient(135deg,#303845 0 50%,#d4aa55 50%)}
.export-actions{display:flex;gap:8px;margin-right:auto}.export-btn{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--text);font-weight:800}.export-btn:hover{background:var(--soft);color:var(--primary)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;padding:18px;width:min(1600px,100%);margin:0 auto;flex:1}.sidebar{display:flex;flex-direction:column;gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.sidebar-card{overflow:hidden}.sidebar-title{padding:14px 16px;font-weight:900;color:var(--primary);border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--soft))}.task-nav{padding:8px;display:flex;flex-direction:column;gap:5px}.task-btn{border:0;border-radius:10px;background:transparent;color:var(--text);padding:11px 12px;text-align:left;font-weight:700;display:flex;gap:10px;align-items:center}.task-btn:hover{background:var(--soft)}.task-btn.active{background:var(--primary);color:#fff}.task-btn.done::after{content:'✓';margin-left:auto}.task-num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 13%, white);color:var(--primary);font-size:.86rem}.task-btn.active .task-num{background:rgba(255,255,255,.18);color:#fff}.info{padding:15px 16px;line-height:1.52;font-size:.92rem}.info strong{color:var(--primary)}.info p{margin:.35rem 0}.progress-line{height:7px;border-radius:999px;background:color-mix(in srgb,var(--border) 50%, white);overflow:hidden;margin-top:10px}.progress-bar{height:100%;width:0;background:var(--primary);transition:.25s}
.workspace{padding:20px;min-height:720px}.task-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.task-header h1{margin:0;color:var(--primary);font-size:clamp(1.35rem,2vw,2rem)}.task-kicker{margin:5px 0 0;color:var(--muted)}.task-content{border-top:1px solid var(--border);padding-top:18px}.question{font-size:1.1rem;line-height:1.6;margin:12px 0 16px}.theory{background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}.theory h3{margin:0 0 8px;color:var(--primary)}.callout{border-left:5px solid var(--primary);background:var(--surface2);padding:12px 14px;margin:14px 0;border-radius:10px}.mistake{border-left-color:var(--danger)}.idea{border-left-color:#6686ad}.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.mini-card{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2)}.mini-card b{color:var(--primary)}
.diagram-wrap{display:flex;justify-content:center;align-items:center;margin:14px 0}.diagram{max-width:520px;width:100%;height:auto;border:1px solid var(--border);border-radius:14px;background:white;padding:8px}.source-figure{display:block;max-width:520px;width:100%;height:auto;margin:14px auto;border:1px solid var(--border);border-radius:14px;background:#fff;padding:6px}.source-note{margin:-2px 0 12px;color:var(--muted);font-size:.95rem;font-style:italic;text-align:center}.svg-label{font:700 16px Arial;fill:#263125}.svg-small{font:700 14px Arial;fill:#263125}.svg-line{stroke:#344436;stroke-width:3;fill:none}.svg-mark{stroke:#6c8a52;stroke-width:3;fill:none}.svg-help{stroke:#8c9b8b;stroke-width:2;stroke-dasharray:7 6;fill:none}

.mobile-task-select{display:none;margin-bottom:12px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}

{id:'start',code:'0',title:'Старт и карта повторения',info:`<p><strong>Цель:</strong> быстро восстановить опорные факты и научиться выбирать нужную теорему по рисунку.</p><p>Алгоритм: <b>дано → требуется → объекты → свойства → теорема → цепочка решения</b>.</p>`,tasks:[
{title:'1. Карта теорем',instruction:'Сопоставьте ситуацию с главным фактом.',type:'multi',prompt:`<div class="theory"><h3>Мини-шпаргалка</h3><div class="mini-grid"><div class="mini-card"><b>Треугольник</b><br>сумма углов $180^\\circ$; признаки равенства; свойства равнобедренного и прямоугольного.</div><div class="mini-card"><b>Параллелограмм</b><br>противоположные стороны и углы равны; диагонали делятся пополам.</div><div class="mini-card"><b>Прямоугольник</b><br>параллелограмм + все углы прямые; диагонали равны.</div><div class="mini-card"><b>Ромб</b><br>параллелограмм + все стороны равны; диагонали перпендикулярны и делят углы пополам.</div><div class="mini-card"><b>Трапеция</b><br>одна пара противоположных сторон параллельна; средняя линия равна полусумме оснований.</div></div></div><div class="question">Выберите все верные утверждения.</div>`,options:['В параллелограмме диагонали делятся точкой пересечения пополам.','В любом прямоугольнике диагонали перпендикулярны.','В ромбе диагонали взаимно перпендикулярны.','Сумма углов любого треугольника равна $180^\\circ$.','В любой трапеции диагонали равны.'],answer:[0,2,3],hints:['Отделите свойства параллелограмма от дополнительных свойств его частных видов.','У прямоугольника ключевое дополнительное свойство диагоналей — равенство, а не перпендикулярность.','Верны пункты про параллелограмм, ромб и сумму углов треугольника.']},
{title:'2. Что дано на рисунке?',instruction:'Прочитайте чертёж до вычислений.',type:'choice',prompt:svgIso+`<div class="question">На рисунке $AB=BC$, а $BD$ проведён к основанию $AC$. Какого факта <b>недостаточно</b>, чтобы сразу утверждать, что $BD$ одновременно медиана, высота и биссектриса?</div>`,options:['Нужно знать, что $D$ — середина $AC$.','Нужно знать, что $BD$ — одна из трёх линий: медиана, высота или биссектриса, проведённая к основанию.','Достаточно только равенства $AB=BC$.'],answer:2,hints:['Свойство «три линии совпадают» формулируется для линии, уже проведённой к основанию с одним из специальных условий.','Одного факта $AB=BC$ недостаточно, чтобы произвольный отрезок $BD$ стал специальной линией.','Выберите вариант «достаточно только равенства…» как неверное основание.']}
]},
{id:'tri',code:'7–9',title:'Треугольники',info:`<p><strong>Как распознать:</strong> отмечайте равные стороны/углы, прямой угол, середины сторон, параллельные линии.</p><p><strong>Частая ошибка:</strong> применять признак равенства по трём углам — такого признака нет.</p>`,tasks:[
{title:'3. Сумма углов',instruction:'Разогрев: используйте один факт.',type:'input',prompt:svgTriangle+`<div class="question">Найдите $\\angle B$.</div>`,answer:['65','65°'],hints:['Сложите два известных угла.','Используйте $\\angle A+\\angle B+\\angle C=180^\\circ$.','Получается $180^\\circ-50^\\circ-65^\\circ$.']},
{title:'4. Какой признак?',instruction:'Выберите теорему, которая действительно связывает отмеченные данные.',type:'choice',prompt:img_sas+`<div class="source-note">Фрагмент из тетради-тренажёра: на рисунке отмечены две равные стороны и угол между ними.</div><div class="question">В двух треугольниках отмечены две соответственно равные стороны и угол <b>между ними</b>. Какой признак нужно применить?</div>`,options:['По двум сторонам и углу между ними.','По стороне и двум прилежащим к ней углам.','По трём сторонам.','По трём углам.'],answer:0,hints:['Посмотрите, где расположен отмеченный угол относительно двух отмеченных сторон.','Угол заключён между двумя известными сторонами.','Это первый признак равенства треугольников.']},
{title:'5. Равнобедренный: цепочка',instruction:'Не вычисляйте лишнее: найдите ключевое свойство.',type:'input',prompt:`<div class="question">В равнобедренном $\\triangle ABC$ с основанием $AC$ угол при вершине $B$ равен $44^\\circ$. Найдите $\\angle A$.</div><div class="callout idea"><b>Как заметить решение:</b> слово «равнобедренный» + указано основание → сначала определите, какие углы равны.</div>`,answer:['68','68°'],hints:['Углы при основании равны.','Пусть $\\angle A=\\angle C=x$. Тогда $2x+44^\\circ=180^\\circ$.','$x=68^\\circ$.']},
{title:'6. Прямоугольный треугольник',instruction:'Свяжите рисунок и теорему Пифагора.',type:'input',prompt:svgRight+`<div class="question">В прямоугольном треугольнике гипотенуза равна $10$, один катет равен $6$. Найдите второй катет.</div>`,answer:['8'],hints:['Гипотенуза — сторона напротив прямого угла.','По теореме Пифагора: $x^2+6^2=10^2$.','$x^2=64$.']},
{title:'7. Неравенство треугольника',instruction:'Проверьте существование, а не стройте рисунок.',type:'choice',prompt:`<div class="question">Какой набор длин может быть сторонами треугольника?</div>`,options:['$3,4,8$','$5,7,11$','$2,3,5$','$1,2,4$'],answer:1,hints:['Сумма любых двух сторон должна быть больше третьей.','Особенно проверьте сумму двух меньших сторон.','$5+7>11$, а в остальных наборах условие нарушается или получается равенство.']},
{title:'8. Доказательство по рисунку',instruction:'Восстановите главную идею доказательства.',type:'choice',prompt:svgIsoMed+`<div class="question">В равнобедренном $\\triangle ABC$ ($AB=BC$) медиана $BD$ проведена к основанию $AC$. Что лучше всего доказывает, что $BD\\perp AC$?</div>`,options:['Треугольники $ABD$ и $CBD$ равны по трём сторонам, поэтому $\\angle ADB=\\angle BDC$; они смежные, значит оба по $90^\\circ$.','Сразу из $AB=BC$ следует $BD\\perp AC$.','Поскольку медиана всегда перпендикулярна стороне.'],answer:0,hints:['Медиана даёт $AD=DC$, а $BD$ — общая сторона.','Получаются три пары равных сторон.','После равенства треугольников два смежных угла при $D$ равны.']},
{title:'9. Подобие: что искать?',instruction:'Выберите минимальный набор данных.',type:'choice',prompt:`<div class="question">Для доказательства подобия двух треугольников по первому признаку достаточно установить…</div>`,options:['равенство двух пар соответствующих углов','пропорциональность двух пар сторон','равенство одной пары сторон','равенство трёх углов и трёх сторон'],answer:0,hints:['Первый признак подобия — угловой.','Два угла одного треугольника равны двум углам другого.','Третья пара углов тогда равна автоматически.']}
]},
{id:'quad',code:'8–9',title:'Четырёхугольники',info:`<p><strong>Сначала классифицируйте:</strong> параллелограмм? его частный вид? трапеция?</p><p><strong>Полезная идея:</strong> диагональ часто разбивает четырёхугольник на два треугольника — это мост к признакам равенства и теореме Пифагора.</p>`,tasks:[
{title:'10. Параллелограмм: диагонали',instruction:'Считайте отметки как часть условия.',type:'input',prompt:img_para+`<div class="source-note">Фрагмент справочной таблицы: отметки на диагоналях являются частью условия.</div><div class="question">В параллелограмме $ABCD$ диагонали пересекаются в точке $O$. Если $AC=18$, найдите $AO$.</div>`,answer:['9'],hints:['Что делают диагонали параллелограмма в точке пересечения?','Они делятся пополам.','$AO=\\frac{AC}{2}$.']},
{title:'11. Прямоугольник: распознать свойство',instruction:'Не переносите свойство ромба на прямоугольник.',type:'choice',prompt:img_rect+`<div class="source-note">На рисунке показано ключевое свойство диагоналей прямоугольника.</div><div class="question">Какое утверждение обязательно верно для прямоугольника?</div>`,options:['Диагонали равны.','Диагонали перпендикулярны.','Диагонали делят углы пополам.','Все стороны равны.'],answer:0,hints:['Прямоугольник — параллелограмм с прямыми углами.','Его особое свойство диагоналей — равенство.','Перпендикулярность диагоналей — свойство ромба.']},
{title:'12. Ромб: найти идею',instruction:'Выберите свойство, а затем вычисляйте.',type:'choice',prompt:img_rhomb+`<div class="source-note">На рисунке сохранены отметки углов и прямого угла.</div><div class="question">Какое свойство диагоналей ромба изображено значком прямого угла в точке пересечения?</div>`,options:['Диагонали равны.','Диагонали перпендикулярны.','Диагонали не делятся пополам.','Только одна диагональ делит угол пополам.'],answer:1,hints:['Значок квадратика означает $90^\\circ$.','Следовательно, линии образуют прямой угол.','Диагонали ромба перпендикулярны.']},
{title:'13. Трапеция: средняя линия',instruction:'Прямое применение формулы.',type:'input',prompt:img_trap+`<div class="source-note">Точки $M$ и $N$ — середины боковых сторон.</div><div class="question">$AD=12$, $BC=6$, $MN$ — средняя линия трапеции. Найдите $MN$.</div>`,answer:['9'],hints:['Средняя линия трапеции равна полусумме оснований.','$MN=\\frac{AB+CD}{2}$.','$MN=(12+6)/2$.']},
{title:'14. Признак параллелограмма',instruction:'Отличайте свойства от признаков.',type:'multi',prompt:`<div class="question">Какие условия по отдельности гарантируют, что четырёхугольник — параллелограмм?</div>`,options:['Обе пары противоположных сторон попарно равны.','Диагонали пересекаются.','Диагонали точкой пересечения делятся пополам.','Одна пара противоположных сторон равна и параллельна.','Одна пара противоположных углов равна.'],answer:[0,2,3],hints:['Признак должен быть достаточным условием.','Сам факт пересечения диагоналей есть почти у любого выпуклого четырёхугольника.','Стандартные признаки: противоположные стороны равны; диагонали делятся пополам; одна пара противоположных сторон равна и параллельна.']},
{title:'15. Комбинированная задача',instruction:'Сначала распознайте фигуру, затем перейдите к треугольнику.',type:'input',prompt:`<div class="question">В прямоугольнике $ABCD$ стороны $AB=6$ и $BC=8$. Найдите диагональ $AC$.</div><div class="callout idea"><b>Как заметить решение:</b> диагональ прямоугольника образует прямоугольный треугольник со сторонами прямоугольника.</div>`,answer:['10'],hints:['Рассмотрите $\\triangle ABC$.','Он прямоугольный: $AB\\perp BC$.','$AC=\\sqrt{6^2+8^2}=10$.']}
]},
{id:'final',code:'60 мин',title:'Самостоятельная и итог',info:`<p><strong>Самопроверка:</strong> при ошибке не угадывайте ответ — назовите теорему, которая должна сработать.</p><p><strong>Критерий:</strong> 3–4 верных ответа без подсказок — материал восстановлен уверенно.</p>`,tasks:[
{title:'16. Самостоятельная 1',instruction:'Без подсказки до первой попытки.',type:'input',prompt:`<div class="question">В треугольнике два угла равны $38^\\circ$ и $72^\\circ$. Найдите третий угол.</div>`,answer:['70','70°'],hints:['Вспомните сумму углов треугольника.','$180-38-72$.','Ответ $70^\\circ$.']},
{title:'17. Самостоятельная 2',instruction:'Определите фигуру по свойству.',type:'choice',prompt:`<div class="question">Параллелограмм, у которого диагонали равны, обязательно является…</div>`,options:['ромбом','прямоугольником','трапецией','равнобедренной трапецией'],answer:1,hints:['Ищем частный вид параллелограмма.','Равные диагонали — признак прямоугольника среди параллелограммов.','Ответ: прямоугольник.']},
{title:'18. Самостоятельная 3',instruction:'Комбинация свойств.',type:'input',prompt:`<div class="question">В ромбе диагонали равны $10$ и $24$. Найдите сторону ромба.</div>`,answer:['13'],hints:['Диагонали ромба перпендикулярны и делятся пополам.','Половины диагоналей: $5$ и $12$. Они — катеты прямоугольного треугольника, гипотенуза которого — сторона ромба.','$a=\\sqrt{5^2+12^2}=13$.']},
{title:'19. Рефлексия: выбери цепочку',instruction:'Проверьте не ответ, а способ мышления.',type:'choice',prompt:`<div class="question">Какой порядок действий наиболее надёжен в задаче по планиметрии?</div>`,options:['Сразу подставить числа в знакомую формулу.','Дано → что найти/доказать → объекты на рисунке → известные свойства → подходящая теорема → цепочка решения.','Сначала построить как можно больше вспомогательных линий.','Подобрать ответ по рисунку.'],answer:1,hints:['Задача повторения — научиться декодировать условие.','Сначала структура, затем вычисления.','Выберите полный алгоритм от «дано» к цепочке решения.']}
]}
];
let topicIndex=0, taskIndex=0; const state={done:new Set(),attempts:{}};
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function allTasks(){return workbook.flatMap((t,ti)=>t.tasks.map((x,qi)=>({t,ti,x,qi,key:`${ti}-${qi}`})))}
function renderTabs(){const c=$('#topicTabs');c.innerHTML='';workbook.forEach((t,i)=>{const b=document.createElement('button');b.className='topic-tab'+(i===topicIndex?' active':'');b.innerHTML=`${t.title}<small>${t.code}</small>`;b.onclick=()=>{topicIndex=i;taskIndex=0;renderAll()};c.appendChild(b)})}
function renderNav(){const nav=$('#taskNav'),sel=$('#mobileTaskSelect');nav.innerHTML='';sel.innerHTML='';workbook[topicIndex].tasks.forEach((task,i)=>{const key=`${topicIndex}-${i}`;const b=document.createElement('button');b.className='task-btn'+(i===taskIndex?' active':'')+(state.done.has(key)?' done':'');b.innerHTML=`<span class="task-num">${i+1}</span><span>${task.title.replace(/^\d+\.\s*/,'')}</span>`;b.onclick=()=>{taskIndex=i;renderTask();renderNav()};nav.appendChild(b);const o=document.createElement('option');o.value=i;o.textContent=task.title;sel.appendChild(o)});sel.value=taskIndex;sel.onchange=e=>{taskIndex=+e.target.value;renderTask();renderNav()}}
function makeAnswer(task,key){if(task.type==='input')return `<div class="answer-row"><label>Ответ:</label><input class="answer-input" id="answerInput" placeholder="Введите число или выражение" autocomplete="off"></div>`;const type=task.type==='multi'?'checkbox':'radio';return `<div class="choice-grid">${task.options.map((o,i)=>`<label class="choice"><input type="${type}" name="ans" value="${i}"><span>${o}</span></label>`).join('')}</div>`}
function renderTask(){const t=workbook[topicIndex],task=t.tasks[taskIndex],key=`${topicIndex}-${taskIndex}`;$('#taskTitle').textContent=task.title;$('#taskInstruction').textContent=task.instruction;$('#topicInfo').innerHTML=t.info;$('#taskContent').innerHTML=task.prompt+makeAnswer(task,key);$('#feedback').className='feedback';$('#feedback').textContent='';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('#taskContent')]);updateProgress()}
function norm(v){return String(v).trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/º/g,'°')}
function check(){const task=workbook[topicIndex].tasks[taskIndex],key=`${topicIndex}-${taskIndex}`;let ok=false;if(task.type==='input'){const v=$('#answerInput').value;ok=task.answer.some(a=>norm(a)===norm(v))}else if(task.type==='choice'){const s=document.querySelector('input[name=ans]:checked');ok=!!s&&+s.value===task.answer}else{const chosen=$$('input[name=ans]:checked').map(x=>+x.value).sort((a,b)=>a-b);const exp=[...task.answer].sort((a,b)=>a-b);ok=chosen.length===exp.length&&chosen.every((x,i)=>x===exp[i])}
const fb=$('#feedback'); if(ok){state.done.add(key);fb.className='feedback show ok';fb.innerHTML='✓ Верно. Зафиксируйте: сначала распознали свойство/теорему, затем применили её.'}else{state.attempts[key]=(state.attempts[key]||0)+1;const n=state.attempts[key],hint=task.hints?.[Math.min(n-1,2)]||'Проверьте условие и рисунок ещё раз.';fb.className='feedback show bad';fb.innerHTML=`Пока нет. ${n===1?'Подсказка:':n===2?'Более конкретно:':'Идея решения:'} ${hint}`}renderNav();updateProgress()}
function updateProgress(){const total=allTasks().length,done=state.done.size;$('#progressText').textContent=`${done} из ${total}`;$('#progressBar').style.width=`${total?done/total*100:0}%`}
function renderAll(){renderTabs();renderNav();renderTask()}
$('#checkBtn').onclick=check;$('#nextBtn').onclick=()=>{if(taskIndex<workbook[topicIndex].tasks.length-1)taskIndex++;else if(topicIndex<workbook.length-1){topicIndex++;taskIndex=0}else{topicIndex=0;taskIndex=0}renderAll()};$('#resetBtn').onclick=()=>{state.done.clear();state.attempts={};renderAll()};
function buildPrint(){const el=$('#printSheet');el.innerHTML=`<h1 class="print-title">Повторение планиметрии 7–9 классов</h1><div class="print-sub">Треугольники и четырёхугольники · рабочий лист</div>`+allTasks().map((r,i)=>`<section class="print-task"><h3>${i+1}. ${r.x.title.replace(/^\d+\.\s*/,'')}</h3><div>${r.x.prompt}</div>${r.x.type!=='input'?`<div>${r.x.options.map((o,j)=>`${String.fromCharCode(1072+j)}) ${o}`).join(' &nbsp;&nbsp; ')}</div>`:''}<div class="solution-grid"></div></section>`).join('');if(window.MathJax?.typesetPromise)return MathJax.typesetPromise([el]);return Promise.resolve()}
$('#printBtn').onclick=async()=>{await buildPrint();window.print()};$('#pdfBtn').onclick=async()=>{await buildPrint();const el=$('#printSheet');el.style.display='block';el.style.position='fixed';el.style.left='-12000px';el.style.top='0';el.style.width='190mm';el.style.background='#fff';el.style.padding='10mm';const opt={margin:0,filename:'Повторение_планиметрии_7-9.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}};try{await html2pdf().set(opt).from(el).save()}finally{el.removeAttribute('style')}};
const themes={sage:{'--bg':'#f7f4ea','--surface':'#fffdf7','--surface2':'#f1f5e7','--text':'#263125','--muted':'#697468','--primary':'#6c8a52','--soft':'#e7eedc','--border':'#cbd6bc'},blue:{'--bg':'#f2f7fc','--surface':'#fff','--surface2':'#edf5ff','--text':'#203246','--muted':'#657586','--primary':'#376fae','--soft':'#e1edf9','--border':'#bfd1e5'},rose:{'--bg':'#fbf4f5','--surface':'#fff','--surface2':'#faeef1','--text':'#442c34','--muted':'#79656b','--primary':'#a95f71','--soft':'#f4e0df','--border':'#e2c1c9'},night:{'--bg':'#232a33','--surface':'#303845','--surface2':'#394452','--text':'#f3f1ea','--muted':'#c1c5c9','--primary':'#d4aa55','--soft':'#454b4e','--border':'#5f6975'}};$$('.theme-btn').forEach(b=>b.onclick=()=>{Object.entries(themes[b.dataset.theme]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))});
const modal=$('#scratchModal'),canvas=$('#scratchCanvas'),ctx=canvas.getContext('2d');let drawing=false,erase=false;function resizeCanvas(){const r=canvas.getBoundingClientRect();const d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round'}$('#scratchBtn').onclick=()=>{modal.classList.add('open');setTimeout(resizeCanvas,50)};$('#closeScratchBtn').onclick=()=>modal.classList.remove('open');$('#penBtn').onclick=()=>erase=false;$('#eraserBtn').onclick=()=>erase=true;$('#clearCanvasBtn').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]}canvas.addEventListener('pointerdown',e=>{drawing=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.strokeStyle=erase?'#fffef8':'#263125';ctx.lineWidth=erase?18:2.4;ctx.lineTo(x,y);ctx.stroke()});window.addEventListener('pointerup',()=>drawing=false);
renderAll();
