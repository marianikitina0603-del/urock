];
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/;/g,',')}
function parseAnswers(s){return norm(s).split(',').filter(Boolean).map(v=>{if(v.includes('/')){let[a,b]=v.split('/').map(Number);return a/b}return Number(v)}).filter(v=>!Number.isNaN(v)).sort((a,b)=>a-b)}
function sameSet(a,b){let A=parseAnswers(a),B=[...new Set(b.map(v=>{if(String(v).includes('/')){let[p,q]=String(v).split('/').map(Number);return p/q}return Number(v)}))].sort((x,y)=>x-y);return A.length===B.length&&A.every((v,i)=>Math.abs(v-B[i])<1e-8)}
function fb(el,ok){el.className='feedback '+(ok?'ok':'bad');el.textContent=ok?'Верно':'Неверно'}
const labels=['Кубические','Группировка','Общий множитель','Биквадратные','Дробно-рациональные','Замена выражения','С радикалом','Сумма квадратов'];
const navTitles=['Разобранный пример','Восстановите решение','Найдите ошибку','Решите самостоятельно','Выставьте баллы за решение'];
const icons=['▣','✚','⌕','✎','★'];
const tabs=document.getElementById('tabs'),app=document.getElementById('app');
function mathify(s){return String(s).replace(/\$([^$]+)\$/g,(m,x)=>`\\(${x}\\)`)}

// 20.2: ровно три пропуска — во 2-й строке, в 3-й строке и в ответе.
data[0].restore.items=['25','x^2-25','-5; -3; 5'];
data[0].restore.templates=[
  String.raw`<span class="math-inline">\(x^3+3x^2-25x-75=0\)</span>`,
  String.raw`<span class="math-inline">\(x^2(x+3)-\)</span>{{0}}<span class="math-inline">\((x+3)=0\)</span>`,
  String.raw`<span class="math-inline">\((x+3)\)</span>{{1}}<span class="math-inline">\(=0\)</span>`,
  String.raw`<span class="math-inline">Ответ: \(x=\)</span>{{2}}`
];

data.forEach((d,i)=>{
  tabs.insertAdjacentHTML('beforeend',`<button class="tab ${i?'':'active'}" data-i="${i}"><span class="num">${d.n}</span><span class="short">${labels[i]}</span></button>`);
  let restoreTokens=d.restore.items ? [...d.restore.items] : d.restore.gaps.map(g=>g[0]);
  let restoreLines;
  if(d.restore.templates){
    restoreLines=d.restore.templates.map(tpl=>{
      let rendered=tpl.replace(/\{\{(\d+)\}\}/g,(m,n)=>{
        let token=restoreTokens[Number(n)];
        if(token===undefined) return '';
        return `<span class="dropzone" data-a="${String(token).replace(/"/g,'&quot;')}"></span>`;
      });
      return `<div class="solution-line restore-line">${rendered}</div>`;
    }).join('');
  }else{
    restoreLines=d.restore.parts.map((x,j)=>{
      let token=restoreTokens[j%restoreTokens.length];
      let raw=x, zone=`<span class="dropzone" data-a="${token.replace(/"/g,'&quot;')}"></span>`;
      if(raw.startsWith('$')&&raw.endsWith('$')) raw=raw.slice(1,-1);
      let shown;
      if(raw.includes(token)){
        let k=raw.indexOf(token),a=raw.slice(0,k),b=raw.slice(k+token.length);
        shown=(a?mathify(`$${a}$`):``)+zone+(b?mathify(`$${b}$`):``);
      }else{
        shown=mathify(raw)+` `+zone;
      }
      return `<div class="solution-line restore-line">${shown}</div>`;
    }).join('');
  }
  let bank=[...restoreTokens].sort(()=>Math.random()-.5).map((t,j)=>`<span class="dragitem" draggable="true" data-v="${t.replace(/"/g,'&quot;')}" data-id="${j}">\\(${t}\\)</span>`).join('');

  const sections=[
    `<section class="sectionview active" data-s="0"><div class="taskhead"><h2>1. Разобранный пример</h2><p>Изучите последовательность решения аналогичного уравнения.</p></div><div class="taskbody"><div class="eqblock">Решите уравнение: $$${d.worked.eq}$$</div><div class="worked">${d.worked.steps.map(s=>`<div class="solution-line">${mathify(s)}</div>`).join('')}</div></div><div class="status"><span class="dot">i</span>Разобранный пример предназначен для изучения способа решения.</div></section>`,
    `<section class="sectionview" data-s="1"><div class="taskhead"><h2>2. Восстановите решение (перетаскиванием)</h2><p>Перетащите выражения в пропуски непосредственно в решении.</p></div><div class="taskbody"><div class="eqblock">$$${d.restore.eq}=0$$</div>${restoreLines}<div class="bankwrap"><div class="banktitle">Перетащите сюда нужные выражения:</div><div class="bank">${bank}</div></div></div><div class="actions"><button class="btn resetRestore">↻&nbsp; Сбросить</button><span class="feedback restoreFeedback"></span><button class="btn primary checkRestore">✓&nbsp; Проверить</button></div><div class="status"><span class="dot">i</span>Решите задание и нажмите «Проверить».</div></section>`,
    `<section class="sectionview" data-s="2"><div class="taskhead"><h2>3. Найдите ошибку</h2><p>Укажите строку, в которой впервые допущена ошибка.</p></div><div class="taskbody"><div class="eqblock">Уравнение: $$${d.error.eq}$$</div>${d.error.lines.map((x,j)=>`<label class="choice"><input type="radio" name="err${i}" value="${j+1}"> ${mathify(x)}</label>`).join('')}</div><div class="actions"><span class="feedback errorFeedback"></span><button class="btn primary checkError">✓&nbsp; Проверить</button></div><div class="status"><span class="dot">i</span>Выберите одну строку решения.</div></section>`,
    `<section class="sectionview" data-s="3"><div class="taskhead"><h2>4. Решите самостоятельно</h2><p>Решите уравнение в черновике и внесите только окончательный ответ.</p></div><div class="taskbody"><div class="eqblock">Решите уравнение: $$${d.own.eq}$$</div><div class="row"><input class="gap ownAns" style="width:320px" placeholder="Введите ответ через ;"></div><div class="scratch-wrap"><div class="scratch-head"><span class="scratch-title">Черновик</span><button type="button" class="btn clearScratch">Очистить черновик</button></div><canvas class="scratchpad"></canvas><div class="scratch-note">Можно писать мышью, стилусом или пальцем.</div></div></div><div class="actions"><span class="feedback ownFeedback"></span><button class="btn primary checkOwn">✓&nbsp; Проверить ответ</button></div><div class="status"><span class="dot">i</span>В поле ответа укажите только корни; несколько корней вводите через точку с запятой.</div></section>`,
    `<section class="sectionview" data-s="4"><div class="taskhead"><h2>5. Выставьте баллы за решение</h2></div><div class="taskbody"><div class="eqblock">Уравнение: $$${d.grade.eq}$$</div><div class="grade-solution"><b>Решение ученика</b>${d.grade.solution.split('→').map(x=>`<div>${mathify(x.trim())}</div>`).join('')}</div><p><b>Сколько баллов?</b></p><label class="choice"><input type="radio" name="grade${i}" value="0"> 0 баллов</label><label class="choice"><input type="radio" name="grade${i}" value="1"> 1 балл</label><label class="choice"><input type="radio" name="grade${i}" value="2"> 2 балла</label></div><div class="actions"><button class="btn resetGrade">↻&nbsp; Сбросить</button><span class="feedback gradeFeedback"></span><button class="btn primary checkGrade">✓&nbsp; Проверить</button></div></section>`
  ].join('');

  const nav=navTitles.map((t,j)=>`<button class="navbtn ${j?'':'active'}" data-s="${j}"><span class="ico">${icons[j]}</span><span>${j+1}. ${t}</span></button>`).join('');
  app.insertAdjacentHTML('beforeend',`<article class="panel ${i?'':'active'}" data-i="${i}"><div class="workspace"><aside class="sidebar"><div class="sidebox"><h3>Навигация по блоку</h3><div class="blocknav">${nav}</div></div><div class="sidebox"><div class="info"><b>Тип уравнений</b><br>${mathify(d.type)}.</div></div><div class="sidebox"><div class="info"><b>Критерии оценивания (макс. 2 балла)</b><p class="rubricLine"><strong>2 балла</strong> — обоснованно получен верный ответ.</p><p class="rubricLine"><strong>1 балл</strong> — решение доведено до конца, но допущена арифметическая ошибка.</p><p class="rubricLine"><strong>0 баллов</strong> — решение не соответствует ни одному из критериев.</p></div></div></aside><div class="maincard">${sections}</div></div></article>`);
});

function activatePanel(i){
  document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));
  document.querySelector(`.tab[data-i="${i}"]`).classList.add('active');
  document.querySelector(`.panel[data-i="${i}"]`).classList.add('active');
  if(window.MathJax?.typesetPromise) MathJax.typesetPromise([document.querySelector(`.panel[data-i="${i}"]`)]);
}
tabs.onclick=e=>{let b=e.target.closest('.tab');if(!b)return;activatePanel(b.dataset.i);window.scrollTo({top:0,behavior:'smooth'})};

document.querySelectorAll('.panel').forEach((p,i)=>{
  let d=data[i], dragged=null;
  p.querySelector('.blocknav').addEventListener('click',e=>{let b=e.target.closest('.navbtn');if(!b)return;p.querySelectorAll('.navbtn,.sectionview').forEach(x=>x.classList.remove('active'));b.classList.add('active');p.querySelector(`.sectionview[data-s="${b.dataset.s}"]`).classList.add('active');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([p.querySelector(`.sectionview[data-s="${b.dataset.s}"]`)]);});
  p.querySelectorAll('.dragitem').forEach(it=>{it.addEventListener('dragstart',()=>dragged=it);it.addEventListener('click',()=>dragged=it)});
  p.querySelectorAll('.dropzone').forEach(z=>{
    z.addEventListener('dragover',e=>e.preventDefault());
    const place=()=>{if(!dragged)return;if(z.dataset.itemId){let old=p.querySelector(`.dragitem[data-id="${z.dataset.itemId}"]`);if(old)old.classList.remove('used')}z.innerHTML=`\\(${dragged.dataset.v}\\)`;z.dataset.item=dragged.dataset.v;z.dataset.itemId=dragged.dataset.id;z.classList.add('filled');dragged.classList.add('used');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([z]);dragged=null};
    z.addEventListener('drop',e=>{e.preventDefault();place()});z.addEventListener('click',place);
  });
  p.querySelector('.resetRestore').onclick=()=>{p.querySelectorAll('.dropzone').forEach(z=>{z.innerHTML='';z.dataset.item='';z.dataset.itemId='';z.classList.remove('filled')});p.querySelectorAll('.dragitem').forEach(x=>x.classList.remove('used'));let f=p.querySelector('.restoreFeedback');f.className='feedback restoreFeedback';f.textContent='';dragged=null};
  const canvas=p.querySelector('.scratchpad');
  if(canvas){
    const ctx=canvas.getContext('2d'); let drawing=false, last=null;
    const resize=()=>{const r=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.max(1,Math.round(r.width*ratio));canvas.height=Math.max(1,Math.round(r.height*ratio));ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#3f4937';};
    requestAnimationFrame(resize);
    const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
    canvas.addEventListener('pointerdown',e=>{drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId)});
    canvas.addEventListener('pointermove',e=>{if(!drawing)return;const q=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q});
    const stop=()=>{drawing=false;last=null}; canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
    p.querySelector('.clearScratch').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height)};
  }
  p.querySelector('.checkRestore').onclick=()=>{let ok=[...p.querySelectorAll('.dropzone')].every(x=>norm(x.dataset.item||'')===norm(x.dataset.a));fb(p.querySelector('.restoreFeedback'),ok)};
  p.querySelector('.checkError').onclick=()=>{let x=p.querySelector(`input[name="err${i}"]:checked`);fb(p.querySelector('.errorFeedback'),!!x&&Number(x.value)===d.error.correct)};
  p.querySelector('.checkOwn').onclick=()=>fb(p.querySelector('.ownFeedback'),sameSet(p.querySelector('.ownAns').value,d.own.ans));
  p.querySelector('.resetGrade').onclick=()=>{p.querySelectorAll(`input[name="grade${i}"]`).forEach(x=>x.checked=false);let f=p.querySelector('.gradeFeedback');f.className='feedback gradeFeedback';f.textContent=''};
  p.querySelector('.checkGrade').onclick=()=>{let x=p.querySelector(`input[name="grade${i}"]:checked`);fb(p.querySelector('.gradeFeedback'),!!x&&Number(x.value)===d.grade.score)};
});</script></body></html>
