<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ОГЭ №8 — интерактивный рабочий лист</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#1d2638;--muted:#6c778d;--line:#dfe5ef;
  --accent:#5067e8;--accent-soft:#eef1ff;--good:#20a66a;--good-soft:#eaf8f2;
  --warn:#d99518;--warn-soft:#fff6df;--bad:#d94e5d;--bad-soft:#fff0f2;
  --skip:#6a7a91;--skip-soft:#eef2f6;--shadow:0 12px 35px rgba(38,55,95,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#e9edf5;color:var(--ink)}
body{display:grid;place-items:center;overflow:auto}
button,input,textarea{font:inherit}
button{cursor:pointer}
#frame{
  width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-height:560px;min-width:920px;
  aspect-ratio:16/9;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.06),var(--shadow);
  overflow:hidden;position:relative;border-radius:18px
}
@media(max-width:950px),(max-height:590px){
  body{display:block;background:var(--bg);overflow:auto}
  #frame{min-width:0;min-height:0;width:100vw;height:auto;aspect-ratio:16/9;border-radius:0;overflow:auto}
}
.topbar{height:72px;padding:12px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92)}
.brand{font-weight:800;font-size:20px;margin-right:auto}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;transition:.15s;min-height:42px}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(30,45,80,.08)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.warn{background:var(--warn-soft);color:#8a5a00;border-color:#f1d895}
.btn.bad{background:var(--bad-soft);color:#a82c3b;border-color:#f1bcc4}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.view{height:calc(100% - 72px);padding:22px;overflow:auto}
.hidden{display:none!important}
.hero{display:flex;gap:18px;margin-bottom:18px;align-items:stretch}
.hero-card{background:linear-gradient(135deg,#fff,#f0f3ff);border:1px solid #dfe4ff;border-radius:18px;padding:18px 20px;flex:1}
.hero-card h1{margin:0 0 7px;font-size:26px}.hero-card p{margin:0;color:var(--muted);line-height:1.45}
.skill-summary{width:34%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.skill-summary h3{margin:0 0 10px;font-size:15px}.mini-list{font-size:12px;color:var(--muted);line-height:1.5;max-height:72px;overflow:hidden}
.block-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.block-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;min-height:164px;display:flex;flex-direction:column;box-shadow:0 5px 16px rgba(40,55,90,.035)}
.block-card.off{opacity:.48}.block-card h3{font-size:15px;margin:0 0 6px}.block-card p{font-size:12px;line-height:1.35;color:var(--muted);margin:0 0 10px}
.stats{font-size:12px;font-weight:700;margin-top:auto;color:#48556d}
.dotmap{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;border:1px solid var(--line);background:#fff;color:#748096}
.dot.s-green{background:var(--good-soft);border-color:#b7e7d2;color:#13754d}
.dot.s-yellow{background:var(--warn-soft);border-color:#f0d697;color:#8f5d00}
.dot.s-skip{background:var(--skip-soft);border-color:#d8dfe8;color:#536176}
.dot.s-repeat{background:var(--bad-soft);border-color:#f3b9c2;color:#aa2f40}
.dot.s-current{box-shadow:0 0 0 3px #dce2ff}
.block-actions{display:flex;gap:8px;margin-top:9px}.block-actions .btn{padding:7px 10px;min-height:34px;font-size:12px}
.continue-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dfe4ff;border-radius:14px;padding:10px 14px;margin-bottom:14px}
.continue-card .grow{flex:1}.continue-card strong{display:block;font-size:13px}.continue-card span{font-size:12px;color:var(--muted)}
.exercise-layout{display:grid;grid-template-columns:minmax(0,1fr) 0;gap:18px;height:100%;transition:.2s}
.exercise-layout.panel-open{grid-template-columns:minmax(0,1fr) minmax(300px,34%)}
.exercise-main{min-width:0;display:flex;flex-direction:column;gap:13px}
.breadcrumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.task-map{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:13px}
.task-map .dot{cursor:pointer}
.task-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;flex:1;min-height:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.task-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.task-no{font-weight:900;font-size:14px;background:var(--accent-soft);color:#4057cf;border-radius:10px;padding:7px 10px}.badge{font-size:11px;border-radius:99px;padding:6px 9px;background:#f1f3f7;color:#657188;font-weight:800}
.prompt{font-size:23px;line-height:1.65;min-height:95px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px}
.answer-wrap{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:10px;align-items:center;margin:10px auto 7px;width:min(720px,100%)}
.answer-input{width:100%;border:2px solid #ccd4e4;border-radius:14px;padding:13px 16px;font-size:23px;text-align:center;outline:none;background:#fbfcff}
.answer-input:focus{border-color:#8c9af0;box-shadow:0 0 0 4px #edf0ff}.answer-input.error{border-color:var(--bad);background:var(--bad-soft);animation:shake .22s}
@keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
.feedback{min-height:45px;text-align:center;font-size:13px;line-height:1.45}
.feedback.good{color:#126e49}.feedback.bad{color:#a62d3c}.feedback.info{color:#57657c}
.math-keyboard{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:3px auto 10px;max-width:720px}
.key{min-width:48px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;font-size:16px}
.key.wide{min-width:78px;font-size:12px}
.help-choice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:3px}
.task-actions{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid #eef1f5}.task-actions .spacer{flex:1}
.side-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;overflow:auto;min-width:0;box-shadow:var(--shadow)}
.side-panel h2{font-size:17px;margin:0 0 10px}.side-panel h4{margin:14px 0 6px;font-size:13px}.side-panel p{font-size:13px;line-height:1.5;color:#4f5b70}.formula-box{padding:12px;border-radius:12px;background:var(--accent-soft);overflow:auto;text-align:center}
.panel-close{float:right;border:0;background:#f3f5f8;width:32px;height:32px;border-radius:9px;font-size:18px}
.training-card{background:#fff;border:1px solid #dfe4ff;border-radius:18px;padding:22px;box-shadow:var(--shadow);max-width:1000px;margin:auto}
.training-title{font-size:12px;font-weight:900;color:#4f63cf;text-transform:uppercase;letter-spacing:.06em}.training-card h1{font-size:20px;margin:7px 0 16px}
.teacher-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}
.panel-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.panel-card h2,.panel-card h3{margin-top:0}
.teacher-table{width:100%;border-collapse:collapse;font-size:11px}.teacher-table th,.teacher-table td{border-bottom:1px solid #edf0f4;padding:7px 6px;text-align:left;vertical-align:top}.teacher-table th{position:sticky;top:0;background:#fff;z-index:1}
.scroll-box{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.switch-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f6;font-size:12px}.switch-row:last-child{border:0}.switch-row span{flex:1}
.small-input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px;width:100%}
.report-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.report-list{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.report-list h3{margin:0 0 8px;font-size:15px}.report-list ul{padding-left:18px;margin:0;font-size:13px;line-height:1.55;color:#566279}
.end-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi strong{font-size:24px;display:block}.kpi span{font-size:11px;color:var(--muted)}
.notice{background:#fff8df;border:1px solid #f1da93;color:#765300;padding:10px 12px;border-radius:12px;font-size:12px}
.modal{position:absolute;inset:0;background:rgba(25,34,54,.48);display:grid;place-items:center;z-index:20;padding:30px}.modal-box{background:#fff;border-radius:18px;padding:20px;width:min(560px,92%);box-shadow:var(--shadow)}.modal-box h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.footer-actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.katex{font-size:1.08em}.prompt .katex{font-size:1.12em}

.scratch-overlay{
  position:absolute;inset:0;z-index:30;background:rgba(22,30,48,.52);
  display:grid;place-items:center;padding:22px
}
.scratch-box{
  width:min(1180px,96%);height:min(690px,92%);background:#fff;border-radius:18px;
  box-shadow:0 18px 55px rgba(20,30,55,.24);display:flex;flex-direction:column;overflow:hidden
}
.scratch-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:#fff
}
.scratch-head h2{font-size:17px;margin:0;margin-right:auto}
.scratch-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.scratch-tool{
  border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;padding:8px 11px;
  font-weight:750;color:var(--ink)
}
.scratch-tool.active{background:var(--accent-soft);border-color:#aeb9ff;color:#4057cf}
.scratch-size{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.scratch-size input{width:100px}
.scratch-area{
  position:relative;flex:1;min-height:0;background-color:#fff;
  background-image:
    linear-gradient(#e8ecf3 1px,transparent 1px),
    linear-gradient(90deg,#e8ecf3 1px,transparent 1px);
  background-size:24px 24px
}
#scratchCanvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair
}
.scratch-note{
  position:absolute;left:12px;bottom:9px;font-size:11px;color:#8a94a7;pointer-events:none;
  background:rgba(255,255,255,.78);padding:4px 7px;border-radius:8px
}
@media(max-width:950px),(max-height:590px){
  .scratch-overlay{padding:8px}
  .scratch-box{width:98%;height:95%}
  .scratch-head{align-items:flex-start}
  .scratch-tools{justify-content:flex-end}
}

@media print{
  body,#frame{display:block!important;width:auto!important;height:auto!important;min-width:0!important;min-height:0!important;overflow:visible!important;background:#fff!important;box-shadow:none!important}
  .topbar,.no-print,#homeView,#exerciseView,#trainingView,#teacherView{display:none!important}
  #finishView{display:block!important;height:auto!important;padding:0!important;overflow:visible!important}
  .report-list,.kpi,.panel-card{break-inside:avoid}
}
</style>
</head>
<body>
<div id="frame">
  <header class="topbar">
    <div class="brand">ОГЭ №8 <small>Интерактивный рабочий лист</small></div>
    <button class="btn ghost" id="homeBtn">На главную</button>
    <button class="btn ghost" id="teacherBtn">Для учителя</button>
    <button class="btn ghost" id="scratchBtn">✎ Черновик</button>
    <button class="btn ghost" id="fullscreenBtn">На весь экран</button>
  </header>

  <main id="homeView" class="view"></main>
  <main id="exerciseView" class="view hidden"></main>
  <main id="trainingView" class="view hidden"></main>
  <main id="teacherView" class="view hidden"></main>
  <main id="finishView" class="view hidden"></main>

  <div id="scratchOverlay" class="scratch-overlay hidden" aria-hidden="true">
    <section class="scratch-box" role="dialog" aria-modal="true" aria-labelledby="scratchTitle">
      <header class="scratch-head">
        <h2 id="scratchTitle">Черновик</h2>
        <div class="scratch-tools">
          <button type="button" class="scratch-tool active" id="penTool">✎ Ручка</button>
          <button type="button" class="scratch-tool" id="eraserTool">⌫ Ластик</button>
          <label class="scratch-size">Толщина
            <input id="scratchSize" type="range" min="1" max="18" value="4">
          </label>
          <button type="button" class="scratch-tool" id="scratchUndo">↶ Отменить</button>
          <button type="button" class="scratch-tool" id="scratchClear">Очистить</button>
          <button type="button" class="scratch-tool" id="scratchClose">Закрыть</button>
        </div>
      </header>
      <div class="scratch-area" id="scratchArea">
        <canvas id="scratchCanvas"></canvas>
        <div class="scratch-note">Можно писать стилусом, графическим планшетом, мышью или пальцем.</div>
      </div>
    </section>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modalTitle">Подтверждение</h2>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">Отмена</button>
        <button class="btn bad" id="modalOk">Продолжить</button>
      </div>
    </div>
  </div>
</div>

<script>

const LS_KEY = "oge8_holst_v1";
const DEFAULT_STATE = {
  version:1,
  task:{},
  enabledBlocks:Object.fromEntries(CONTENT.blocks.map(b=>[b.id,true])),
  teacherComments:{},
  manualRepeat:{tasks:[],blocks:[]},
  last:null,
  activeSeconds:0,
  blockSeconds:{},
  taskSeconds:{},
  currentTimerTask:null,
  currentTimerBlock:null,
  lastActivity:Date.now(),
  repeatSession:false,
  scratchpads:{}
};
let state = loadState();
let currentBlock = null, currentTaskN = null, currentMode = "original";
let currentAnalogIndex = null, currentHintLevel = 0;
let modalCallback = null;

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY)||"null");
    if(!s) return structuredClone(DEFAULT_STATE);
    return Object.assign(structuredClone(DEFAULT_STATE),s,{
      enabledBlocks:Object.assign({},DEFAULT_STATE.enabledBlocks,s.enabledBlocks||{}),
      manualRepeat:Object.assign({tasks:[],blocks:[]},s.manualRepeat||{}),
      scratchpads:Object.assign({},s.scratchpads||{})
    });
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function saveState(){ localStorage.setItem(LS_KEY,JSON.stringify(state)); }

function T(n){ return CONTENT.tasks.find(t=>t.n===Number(n)); }
function B(id){ return CONTENT.blocks.find(b=>b.id===id); }
function ts(n){
  if(!state.task[n]) state.task[n]={
    status:null, attempts:0, cycleAttempts:0, errors:0, hintsUsed:0, ruleViews:0,
    notKnow:0, skipped:0, usedAnalogs:[], analogAttempts:{}, analogIncomplete:0,
    masteredOnRepeat:false, repeatAttempts:0, helpEver:false, lastAnswer:""
  };
  return state.task[n];
}
function blockTasks(id){ return CONTENT.tasks.filter(t=>t.b===id).sort((a,b)=>a.n-b.n); }
function normalize(v){
  let s=String(v??"").trim().replace(/\s+/g,"").replace(",",".");
  if(!s) return null;
  if(!/^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return null;
  const x=Number(s); return Number.isFinite(x)?x:null;
}
function correct(v,ans){ const a=normalize(v), b=normalize(ans); return a!==null&&b!==null&&Math.abs(a-b)<1e-9; }
function statusClass(s){ return s==="green"?"s-green":s==="yellow"?"s-yellow":s==="skip"?"s-skip":s==="repeat"?"s-repeat":""; }
function statusGlyph(s){ return s==="green"?"✓":s==="yellow"?"!":s==="skip"?"↷":s==="repeat"?"↻":"·"; }
function statusName(s){
  return s==="green"?"Решено самостоятельно":s==="yellow"?"Решено с затруднением":s==="skip"?"Пропущено":s==="repeat"?"Требует повторения":"Не выполнено";
}
function renderMath(root=document){
  if(window.renderMathInElement){
    renderMathInElement(root,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false});
  }
}
function showView(id){
  ["homeView","exerciseView","trainingView","teacherView","finishView"].forEach(v=>document.getElementById(v).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function setLast(block,n,mode="original"){
  state.last={block,n,mode,time:Date.now()}; saveState();
}
function blockStats(id){
  const arr=blockTasks(id), sts=arr.map(t=>ts(t.n).status);
  const done=sts.filter(Boolean).length;
  const repeat=sts.filter(s=>s==="repeat"||s==="skip").length;
  const allFinal=done===arr.length;
  return {total:arr.length,done,repeat,allFinal};
}
function problemTasks(){
  return CONTENT.tasks.filter(t=>{
    const s=ts(t.n);
    return s.status==="yellow"||s.status==="skip"||s.status==="repeat"||s.notKnow>0||
           state.manualRepeat.tasks.includes(t.n)||state.manualRepeat.blocks.includes(t.b);
  });
}
function recommendations(){
  const rec=[];
  CONTENT.blocks.forEach(b=>{
    const arr=blockTasks(b.id), prob=arr.filter(t=>{
      const s=ts(t.n); return s.status==="yellow"||s.status==="skip"||s.status==="repeat"||s.notKnow>0;
    });
    const green=arr.filter(t=>ts(t.n).status==="green").length;
    if(prob.length===0 && green===arr.length) rec.push(`«${b.title}»: навык устойчиво проявляется в выполненных заданиях.`);
    else if(prob.length) rec.push(`«${b.title}»: стоит повторить ${prob.length} из ${arr.length} заданий блока (${prob.map(t=>"№"+t.n).join(", ")}).`);
  });
  const solvedTimes=Object.entries(state.taskSeconds).filter(([n,sec])=>ts(n).status==="green"||ts(n).status==="yellow").map(([n,sec])=>Number(sec));
  if(solvedTimes.length>=4){
    const sorted=[...solvedTimes].sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)];
    const slow=Object.entries(state.taskSeconds).filter(([n,sec])=>Number(sec)>Math.max(60,med*1.7)&&ts(n).status);
    if(slow.length) rec.push(`По относительной скорости внутри этой работы больше времени потребовали: ${slow.map(([n])=>"№"+n).join(", ")}. Это дополнительный сигнал для наблюдения, а не норматив ОГЭ.`);
  }
  if(!rec.length) rec.push("Недостаточно завершённых заданий для содержательной рекомендации.");
  return rec;
}

function home(){
  showView("homeView"); currentMode="home"; stopTaskTimer();
  const hv=document.getElementById("homeView");
  const probs=problemTasks();
  const green=CONTENT.tasks.filter(t=>ts(t.n).status==="green").map(t=>t.n);
  const mastered=CONTENT.tasks.filter(t=>ts(t.n).masteredOnRepeat).map(t=>t.n);
  let cont="";
  if(state.last && T(state.last.n)){
    const tb=B(state.last.block), st=ts(state.last.n);
    cont=`<div class="continue-card">
      <div class="grow"><strong>Продолжить с места остановки</strong><span>${tb.title} · задание №${state.last.n} · ${statusName(st.status)}</span></div>
      <button class="btn primary" onclick="openTask('${state.last.block}',${state.last.n})">Продолжить</button>
    </div>`;
  }
  const cards=CONTENT.blocks.map(b=>{
    const st=blockStats(b.id), enabled=state.enabledBlocks[b.id]!==false;
    const dots=blockTasks(b.id).map(t=>`<span class="dot ${statusClass(ts(t.n).status)}" title="№${t.n}: ${statusName(ts(t.n).status)}">${statusGlyph(ts(t.n).status)}</span>`).join("");
    const stateText=st.allFinal?(st.repeat?"Завершён — есть темы для повторения":"Завершён"):"В работе";
    return `<section class="block-card ${enabled?"":"off"}">
      <h3>${b.title}</h3><p>${b.desc}</p>
      <div class="dotmap">${dots}</div>
      <div class="stats">${st.total} заданий · ${st.done} выполнено · ${st.repeat} требуют внимания<br>${stateText}</div>
      <div class="block-actions">
        <button class="btn ${enabled?"primary":""}" ${enabled?"":"disabled"} onclick="openBlock('${b.id}')">${st.done?"Продолжить":"Открыть"}</button>
      </div>
    </section>`;
  }).join("");

  hv.innerHTML=`${cont}
    <div class="hero">
      <section class="hero-card">
        <h1>Практика задания №8 ОГЭ</h1>
        <p>Выберите любой тематический блок. Исходные задания сохраняют нумерацию документа; после ошибок доступны подсказки, правило и тренировочные аналоги.</p>
        <div class="footer-actions">
          <button class="btn primary" onclick="startSmartRepeat()" ${probs.length?"":"disabled"}>Повторить ошибки (${probs.length})</button>
          <button class="btn" onclick="finish()">Завершить работу</button>
        </div>
      </section>
      <aside class="skill-summary">
        <h3>Карта навыков</h3>
        <div class="mini-list"><b>Что уже получается:</b> ${green.length?green.map(n=>"№"+n).join(", "):"пока нет завершённых заданий"}<br>
        <b>Что стоит повторить:</b> ${probs.length?probs.map(t=>"№"+t.n).join(", "):"пока не выявлено"}<br>
        ${mastered.length?`<b>Освоено при повторении:</b> ${mastered.map(n=>"№"+n).join(", ")}`:""}</div>
      </aside>
    </div>
    <div class="block-grid">${cards}</div>`;
}

function openBlock(id){
  if(state.enabledBlocks[id]===false) return;
  const arr=blockTasks(id);
  const first=arr.find(t=>!ts(t.n).status) || arr[0];
  openTask(id,first.n);
}
function taskMapHtml(id,n){
  return blockTasks(id).map(t=>`<button class="dot ${statusClass(ts(t.n).status)} ${t.n===n?"s-current":""}" onclick="openTask('${id}',${t.n})" title="№${t.n}: ${statusName(ts(t.n).status)}">${t.n}</button>`).join("");
}
function openTask(id,n,repeat=false){
  currentBlock=id; currentTaskN=Number(n); currentMode=repeat?"repeat":"original"; currentAnalogIndex=null; currentHintLevel=0;
  setLast(id,n,currentMode); showView("exerciseView"); startTaskTimer(n,id);
  const task=T(n), b=B(id), s=ts(n);
  const ev=document.getElementById("exerciseView");
  ev.innerHTML=`<div class="exercise-layout" id="exerciseLayout">
    <section class="exercise-main">
      <div class="breadcrumb"><span>${repeat?"Повторение":"Тематический блок"}</span> › <b>${b.title}</b></div>
      <div class="task-map">${taskMapHtml(id,n)}</div>
      <article class="task-card">
        <div class="task-head"><span class="task-no">Задание №${n}</span>
          ${repeat?'<span class="badge">Повторение</span>':""}
          ${s.masteredOnRepeat?'<span class="badge" style="background:#eaf8f2;color:#16734d">Освоено при повторении</span>':""}
        </div>
        <div class="prompt">${task.prompt}</div>
        <div class="answer-wrap">
          <input id="answerInput" class="answer-input" inputmode="decimal" autocomplete="off" placeholder="Введите ответ" value="${escapeHtml(s.lastAnswer||"")}">
          <button class="btn primary" onclick="checkOriginal()">Проверить</button>
        </div>
        <div class="math-keyboard">${keyboardHtml()}</div>
        <div id="feedback" class="feedback info">${s.status?`Текущий статус: <b>${statusName(s.status)}</b>`:""}</div>
        <div id="helpChoice" class="help-choice hidden">
          <button class="btn warn" onclick="showHint()">Подсказка</button>
          <button class="btn" onclick="startAnalog()">Попробовать аналог</button>
          <button class="btn" onclick="showRule()">Посмотреть правило</button>
        </div>
        <div class="task-actions">
          <button class="btn" onclick="prevTask()">Назад</button>
          <button class="btn ghost" onclick="skipTask()">Пропустить</button>
          <button class="btn ghost" onclick="dontKnow()">Не знаю</button>
          <span class="spacer"></span>
          <button class="btn" onclick="nextTask()">Далее</button>
        </div>
      </article>
    </section>
    <aside class="side-panel hidden" id="sidePanel"></aside>
  </div>`;
  renderMath(ev);
  const inp=document.getElementById("answerInput"); inp.focus();
  inp.addEventListener("input",()=>{ ts(n).lastAnswer=inp.value; saveState(); });
}

function keyboardHtml(){
  const keys=["1","2","3","4","5","6","7","8","9","0","−",",","."];
  return keys.map(k=>`<button class="key" onclick="keyIn('${k}')">${k}</button>`).join("")+
  `<button class="key wide" onclick="backspace()">⌫</button><button class="key wide" onclick="clearInput()">Очистить</button>`;

function keyIn(k){
  const inp=document.getElementById("answerInput")||document.getElementById("analogInput"); if(!inp)return;
  const val=k==="−"?"-":k; const st=inp.selectionStart??inp.value.length, en=inp.selectionEnd??st;
  inp.value=inp.value.slice(0,st)+val+inp.value.slice(en); inp.focus(); inp.setSelectionRange(st+val.length,st+val.length);
  inp.dispatchEvent(new Event("input"));
}
function backspace(){
  const inp=document.getElementById("answerInput")||document.getElementById("analogInput"); if(!inp)return;
  const st=inp.selectionStart??inp.value.length, en=inp.selectionEnd??st;
  if(st!==en) inp.value=inp.value.slice(0,st)+inp.value.slice(en);
  else if(st>0) inp.value=inp.value.slice(0,st-1)+inp.value.slice(st);
  inp.focus(); inp.dispatchEvent(new Event("input"));
}

// ---------- Черновик для графического планшета ----------
const scratch = {
  open:false, tool:"pen", drawing:false, pointerId:null, current:null,
  strokes:[], canvas:null, ctx:null, area:null, dpr:1
};

function scratchKey(){
  // Черновик сохраняется отдельно для каждого исходного задания.
  return currentTaskN ? String(currentTaskN) : "_general";
}
function ensureScratchState(){
  if(!state.scratchpads) state.scratchpads={};
  const key=scratchKey();
  if(!Array.isArray(state.scratchpads[key])) state.scratchpads[key]=[];
  return state.scratchpads[key];
}
function openScratchpad(){
  scratch.open=true;
  const ov=document.getElementById("scratchOverlay");
  ov.classList.remove("hidden"); ov.setAttribute("aria-hidden","false");
  scratch.canvas=document.getElementById("scratchCanvas");
  scratch.ctx=scratch.canvas.getContext("2d");
  scratch.area=document.getElementById("scratchArea");
  scratch.strokes=JSON.parse(JSON.stringify(ensureScratchState()));
  resizeScratchCanvas();
  requestAnimationFrame(()=>redrawScratch());
}
function closeScratchpad(){
  scratch.open=false;scratch.drawing=false;scratch.pointerId=null;
  const ov=document.getElementById("scratchOverlay");
  ov.classList.add("hidden");ov.setAttribute("aria-hidden","true");
  persistScratch();
}
function resizeScratchCanvas(){
  if(!scratch.canvas||!scratch.area)return;
  const r=scratch.area.getBoundingClientRect();
  scratch.dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  scratch.canvas.width=Math.max(1,Math.round(r.width*scratch.dpr));
  scratch.canvas.height=Math.max(1,Math.round(r.height*scratch.dpr));
  scratch.canvas.style.width=r.width+"px";scratch.canvas.style.height=r.height+"px";
  scratch.ctx=scratch.canvas.getContext("2d");
  scratch.ctx.setTransform(scratch.dpr,0,0,scratch.dpr,0,0);
  scratch.ctx.lineCap="round";scratch.ctx.lineJoin="round";
}
function scratchPoint(e){
  const r=scratch.canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)/r.width,
    y:(e.clientY-r.top)/r.height,
    p:(typeof e.pressure==="number"&&e.pressure>0)?e.pressure:0.5
  };
}
function scratchPointerDown(e){
  if(!scratch.open||scratch.drawing)return;
  e.preventDefault();
  scratch.drawing=true;scratch.pointerId=e.pointerId;
  try{scratch.canvas.setPointerCapture(e.pointerId);}catch(_){}
  const p=scratchPoint(e);
  scratch.current={
    tool:scratch.tool,
    size:Number(document.getElementById("scratchSize").value)||4,
    points:[p]
  };
  scratch.strokes.push(scratch.current);
  drawScratchSegment(scratch.current,null,p,e.pointerType);
}
function scratchPointerMove(e){
  if(!scratch.drawing||e.pointerId!==scratch.pointerId||!scratch.current)return;
  e.preventDefault();
  const p=scratchPoint(e), pts=scratch.current.points, prev=pts[pts.length-1];
  pts.push(p);drawScratchSegment(scratch.current,prev,p,e.pointerType);
}
function scratchPointerUp(e){
  if(e.pointerId!==scratch.pointerId)return;
  scratch.drawing=false;scratch.pointerId=null;scratch.current=null;
  persistScratch();
}
function drawScratchSegment(stroke,a,b,pointerType){
  const r=scratch.canvas.getBoundingClientRect(),ctx=scratch.ctx;
  const x1=(a||b).x*r.width,y1=(a||b).y*r.height,x2=b.x*r.width,y2=b.y*r.height;
  ctx.save();
  ctx.globalCompositeOperation=stroke.tool==="eraser"?"destination-out":"source-over";
  ctx.strokeStyle="#182033";
  // Для пера учитываем нажим, но сохраняем комфортную толщину для мыши/пальца.
  const pressure=(pointerType==="pen"?Math.max(.25,b.p||.5):1);
  ctx.lineWidth=Math.max(1,stroke.size*pressure);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function redrawScratch(){
  if(!scratch.ctx||!scratch.canvas)return;
  const r=scratch.canvas.getBoundingClientRect(),ctx=scratch.ctx;
  ctx.save();ctx.setTransform(scratch.dpr,0,0,scratch.dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);ctx.restore();
  for(const stroke of scratch.strokes){
    const pts=stroke.points||[];
    if(!pts.length)continue;
    if(pts.length===1) drawScratchSegment(stroke,null,pts[0],"mouse");
    else for(let i=1;i<pts.length;i++) drawScratchSegment(stroke,pts[i-1],pts[i],"mouse");
  }
}
function persistScratch(){
  if(!state.scratchpads)state.scratchpads={};
  state.scratchpads[scratchKey()]=JSON.parse(JSON.stringify(scratch.strokes||[]));
  saveState();
}
function setScratchTool(tool){
  scratch.tool=tool;
  document.getElementById("penTool").classList.toggle("active",tool==="pen");
  document.getElementById("eraserTool").classList.toggle("active",tool==="eraser");
  if(scratch.canvas)scratch.canvas.style.cursor=tool==="eraser"?"cell":"crosshair";
}
function undoScratch(){
  if(!scratch.strokes.length)return;
  scratch.strokes.pop();redrawScratch();persistScratch();
}
function clearScratch(){
  if(!scratch.strokes.length)return;
  if(!confirm("Очистить черновик для этого задания?"))return;
  scratch.strokes=[];redrawScratch();persistScratch();
}

document.getElementById("scratchBtn").onclick=openScratchpad;
document.getElementById("scratchClose").onclick=closeScratchpad;
document.getElementById("penTool").onclick=()=>setScratchTool("pen");
document.getElementById("eraserTool").onclick=()=>setScratchTool("eraser");
document.getElementById("scratchUndo").onclick=undoScratch;
document.getElementById("scratchClear").onclick=clearScratch;
document.getElementById("scratchCanvas").addEventListener("pointerdown",scratchPointerDown,{passive:false});
document.getElementById("scratchCanvas").addEventListener("pointermove",scratchPointerMove,{passive:false});
document.getElementById("scratchCanvas").addEventListener("pointerup",scratchPointerUp,{passive:false});
document.getElementById("scratchCanvas").addEventListener("pointercancel",scratchPointerUp,{passive:false});
window.addEventListener("resize",()=>{if(scratch.open){resizeScratchCanvas();redrawScratch();}});

document.getElementById("homeBtn").onclick=home;
document.getElementById("teacherBtn").onclick=teacher;
document.getElementById("fullscreenBtn").onclick=async()=>{
  try{ if(!document.fullscreenElement) await document.getElementById("frame").requestFullscreen(); else await document.exitFullscreen(); }catch(e){}
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(scratch.open){closeScratchpad();return;}closePanel();}
  if(e.key==="Enter"){
    const a=document.getElementById("analogInput"),o=document.getElementById("answerInput");
    if(a&&document.activeElement===a){e.preventDefault();checkAnalog();}
    else if(o&&document.activeElement===o){e.preventDefault();checkOriginal();}
  }
});
window.addEventListener("beforeunload",saveState);
window.addEventListener("load",()=>{home();setTimeout(()=>renderMath(document),50);});
</script>
