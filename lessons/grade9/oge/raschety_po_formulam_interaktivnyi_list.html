<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Расчёты по формулам — интерактивный рабочий лист</title>

<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
  :root{
    --bg:#f7f4ea;
    --surface:#fffdf7;
    --surface-2:#f1f5e7;
    --text:#263125;
    --muted:#697468;
    --primary:#6c8a52;
    --primary-2:#89a46d;
    --primary-soft:#e7eedc;
    --border:#cbd6bc;
    --danger:#b55d54;
    --success:#4e7f53;
    --shadow:0 8px 24px rgba(45,60,35,.08);
    --radius:16px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg),#ffffff 68%);
    color:var(--text);
    min-height:100vh;
  }

  button,input,textarea{font:inherit}
  button{cursor:pointer}

  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    box-shadow:0 3px 16px rgba(0,0,0,.04);
  }

  .topbar-row{
    display:flex;
    align-items:stretch;
    gap:8px;
    padding:10px 14px 0;
    overflow-x:auto;
  }

  .topic-tab{
    min-width:170px;
    border:1px solid var(--border);
    border-bottom:3px solid transparent;
    border-radius:14px 14px 0 0;
    background:var(--surface);
    color:var(--text);
    padding:12px 16px;
    font-weight:800;
    text-align:center;
    transition:.2s ease;
  }
  .topic-tab small{
    display:block;
    margin-top:5px;
    font-size:.78rem;
    font-weight:600;
    color:var(--muted);
  }
  .topic-tab:hover{background:var(--primary-soft)}
  .topic-tab.active{
    color:var(--primary);
    border-color:var(--primary);
    border-bottom-color:var(--primary);
    background:var(--primary-soft);
  }

  .themebar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:8px 14px 10px;
    border-top:1px solid color-mix(in srgb,var(--border) 55%, transparent);
  }
  .theme-label{
    align-self:center;
    font-size:.9rem;
    color:var(--muted);
    margin-right:2px;
  }
  .theme-btn{
    width:31px;height:31px;border-radius:50%;
    border:2px solid #fff;
    outline:1px solid var(--border);
    transition:.2s;
  }
  .theme-btn:hover{transform:scale(1.1)}
  .theme-btn.active{outline:3px solid var(--primary)}

  .theme-sage{background:linear-gradient(135deg,#d7cfae 0 50%,#78915c 50%)}
  .theme-blue{background:linear-gradient(135deg,#dce9f7 0 50%,#376fae 50%)}
  .theme-rose{background:linear-gradient(135deg,#f4e0df 0 50%,#a95f71 50%)}
  .theme-night{background:linear-gradient(135deg,#303845 0 50%,#d4aa55 50%)}

  .layout{
    display:grid;
    grid-template-columns:280px minmax(0,1fr);
    gap:18px;
    padding:18px;
    width:min(1600px,100%);
    margin:0 auto;
    flex:1;
  }

  .sidebar{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .sidebar-card{
    overflow:hidden;
  }
  .sidebar-title{
    padding:14px 16px;
    font-weight:900;
    color:var(--primary);
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--surface),var(--primary-soft));
  }

  .task-nav{
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .task-btn{
    border:0;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    padding:12px 12px;
    text-align:left;
    font-weight:700;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .task-btn:hover{background:var(--primary-soft)}
  .task-btn.active{
    background:var(--primary);
    color:white;
  }
  .task-num{
    width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;
    background:color-mix(in srgb,var(--primary) 13%, white);
    color:var(--primary);
    font-size:.86rem;
  }
  .task-btn.active .task-num{
    background:rgba(255,255,255,.18);
    color:#fff;
  }

  .info{
    padding:15px 16px;
    line-height:1.55;
    font-size:.92rem;
  }
  .info strong{color:var(--primary)}
  .info p{margin:.35rem 0}

  .workspace{
    padding:20px;
    min-height:700px;
  }

  .task-header{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .task-header h1{
    margin:0;
    color:var(--primary);
    font-size:clamp(1.35rem,2vw,2rem);
  }
  .task-kicker{
    margin:5px 0 0;
    color:var(--muted);
  }

  .task-content{
    border-top:1px solid var(--border);
    padding-top:18px;
  }

  .example-box{
    background:var(--primary-soft);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin:14px 0;
  }

  .question{
    font-size:1.13rem;
    line-height:1.6;
    margin:12px 0 16px;
  }

  .answer-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin:18px 0;
  }
  .answer-row label{font-weight:800}
  .answer-input{
    min-width:220px;
    flex:1;
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    background:white;
    color:#1f291f;
    outline:none;
  }
  .answer-input:focus{border-color:var(--primary)}

  .choice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin:16px 0;
  }
  .choice{
    display:flex;
    gap:10px;
    align-items:center;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    background:#fff;
  }

  .sequence-list{display:flex;flex-direction:column;gap:9px;margin:16px 0}.sequence-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff}.sequence-item select{border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--surface)}

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding-top:18px;
    margin-top:24px;
    border-top:1px solid var(--border);
  }
  .btn{
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 16px;
    font-weight:800;
    background:var(--surface);
    color:var(--text);
    transition:.2s;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{
    margin-left:auto;
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .btn-soft{
    background:var(--primary-soft);
    color:var(--primary);
  }
  .btn-danger{
    color:var(--danger);
    background:color-mix(in srgb,var(--danger) 8%, white);
  }

  .feedback{
    margin-top:14px;
    border-radius:12px;
    padding:12px 14px;
    display:none;
    font-weight:800;
  }
  .feedback.show{display:block}
  .feedback.ok{
    color:var(--success);
    background:color-mix(in srgb,var(--success) 11%, white);
    border:1px solid color-mix(in srgb,var(--success) 30%, white);
  }
  .feedback.bad{
    color:var(--danger);
    background:color-mix(in srgb,var(--danger) 10%, white);
    border:1px solid color-mix(in srgb,var(--danger) 28%, white);
  }

  .progress-line{
    height:7px;
    border-radius:999px;
    background:color-mix(in srgb,var(--border) 50%, white);
    overflow:hidden;
    margin-top:10px;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:var(--primary);
    transition:.25s;
  }

  /* Черновик */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.34);
    display:none;
    place-items:center;
    z-index:100;
    padding:18px;
  }
  .modal.open{display:grid}
  .scratchpad{
    width:min(900px,96vw);
    height:min(650px,90vh);
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .scratch-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    background:var(--primary-soft);
    border-bottom:1px solid var(--border);
  }
  .scratch-head strong{color:var(--primary)}
  .scratch-head .spacer{flex:1}
  .tool-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:9px;
    padding:8px 10px;
    font-weight:700;
  }
  #scratchCanvas{
    flex:1;
    width:100%;
    min-height:0;
    touch-action:none;
    cursor:crosshair;
    background-color:#fffef8;
    background-image:
      linear-gradient(rgba(100,120,100,.12) 1px, transparent 1px),
      linear-gradient(90deg,rgba(100,120,100,.12) 1px,transparent 1px);
    background-size:24px 24px;
  }

  .mobile-task-select{
    display:none;
    margin-bottom:12px;
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
  }

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;padding:10px}
    .sidebar{display:none}
    .workspace{padding:15px;min-height:600px}
    .mobile-task-select{display:block}
    .btn-primary{margin-left:0}
    .topic-tab{min-width:145px}
  }
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-row" id="topicTabs"></div>
    <div class="themebar">
      <span class="theme-label">Тема:</span>
      <button class="theme-btn theme-sage active" data-theme="sage" title="Бежево-зелёная"></button>
      <button class="theme-btn theme-blue" data-theme="blue" title="Голубая"></button>
      <button class="theme-btn theme-rose" data-theme="rose" title="Розово-пудровая"></button>
      <button class="theme-btn theme-night" data-theme="night" title="Тёмная золотая"></button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card sidebar-card">
        <div class="sidebar-title">Задания</div>
        <nav class="task-nav" id="taskNav"></nav>
      </section>

      <section class="card">
        <div class="sidebar-title">Подсказка по теме</div>
        <div class="info" id="topicInfo"></div>
      </section>

      <section class="card">
        <div class="sidebar-title">Прогресс</div>
        <div class="info">
          <p><strong id="progressText">0 из 0</strong> заданий выполнено</p>
          <div class="progress-line"><div class="progress-bar" id="progressBar"></div></div>
        </div>
      </section>
    </aside>

    <section class="card workspace">
      <select class="mobile-task-select" id="mobileTaskSelect"></select>

      <div class="task-header">
        <div>
          <h1 id="taskTitle"></h1>
          <p class="task-kicker" id="taskInstruction"></p>
        </div>
      </div>

      <div class="task-content" id="taskContent"></div>

      <div class="actions">
        <button class="btn btn-danger" id="resetBtn">↻ Сбросить</button>
        <button class="btn btn-soft" id="scratchBtn">✎ Черновик</button>
        <button class="btn" id="nextBtn">Следующая задача →</button>
        <button class="btn btn-primary" id="checkBtn">✓ Проверить</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </section>
  </main>
</div>

<div class="modal" id="scratchModal" aria-hidden="true">
  <div class="scratchpad">
    <div class="scratch-head">
      <strong>Черновик</strong>
      <button class="tool-btn" id="penBtn">✎ Ручка</button>
      <button class="tool-btn" id="eraserBtn">⌫ Ластик</button>
      <button class="tool-btn" id="clearCanvasBtn">Очистить</button>
      <span class="spacer"></span>
      <button class="tool-btn" id="closeScratchBtn">✕ Закрыть</button>
    </div>
    <canvas id="scratchCanvas"></canvas>
  </div>
</div>

<script>
/* =========================================================
   1. ДАННЫЕ РАБОЧЕГО ЛИСТА
   Меняйте названия подтем, задания, ответы и подсказки здесь.
   Типы заданий в шаблоне:
   - input  : краткий ответ
   - choice : один правильный ответ
   - multi  : несколько правильных ответов
   ========================================================= */

const workbook = [
  {id:"t1",code:"1",title:"Подстановка в формулу",info:"Сначала определите известные величины, аккуратно подставьте их в формулу и выполните вычисления. Следите за единицами измерения.",tasks:[
    {title:"1. Выберите верный ответ",instruction:"Выполните подстановку и выберите ответ.",type:"choice",prompt:`<div class="question">Стоимость колодца вычисляется по формуле $$C=6000+4100n.$$ Найдите стоимость колодца из $4$ колец.</div>`,options:["$16400$ руб.","$22400$ руб.","$24000$ руб.","$10100$ руб."],answer:1},
    {title:"2. Введите ответ",instruction:"Рассчитайте значение по формуле.",type:"input",prompt:`<div class="question">В фирме «Чистая вода» стоимость колодца рассчитывается по формуле $$C=6500+4000n.$$ Найдите стоимость колодца из $11$ колец. Ответ дайте в рублях.</div>`,answer:["50500","50 500"]},
    {title:"3. Температура",instruction:"Введите числовой ответ.",type:"input",prompt:`<div class="question">Перевести температуру из шкалы Фаренгейта в шкалу Цельсия позволяет формула $$t_C=\\frac59(t_F-32).$$ Сколько градусов по шкале Цельсия соответствует $-112^\\circ F$?</div>`,answer:["-80"]},
    {title:"4. Обратное преобразование",instruction:"Выберите верный ответ.",type:"choice",prompt:`<div class="question">Для перевода температуры из шкалы Цельсия в шкалу Фаренгейта используют формулу $$t_F=1{,}8t_C+32.$$ Сколько градусов по шкале Фаренгейта соответствует $-100^\\circ C$?</div>`,options:["$-212$","$-148$","$-132$","$148$"],answer:1}
  ]},
  {id:"t2",code:"2",title:"Физические формулы",info:"При работе с физическими формулами выпишите данные, проверьте единицы измерения, подставьте значения и только затем вычисляйте.",tasks:[
    {title:"1. Восстановите последовательность",instruction:"Расположите шаги решения в правильном порядке.",type:"sequence",prompt:`<div class="question">Сила Архимеда вычисляется по формуле $$F=\\rho gV.$$ Дано: $\\rho=1000$ кг/м$^3$, $g=9{,}8$ м/с$^2$, $V=0{,}05$ м$^3$. Восстановите решение.</div>`,options:["$F=1000\\cdot9{,}8\\cdot0{,}05$","$F=490$","Записать формулу $F=\\rho gV$","Подставить известные значения"],answer:[2,3,0,1]},
    {title:"2. Найдите ошибку",instruction:"Выберите строку, в которой впервые допущена ошибка.",type:"choice",prompt:`<div class="question">Кинетическая энергия вычисляется по формуле $$E=\\frac{mv^2}{2}.$$ Для автомобиля $m=1200$ кг, $E=240000$ Дж ученик записал:</div><div class="example-box">1) $240000=\\frac{1200v^2}{2}$<br>2) $240000=600v^2$<br>3) $v^2=40$<br>4) $v=20$ м/с</div>`,options:["1","2","3","4"],answer:2},
    {title:"3. Потенциальная энергия",instruction:"Введите массу тела.",type:"input",prompt:`<div class="question">Потенциальная энергия вычисляется по формуле $$P=mgh.$$ Найдите массу тела, подвешенного на высоте $5$ м, если $P=980$ Дж, $g=9{,}8$ м/с$^2$. Ответ дайте в килограммах.</div>`,answer:["20"]}
  ]},
  {id:"t3",code:"3",title:"Выразить неизвестную",info:"Если неизвестная входит в формулу множителем, делите обе части равенства на остальные множители. Если неизвестная возведена в квадрат, сначала найдите её квадрат.",tasks:[
    {title:"1. Диагональ четырёхугольника",instruction:"Введите длину диагонали.",type:"input",prompt:`<div class="question">Площадь четырёхугольника вычисляется по формуле $$S=\\frac{d_1d_2\\sin\\alpha}{2}.$$ Найдите $d_1$, если $d_2=7$, $\\sin\\alpha=\\frac27$, $S=4$.</div>`,answer:["4"]},
    {title:"2. Сопротивление",instruction:"Выберите правильное преобразование формулы.",type:"choice",prompt:`<div class="question">Мощность постоянного тока вычисляется по формуле $$P=I^2R.$$ Как правильно выразить сопротивление $R$?</div>`,options:["$R=\\frac{P}{I^2}$","$R=PI^2$","$R=\\frac{I^2}{P}$","$R=\\frac PI$"],answer:0},
    {title:"3. Рассчитайте сопротивление",instruction:"Введите ответ в омах.",type:"input",prompt:`<div class="question">По формуле $$P=I^2R$$ найдите $R$, если $P=6{,}75$ Вт, $I=1{,}5$ А.</div>`,answer:["3","3 ом","3ом"]},
    {title:"4. Центростремительное ускорение",instruction:"Введите радиус окружности.",type:"input",prompt:`<div class="question">Центростремительное ускорение вычисляется по формуле $$a=\\omega^2R.$$ Найдите $R$, если $\\omega=0{,}5$ с$^{-1}$, $a=1{,}5$ м/с$^2$. Ответ дайте в метрах.</div>`,answer:["6"]}
  ]},
  {id:"t4",code:"4",title:"Степени и малые величины",info:"Особое внимание уделяйте квадратам величин, степеням десяти и десятичным дробям. Удобно сначала выполнить действия со степенями, затем с коэффициентами.",tasks:[
    {title:"1. Найдите ошибку",instruction:"Найдите ошибочный шаг.",type:"choice",prompt:`<div class="question">Энергия конденсатора вычисляется по формуле $$W=\\frac{CU^2}{2}.$$ При $C=10^{-4}$ Ф и $U=12$ В ученик решал:</div><div class="example-box">1) $W=\\frac{10^{-4}\\cdot12^2}{2}$<br>2) $12^2=24$<br>3) $W=\\frac{24\\cdot10^{-4}}2$<br>4) $W=0{,}0012$</div>`,options:["1","2","3","4"],answer:1},
    {title:"2. Энергия конденсатора",instruction:"Введите ответ в джоулях.",type:"input",prompt:`<div class="question">Найдите энергию конденсатора по формуле $$W=\\frac{CU^2}{2},$$ если $C=10^{-4}$ Ф, $U=12$ В.</div>`,answer:["0,0072","0.0072","7,2*10^-3","7.2*10^-3"]},
    {title:"3. Итог: скорость автомобиля",instruction:"Введите скорость в м/с.",type:"input",prompt:`<div class="question">Кинетическая энергия тела вычисляется по формуле $$E=\\frac{mv^2}{2}.$$ Автомобиль массой $1200$ кг обладает кинетической энергией $240$ тысяч джоулей. Найдите его скорость.</div>`,answer:["20"]}
  ]}
];

const themes = {
  sage:{
    "--bg":"#f7f4ea","--surface":"#fffdf7","--surface-2":"#f1f5e7","--text":"#263125",
    "--muted":"#697468","--primary":"#6c8a52","--primary-2":"#89a46d","--primary-soft":"#e7eedc",
    "--border":"#cbd6bc","--danger":"#b55d54","--success":"#4e7f53","--shadow":"0 8px 24px rgba(45,60,35,.08)"
  },
  blue:{
    "--bg":"#edf4fb","--surface":"#ffffff","--surface-2":"#eff6fd","--text":"#1d2c3d",
    "--muted":"#66788a","--primary":"#3f78b8","--primary-2":"#6b9bd0","--primary-soft":"#e3eef9",
    "--border":"#c9d9e9","--danger":"#bb5b5b","--success":"#477d65","--shadow":"0 8px 24px rgba(40,70,100,.08)"
  },
  rose:{
    "--bg":"#f8efec","--surface":"#fffafa","--surface-2":"#f7e9e9","--text":"#3b2b30",
    "--muted":"#806c72","--primary":"#a96270","--primary-2":"#c78692","--primary-soft":"#f1dde1",
    "--border":"#e2c9cf","--danger":"#a94e4e","--success":"#5d7c5e","--shadow":"0 8px 24px rgba(90,45,60,.08)"
  },
  night:{
    "--bg":"#252b34","--surface":"#323a46","--surface-2":"#3a4350","--text":"#f4efe4",
    "--muted":"#c6c2b8","--primary":"#d5ac57","--primary-2":"#e4c47e","--primary-soft":"#4a4438",
    "--border":"#59616d","--danger":"#e18b82","--success":"#9ac18f","--shadow":"0 8px 24px rgba(0,0,0,.22)"
  }
};

let state = {
  topic:0,
  task:0,
  completed:{},
  theme:localStorage.getItem("mathTheme") || "sage"
};

const el = id => document.getElementById(id);

function applyTheme(name){
  const t = themes[name] || themes.sage;
  Object.entries(t).forEach(([k,v]) => document.documentElement.style.setProperty(k,v));
  state.theme = name;
  localStorage.setItem("mathTheme",name);
  document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("active",b.dataset.theme===name));
}

function renderTabs(){
  el("topicTabs").innerHTML = workbook.map((t,i)=>`
    <button class="topic-tab ${i===state.topic?'active':''}" data-topic="${i}">
      ${t.code}<small>${t.title}</small>
    </button>`).join("");
  document.querySelectorAll(".topic-tab").forEach(btn=>{
    btn.onclick=()=>{
      state.topic=Number(btn.dataset.topic);
      state.task=0;
      renderAll();
    };
  });
}

function renderTaskNav(){
  const topic = workbook[state.topic];
  el("taskNav").innerHTML = topic.tasks.map((t,i)=>`
    <button class="task-btn ${i===state.task?'active':''}" data-task="${i}">
      <span class="task-num">${i+1}</span><span>${t.title.replace(/^\d+\.\s*/,'')}</span>
    </button>`).join("");

  document.querySelectorAll(".task-btn").forEach(btn=>{
    btn.onclick=()=>{
      state.task=Number(btn.dataset.task);
      renderTask();
      renderTaskNav();
      renderMobileSelect();
    };
  });
}

function renderMobileSelect(){
  const topic=workbook[state.topic];
  el("mobileTaskSelect").innerHTML=topic.tasks.map((t,i)=>`<option value="${i}" ${i===state.task?'selected':''}>${t.title}</option>`).join("");
}

function renderTask(){
  const topic=workbook[state.topic];
  const task=topic.tasks[state.task];

  el("topicInfo").innerHTML = `<p>${topic.info}</p>`;
  el("taskTitle").textContent = task.title;
  el("taskInstruction").textContent = task.instruction;
  el("feedback").className="feedback";
  el("feedback").textContent="";

  let html = task.prompt;

  if(task.type==="input"){
    html += `<div class="answer-row">
      <label for="studentAnswer">Ответ:</label>
      <input id="studentAnswer" class="answer-input" autocomplete="off" placeholder="Введите ответ">
    </div>`;
  }

  if(task.type==="choice"){
    html += `<div class="choice-grid">` + task.options.map((o,i)=>`
      <label class="choice"><input type="radio" name="choice" value="${i}"> <span>${o}</span></label>
    `).join("") + `</div>`;
  }

  if(task.type==="multi"){
    html += `<div class="choice-grid">` + task.options.map((o,i)=>`
      <label class="choice"><input type="checkbox" name="choice" value="${i}"> <span>${o}</span></label>
    `).join("") + `</div>`;
  }

  if(task.type==="sequence"){
    html += `<div class="sequence-list">` + task.options.map((o,i)=>`<div class="sequence-item"><select class="seq-pos" data-index="${i}"><option value="">№</option>${task.options.map((_,j)=>`<option value="${j+1}">${j+1}</option>`).join("")}</select><span>${o}</span></div>`).join("") + `</div>`;
  }

  el("taskContent").innerHTML = html;
  el("nextBtn").disabled = state.task >= topic.tasks.length-1;

  if(window.MathJax?.typesetPromise){
    MathJax.typesetPromise([el("taskContent")]).catch(()=>{});
  }
}

function normalize(s){
  return String(s).trim().toLowerCase().replace(/\s+/g," ");
}

function checkCurrent(){
  const topic=workbook[state.topic];
  const task=topic.tasks[state.task];
  let correct=false;

  if(task.type==="input"){
    const val=normalize(el("studentAnswer")?.value||"");
    correct=task.answer.some(a=>normalize(a)===val);
  }

  if(task.type==="choice"){
    const selected=document.querySelector('input[name="choice"]:checked');
    correct=selected && Number(selected.value)===task.answer;
  }

  if(task.type==="multi"){
    const selected=[...document.querySelectorAll('input[name="choice"]:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);
    correct=JSON.stringify(selected)===JSON.stringify([...task.answer].sort((a,b)=>a-b));
  }

  if(task.type==="sequence"){
    const vals=[...document.querySelectorAll('.seq-pos')].map(x=>Number(x.value));
    const expected=Array(task.options.length).fill(0); task.answer.forEach((optIndex,pos)=>expected[optIndex]=pos+1);
    correct=vals.every((v,i)=>v===expected[i]);
  }

  const fb=el("feedback");
  fb.className="feedback show " + (correct?"ok":"bad");
  fb.textContent=correct ? "Верно ✓" : "Неверно. Проверьте решение и попробуйте ещё раз.";

  if(correct){
    state.completed[topic.id+"_"+state.task]=true;
    updateProgress();
  }
}

function resetCurrent(){
  const task=workbook[state.topic].tasks[state.task];
  if(task.type==="input" && el("studentAnswer")) el("studentAnswer").value="";
  document.querySelectorAll('input[name="choice"]').forEach(x=>x.checked=false);
  document.querySelectorAll('.seq-pos').forEach(x=>x.value="");
  el("feedback").className="feedback";
  el("feedback").textContent="";
}

function nextTask(){
  const max=workbook[state.topic].tasks.length-1;
  if(state.task<max){
    state.task++;
    renderTaskNav();
    renderTask();
    renderMobileSelect();
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function updateProgress(){
  let total=0, done=0;
  workbook.forEach(t=>t.tasks.forEach((_,i)=>{
    total++;
    if(state.completed[t.id+"_"+i]) done++;
  }));
  el("progressText").textContent=`${done} из ${total}`;
  el("progressBar").style.width=(total?done/total*100:0)+"%";
}

function renderAll(){
  renderTabs();
  renderTaskNav();
  renderMobileSelect();
  renderTask();
  updateProgress();
}

/* Черновик на canvas */
const modal=el("scratchModal");
const canvas=el("scratchCanvas");
const ctx=canvas.getContext("2d");
let drawing=false,lastX=0,lastY=0,mode="pen";

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const old=ctx.getImageData(0,0,canvas.width||1,canvas.height||1);
  canvas.width=Math.max(1,Math.floor(rect.width*dpr));
  canvas.height=Math.max(1,Math.floor(rect.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap="round";
  ctx.lineJoin="round";
}

function point(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener("pointerdown",e=>{
  drawing=true;
  canvas.setPointerCapture(e.pointerId);
  const p=point(e); lastX=p.x; lastY=p.y;
});
canvas.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=point(e);
  ctx.save();
  if(mode==="eraser"){
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=18;
  } else {
    ctx.globalCompositeOperation="source-over";
    ctx.strokeStyle="#283126";
    ctx.lineWidth=2.5;
  }
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.restore();
  lastX=p.x;lastY=p.y;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));

el("scratchBtn").onclick=()=>{
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  setTimeout(resizeCanvas,50);
};
el("closeScratchBtn").onclick=()=>{
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
};
modal.addEventListener("click",e=>{if(e.target===modal) el("closeScratchBtn").click()});
el("penBtn").onclick=()=>mode="pen";
el("eraserBtn").onclick=()=>mode="eraser";
el("clearCanvasBtn").onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
window.addEventListener("resize",()=>{ if(modal.classList.contains("open")) resizeCanvas(); });

/* Кнопки */
el("checkBtn").onclick=checkCurrent;
el("resetBtn").onclick=resetCurrent;
el("nextBtn").onclick=nextTask;
el("mobileTaskSelect").onchange=e=>{
  state.task=Number(e.target.value);
  renderTaskNav();
  renderTask();
};

document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));

applyTheme(state.theme);
renderAll();
</script>
</body>
</html>
