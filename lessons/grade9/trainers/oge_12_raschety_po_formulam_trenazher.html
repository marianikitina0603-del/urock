<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ОГЭ №12 — Расчёты по формулам</title>
<style>
html,body{margin:0;padding:0;background:#f5f2e9}#trainerFrame{display:block;width:100%;border:0;min-height:900px;background:#f5f2e9}
</style>
</head>
<body>
<iframe id="trainerFrame" src="oge_12_raschety_po_formulam_trenazher_core.html" title="ОГЭ №12 — Расчёты по формулам"></iframe>
<script>
const frame=document.getElementById('trainerFrame');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!doc||doc.getElementById('scratchToggle')) return;
  const style=doc.createElement('style');
  style.textContent=`.scratchToggle{margin-top:14px}.scratchWrap{margin-top:14px;display:none}.scratchWrap.open{display:block}.scratchBar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.scratchHint{font-size:13px;color:var(--muted)}.scratchActions{display:flex;gap:8px;flex-wrap:wrap}.scratchCanvas{display:block;width:100%;height:260px;border:1px solid #b8c5bc;border-radius:12px;background-color:#fff;background-image:linear-gradient(#dfe8e0 1px,transparent 1px),linear-gradient(90deg,#dfe8e0 1px,transparent 1px);background-size:20px 20px;touch-action:none;cursor:crosshair}@media(max-width:650px){.scratchCanvas{height:220px}}@media print{.scratchToggle,.scratchWrap{display:none!important}}`;
  doc.head.appendChild(style);
  const answerRow=doc.querySelector('.answerRow');
  if(answerRow){
    const toggle=doc.createElement('button');toggle.type='button';toggle.id='scratchToggle';toggle.className='secondary scratchToggle';toggle.textContent='✎ Черновик';
    const wrap=doc.createElement('div');wrap.id='scratchWrap';wrap.className='scratchWrap';wrap.innerHTML='<div class="scratchBar"><span class="scratchHint">Пишите мышью или стилусом. Черновик расположен под заданием и ничего не перекрывает.</span><div class="scratchActions"><button type="button" class="secondary" id="scratchClear">Очистить</button><button type="button" class="secondary" id="scratchClose">Свернуть</button></div></div><canvas id="scratchCanvas" class="scratchCanvas" aria-label="Черновик для решения"></canvas>';
    answerRow.insertAdjacentElement('afterend',wrap);answerRow.insertAdjacentElement('afterend',toggle);
    const canvas=wrap.querySelector('#scratchCanvas'),ctx=canvas.getContext('2d');let drawing=false,lastX=0,lastY=0;
    function fit(){const r=canvas.getBoundingClientRect(),dpr=Math.max(1,win.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=2;ctx.strokeStyle='#273129'}
    function point(e){const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
    canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture?.(e.pointerId);[lastX,lastY]=point(e);e.preventDefault()});
    canvas.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=point(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();lastX=x;lastY=y;e.preventDefault()});
    ['pointerup','pointercancel'].forEach(type=>canvas.addEventListener(type,e=>{drawing=false;try{canvas.releasePointerCapture?.(e.pointerId)}catch{}}));
    toggle.addEventListener('click',()=>{wrap.classList.toggle('open');toggle.textContent=wrap.classList.contains('open')?'✎ Свернуть черновик':'✎ Черновик';if(wrap.classList.contains('open'))requestAnimationFrame(fit)});
    wrap.querySelector('#scratchClose').addEventListener('click',()=>{wrap.classList.remove('open');toggle.textContent='✎ Черновик'});
    wrap.querySelector('#scratchClear').addEventListener('click',()=>ctx.clearRect(0,0,canvas.width,canvas.height));
  }
  const syncHeight=()=>{frame.style.height=Math.max(900,doc.documentElement.scrollHeight+20)+'px'};
  syncHeight();
  new ResizeObserver(syncHeight).observe(doc.documentElement);
});
</script>
</body>
</html>
