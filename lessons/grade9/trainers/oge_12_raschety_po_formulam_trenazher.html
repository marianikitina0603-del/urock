const tasks=[{"id":"12.1.1","group":1,"title":"Стоимость колодца","html":"<p>В фирме «Родник» стоимость (в рублях) колодца из железобетонных колец рассчитывается по формуле</p><div class=\"formula\">C = 6000 + 4100n,</div><p>где <i>n</i> — число колец, установленных в колодце. Пользуясь этой формулой, рассчитайте стоимость колодца из <b>5</b> колец. Ответ дайте в рублях.</p>","answer":"26500"},{"id":"12.1.2","group":1,"title":"Стоимость колодца","html":"<p>В фирме «Родник» стоимость (в рублях) колодца из железобетонных колец рассчитывается по формуле</p><div class=\"formula\">C = 6000 + 4100n,</div><p>где <i>n</i> — число колец, установленных в колодце. Пользуясь этой формулой, рассчитайте стоимость колодца из <b>6</b> колец. Ответ дайте в рублях.</p>","answer":"30600"},{"id":"12.1.3","group":1,"title":"Стоимость колодца","html":"<p>В фирме «Родник» стоимость (в рублях) колодца из железобетонных колец рассчитывается по формуле</p><div class=\"formula\">C = 6000 + 4100n,</div><p>где <i>n</i> — число колец, установленных в колодце. Пользуясь этой формулой, рассчитайте стоимость колодца из <b>7</b> колец. Ответ дайте в рублях.</p>","answer":"34700"},{"id":"12.1.4","group":1,"title":"Стоимость колодца","html":"<p>В фирме «Родник» стоимость (в рублях) колодца из железобетонных колец рассчитывается по формуле</p><div class=\"formula\">C = 6000 + 4100n,</div><p>где <i>n</i> — число колец, установленных в колодце. Пользуясь этой формулой, рассчитайте стоимость колодца из <b>8</b> колец. Ответ дайте в рублях.</p>","answer":"38800"},{"id":"12.1.5","group":1,"title":"Стоимость колодца","html":"<p>В фирме «Родник» стоимость (в рублях) колодца из железобетонных колец рассчитывается по формуле</p><div class=\"formula\">C = 6000 + 4100n,</div><p>где <i>n</i> — число колец, установленных в колодце. Пользуясь этой формулой, рассчитайте стоимость колодца из <b>9</b> колец. Ответ дайте в рублях.</p>","answer":"42900"},{"id":"12.1.6","group":1,"title":"Стоимость колодца","html":"<p>В ф const $=s=>document.querySelector(s); let current=null,attempts=0,correct=0,streak=0,lastId=null;
function pool(group, source=tasks){return group==='all'?source:source.filter(t=>String(t.group)===String(group));}
function randomTask(){const p=pool($('#topic').value); if(!p.length)return; let t=p[Math.floor(Math.random()*p.length)]; if(p.length>1&&t.id===lastId)t=p[(p.indexOf(t)+1)%p.length]; current=t;lastId=t.id; $('#taskId').textContent='Аналог '+t.id;$('#taskTopic').textContent=t.title;$('#taskText').innerHTML=t.html;$('#answer').value='';$('#feedback').textContent='';$('#feedback').className='feedback';$('#answer').focus();}
function parse(v){v=(v||'').trim().replace(/\s/g,'').replace(',','.');if(!v)return NaN;return Number(v)}
function check(){if(!current)return; const user=parse($('#answer').value), right=parse(current.answer);if(!Number.isFinite(user)){$('#feedback').textContent='Введите числовой ответ.';$('#feedback').className='feedback bad';return} attempts++;const ok=Math.abs(user-right)<=Math.max(1e-8,Math.abs(right)*1e-9); if(ok){correct++;streak++;$('#feedback').textContent='Верно!';$('#feedback').className='feedback good'}else{streak=0;$('#feedback').textContent='Пока неверно. Проверьте подстановку и вычисления.';$('#feedback').className='feedback bad'}updateStats();}
function updateStats(){$('#attempts').textContent=attempts;$('#correct').textContent=correct;$('#streak').textContent=streak}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateHw(){let count=Math.max(1,Math.min(60,parseInt($('#hwCount').value)||8));let p=shuffle(pool($('#hwTopic').value));count=Math.min(count,p.length);const chosen=p.slice(0,count);$('#hwList').innerHTML=chosen.map((t,i)=>`<article class="hwTask"><div class="num">${i+1}. <span style="font-weight:400;color:#68736b">Аналог ${t.id}</span></div><div class="taskText" style="min-height:0">${t.html}</div><div class="solveBox" aria-label="Поле для решения"></div></article>`).join('');$('#keyGrid').innerHTML=chosen.map((t,i)=>`<div class="keyItem"><b>${i+1}.</b> ${t.answer}</div>`).join('')}
$('#newTask').addEventListener('click',randomTask);$('#topic').addEventListener('change',randomTask);$('#check').addEventListener('click',check);$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('#reveal').addEventListener('click',()=>{if(current){$('#feedback').textContent='Ответ: '+current.answer;$('#feedback').className='feedback'}});$('#generateHw').addEventListener('click',generateHw);$('#printHw').addEventListener('click',()=>window.print());
$('#showTrainer').addEventListener('click',()=>{$('#trainerPanel').style.display='block';$('#homework').classList.remove('show')});$('#showHw').addEventListener('click',()=>{$('#trainerPanel').style.display='none';$('#homework').classList.add('show')});
randomTask();
</script></body></html>
