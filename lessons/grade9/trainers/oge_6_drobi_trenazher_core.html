<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОГЭ №6 — Дроби</title><style>
:root{--bg:#f5f2e9;--p:#fffdf7;--i:#273129;--m:#68736b;--g:#526b58;--go:#b9974b;--l:#d8d3c5;--bad:#a44b46;--good:#356b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px/1.55 Inter,Segoe UI,Arial,sans-serif}.w{max-width:980px;margin:auto;padding:22px}h1{font:700 clamp(26px,4vw,40px) Georgia,serif;margin:0}.sub,.topic,label{color:var(--m)}.tabs,.bar,.stats,.hwc,.scratchBar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.tabs{margin:14px 0}button{border:1px solid var(--g);background:var(--g);color:#fff;border-radius:10px;padding:10px 15px;font-size:15px;cursor:pointer}.secondary{background:transparent;color:var(--g)}.gold{background:var(--go);border-color:var(--go);color:#1d1b15}.panel{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:20px}.bar{justify-content:space-between;margin-bottom:16px}.bar label{min-width:260px}select,input{width:100%;margin-top:5px;border:1px solid #bfc5bd;border-radius:10px;padding:11px 12px;font:inherit}.head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--l);padding-bottom:10px}.badge{font-weight:700;color:var(--g)}.task{font:18px Georgia,serif;min-height:190px}.formula{text-align:center;font:26px 'Times New Roman',serif;margin:18px 0}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 4px}.frac span:first-child{border-bottom:1px solid;padding:0 5px 2px}.ans{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:8px;align-items:end}.fb{min-height:28px;margin-top:10px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}.stats{color:var(--m);font-size:14px;margin-top:14px}.hw{display:none}.hw.show{display:block}.hwc{margin-bottom:12px}.hwc label{width:190px}.hwt{background:#fff;border:1px solid var(--l);border-radius:12px;padding:16px;margin:12px 0;break-inside:avoid}.box{height:125px;margin-top:14px;border:1px solid #b8c5bc;background-image:linear-gradient(#dfe8e0 1px,transparent 1px),linear-gradient(90deg,#dfe8e0 1px,transparent 1px);background-size:20px 20px;position:relative}.box:after{content:'Ответ: ____________________';position:absolute;left:8px;bottom:6px;background:#fff;padding:1px 5px}.key{display:none}.scratch{display:none;margin-top:12px}.scratch.open{display:block}.scratchBar{justify-content:space-between;margin-bottom:8px}.scratch canvas{width:100%;height:250px;border:1px solid #b8c5bc;border-radius:12px;background-color:#fff;background-image:linear-gradient(#dfe8e0 1px,transparent 1px),linear-gradient(90deg,#dfe8e0 1px,transparent 1px);background-size:20px 20px;touch-action:none}@media(max-width:650px){.ans{grid-template-columns:1fr}.task{min-height:0}}@media print{header,.tabs,#trainer,.hwc{display:none!important}.hw{display:block!important}.panel{border:0;padding:0}.hwt{border:0;border-bottom:1px solid #aaa;border-radius:0}.box{height:42mm;background-size:5mm 5mm}.key{display:block!important;break-before:page;page-break-before:always}.keyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm 10mm}@page{size:A4;margin:12mm}}
</style></head><body><div class="w"><header><h1>ОГЭ №6 · Дроби</h1><div class="sub">85 заданий · страницы 267–280 открытого банка</div></header><div class="tabs"><button id="st">Тренажёр</button><button id="sh" class="secondary">Домашнее задание</button></div><section id="trainer" class="panel"><div class="bar"><label>Тип заданий<select id="topic"><option value="all">Все типы</option><option value="1">6.1 · сложение десятичных дробей</option><option value="2">6.2 · вычитание десятичных дробей</option><option value="3">6.3 · умножение десятичных дробей</option><option value="4">6.4 · деление десятичных дробей</option><option value="5">6.5 · сложение обыкновенных дробей</option><option value="6">6.6 · вычитание обыкновенных дробей</option><option value="7">6.7 · умножение обыкновенных дробей</option><option value="8">6.8 · деление обыкновенных дробей</option><option value="9">6.9 · заданный знаменатель</option><option value="10">6.10 · разные знаменатели</option></select></label><button id="new" class="secondary">↻ Новое задание</button></div><div class="head"><div><div id="id" class="badge"></div><div id="ttl" class="topic"></div></div><div class="topic">Ответ — число или дробь</div></div><div id="task" class="task"></div><div class="ans"><label>Ваш ответ<input id="answer" placeholder="Например: 2,5 или 5/2"></label><button id="check">Проверить</button><button id="reveal" class="secondary">Показать ответ</button></div><button id="scratchBtn" class="secondary" style="margin-top:12px">✎ Черновик</button><div id="scratch" class="scratch"><div class="scratchBar"><span class="topic">Пишите мышью или стилусом.</span><div><button id="clear" class="secondary">Очистить</button> <button id="close" class="secondary">Свернуть</button></div></div><canvas id="cv"></canvas></div><div id="fb" class="fb"></div><div class="stats"><span>Решено: <b id="a">0</b></span><span>Верно: <b id="c">0</b></span><span>Серия: <b id="s">0</b></span></div></section><section id="hw" class="hw panel"><div class="hwc"><label>Количество заданий<input id="cnt" type="number" min="1" max="85" value="10"></label><label>Тип<select id="ht"><option value="all">Все типы</option><option value="1">6.1</option><option value="2">6.2</option><option value="3">6.3</option><option value="4">6.4</option><option value="5">6.5</option><option value="6">6.6</option><option value="7">6.7</option><option value="8">6.8</option><option value="9">6.9</option><option value="10">6.10</option></select></label><button id="gen" class="gold">Сгенерировать</button><button id="print" class="secondary">Печать</button></div><div id="list"><div class="topic">Задайте количество и нажмите «Сгенерировать».</div></div><section class="key"><h2>Ключ к домашней работе</h2><div id="keys" class="keyGrid"></div></section></section></div><script>
const D=[['6,8','2,6'],['6,9','7,4'],['7,9','2,2'],['8,3','5,4'],['8,4','3,7'],['8,7','4,6'],['8,8','5,9'],['9,3','7,8'],['9,8','8,6']],E=[['4,9','9,4'],['3,6','4,1'],['3,9','7,3'],['4,4','1,7'],['4,7','8,2'],['5,7','7,6'],['6,1','2,5'],['6,4','4,8'],['9,2','2,4']],M=[['1,6','5,1'],['2,1','9,6'],['2,3','7,5'],['3,2','6,2'],['6,7','5,5'],['7,7','5,3'],['8,1','7,2'],['8,9','4,3'],['9,9','7,1']],Q=[['4,8','0,4'],['8,4','1,2'],['6,8','1,7'],['8,7','2,9'],['8,2','4,1'],['9,6','1,2'],['13,2','1,2'],['8,1','0,9'],['6,5','1,3']];
const F5=[[[1,2],[31,20]],[[1,2],[33,50]],[[1,4],[37,20]],[[1,5],[17,10]],[[1,5],[19,20]],[[1,5],[53,50]],[[1,10],[29,20]],[[1,10],[21,50]],[[1,25],[43,50]]],F6=[[[1,2],[49,20]],[[1,2],[13,50]],[[1,4],[51,20]],[[1,5],[47,10]],[[1,5],[41,50]],[[1,5],[27,20]],[[1,10],[39,50]],[[1,10],[23,20]],[[1,25],[7,50]]],F7=[[[5,3],[9,2]],[[3,4],[6,5]],[[15,4],[6,5]],[[2,5],[9,8]],[[3,5],[25,4]],[[7,5],[12,35]],[[9,5],[2,3]],[[21,5],[3,7]],[[7,6],[9,5]]],F8=[[[15,4],[3,7]],[[3,5],[2,15]],[[3,5],[4,35]],[[4,5],[2,7]],[[6,5],[4,11]],[[12,5],[15,2]],[[14,5],[7,2]],[[21,5],[6,7]],[[7,8],[5,6]]],F9=[[[1,7],[3,4],56,'+'],[[2,3],[7,13],78,'-'],[[3,4],[8,11],88,'-'],[[5,8],[1,3],48,'+'],[[6,7],[3,5],70,'-'],[[7,9],[2,5],90,'-']],F10=[[[1,28],[1,12],'+'],[[1,36],[1,45],'+'],[[1,21],[1,28],'+'],[[1,14],[1,63],'-'],[[1,36],[1,44],'-'],[[1,35],[1,60],'-'],[[1,72],[1,99],'-']];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),fr=(n,d)=>{let g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return[n,d]},fh=x=>`<span class="frac"><span>${x[0]}</span><span>${x[1]}</span></span>`,fs=x=>x[1]==1?''+x[0]:x[0]+'/'+x[1],num=x=>+x.replace(',','.'),dc=x=>String(Math.round(x*1e12)/1e12).replace('.',',');let T=[];function add(g,i,title,html,ans){T.push({id:`6.${g}.${i}`,g,title,html,ans})}D.forEach((x,i)=>add(1,i+1,'Сложение десятичных дробей',`<p>Найдите значение выражения</p><div class="formula">${x[0]} + ${x[1]}</div>`,dc(num(x[0])+num(x[1]))));E.forEach((x,i)=>add(2,i+1,'Вычитание десятичных дробей',`<p>Найдите значение выражения</p><div class="formula">${x[0]} − ${x[1]}</div>`,dc(num(x[0])-num(x[1]))));M.forEach((x,i)=>add(3,i+1,'Умножение десятичных дробей',`<p>Найдите значение выражения</p><div class="formula">${x[0]} · ${x[1]}</div>`,dc(num(x[0])*num(x[1]))));Q.forEach((x,i)=>add(4,i+1,'Деление десятичных дробей',`<p>Найдите значение выражения</p><div class="formula"><span class="frac"><span>${x[0]}</span><span>${x[1]}</span></span></div>`,dc(num(x[0])/num(x[1]))));
function op(a,b,s){let n=s=='+'?a[0]*b[1]+b[0]*a[1]:s=='-'?a[0]*b[1]-b[0]*a[1]:s=='*'?a[0]*b[0]:a[0]*b[1],d=s=='*'?a[1]*b[1]:s=='/'?a[1]*b[0]:a[1]*b[1];return fr(n,d)}F5.forEach((x,i)=>add(5,i+1,'Сложение обыкновенных дробей',`<p>Найдите значение выражения</p><div class="formula">${fh(x[0])} + ${fh(x[1])}</div>`,fs(op(x[0],x[1],'+'))));F6.forEach((x,i)=>add(6,i+1,'Вычитание обыкновенных дробей',`<p>Найдите значение выражения</p><div class="formula">${fh(x[0])} − ${fh(x[1])}</div>`,fs(op(x[0],x[1],'-'))));F7.forEach((x,i)=>add(7,i+1,'Умножение обыкновенных дробей',`<p>Найдите значение выражения</p><div class="formula">${fh(x[0])} · ${fh(x[1])}</div>`,fs(op(x[0],x[1],'*'))));F8.forEach((x,i)=>add(8,i+1,'Деление обыкновенных дробей',`<p>Найдите значение выражения</p><div class="formula">${fh(x[0])} : ${fh(x[1])}</div>`,fs(op(x[0],x[1],'/'))));F9.forEach((x,i)=>{let r=op(x[0],x[1],x[3]),n=r[0]*x[2]/r[1];add(9,i+1,'Дробь с заданным знаменателем',`<p>Представьте выражение</p><div class="formula">${fh(x[0])} ${x[3]} ${fh(x[1])}</div><p>в виде дроби со знаменателем <b>${x[2]}</b>. В ответ запишите числитель.</p>`,String(n))});F10.forEach((x,i)=>add(10,i+1,'Дроби с разными знаменателями',`<p>Найдите значение выражения</p><div class="formula">${fh(x[0])} ${x[2]} ${fh(x[1])}</div>`,fs(op(x[0],x[1],x[2]))));
const $=x=>document.getElementById(x);let cur=null,A=0,C=0,S=0,HW=[];const pool=g=>g=='all'?T:T.filter(t=>''+t.g==g),pick=g=>{let p=pool(g),q=p.length>1?p.filter(t=>!cur||t.id!=cur.id):p;return q[Math.floor(Math.random()*q.length)]};function show(){cur=pick($('topic').value);$('id').textContent='Задание '+cur.id;$('ttl').textContent=cur.title;$('task').innerHTML=cur.html;$('answer').value='';$('fb').textContent='';$('fb').className='fb'}function pv(s){s=s.trim().replace(/\s/g,'').replace(',','.');if(s.includes('/')){let[a,b]=s.split('/').map(Number);return b?a/b:NaN}return Number(s)}function chk(){let u=$('answer').value;if(!u)return;$('a').textContent=++A;if(Math.abs(pv(u)-pv(cur.ans))<1e-9){$('c').textContent=++C;$('s').textContent=++S;$('fb').textContent='Верно!';$('fb').className='fb good'}else{$('s').textContent=S=0;$('fb').textContent='Пока неверно. Проверьте вычисления.';$('fb').className='fb bad'}}$('new').onclick=show;$('topic').onchange=()=>{cur=null;show()};$('check').onclick=chk;$('answer').onkeydown=e=>e.key=='Enter'&&chk();$('reveal').onclick=()=>{$('fb').textContent='Ответ: '+cur.ans;$('fb').className='fb'};$('st').onclick=()=>{$('trainer').style.display='block';$('hw').classList.remove('show')};$('sh').onclick=()=>{$('trainer').style.display='none';$('hw').classList.add('show')};function shuf(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}$('gen').onclick=()=>{let p=shuf(pool($('ht').value)),n=Math.min(Math.max(1,+$('cnt').value||1),p.length);HW=p.slice(0,n);$('list').innerHTML=HW.map((t,i)=>`<div class="hwt"><b>${i+1}. <span class="topic">(${t.id})</span></b>${t.html}<div class="box"></div></div>`).join('');$('keys').innerHTML=HW.map((t,i)=>`<div>${i+1}. ${t.ans}</div>`).join('')};$('print').onclick=()=>{if(!HW.length)$('gen').click();print()};
let cv=$('cv'),cx=cv.getContext('2d'),dr=0,lx=0,ly=0;function fit(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);cx.lineWidth=2;cx.lineCap='round';cx.strokeStyle='#273129'}function pt(e){let r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}cv.onpointerdown=e=>{dr=1;[lx,ly]=pt(e);cv.setPointerCapture?.(e.pointerId)};cv.onpointermove=e=>{if(!dr)return;let[x,y]=pt(e);cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(x,y);cx.stroke();lx=x;ly=y};cv.onpointerup=cv.onpointercancel=()=>dr=0;$('scratchBtn').onclick=()=>{$('scratch').classList.toggle('open');if($('scratch').classList.contains('open'))requestAnimationFrame(fit)};$('clear').onclick=()=>cx.clearRect(0,0,cv.width,cv.height);$('close').onclick=()=>$('scratch').classList.remove('open');show();
</script></body></html>
