<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алгебраические дроби. Преобразование рациональных выражений</title>
<script>
window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f7f4ea;--surface:#fffdf7;--surface2:#f1f5e7;--text:#263125;--muted:#697468;--primary:#6c8a52;--primary2:#89a46d;--soft:#e7eedc;--border:#cbd6bc;--danger:#b55d54;--success:#4e7f53;--shadow:0 8px 24px rgba(45,60,35,.08);--radius:16px}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#fff 70%);color:var(--text)}
button,input,textarea{font:inherit}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);box-shadow:0 3px 15px rgba(0,0,0,.04)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}.tab{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px 14px;font-weight:800;color:var(--text);white-space:nowrap}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.progress-wrap{padding:0 14px 10px;display:flex;gap:10px;align-items:center}.progress{height:8px;background:#e4e8dd;border-radius:999px;overflow:hidden;flex:1}.progress>div{height:100%;background:var(--primary);width:0}.progress-text{font-size:.86rem;color:var(--muted);font-weight:700}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;width:min(1500px,100%);margin:auto;padding:18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.sidebar{position:sticky;top:100px;align-self:start;max-height:calc(100vh - 118px);overflow:auto}.side-title{padding:14px 16px;font-weight:900;color:var(--primary);border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--soft))}.nav{padding:8px}.nav button{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:10px;padding:10px;text-align:left;font-weight:700;color:var(--text);cursor:pointer}.nav button:hover{background:var(--soft)}.nav button.active{background:var(--primary);color:#fff}.num{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(108,138,82,.12);color:var(--primary);flex:0 0 auto}.nav button.active .num{background:rgba(255,255,255,.18);color:#fff}
.main{min-width:0}.screen{display:none}.screen.active{display:block}.hero{padding:22px}.hero h1{margin:0 0 8px;color:var(--primary);font-size:clamp(1.5rem,2.6vw,2.25rem)}.hero p{margin:.45rem 0;color:var(--muted);line-height:1.55}
.theory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.theory{padding:16px;border-radius:14px;background:var(--soft);border:1px solid var(--border);line-height:1.55}.theory strong{color:var(--primary);display:block;margin-bottom:6px}.warn{padding:12px 14px;border-left:4px solid var(--primary);background:var(--surface2);border-radius:10px;margin-top:14px}
.task{padding:22px}.task-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.task h2{margin:0;color:var(--primary)}.badge{font-size:.8rem;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:900;white-space:nowrap}.question{font-size:1.12rem;line-height:1.65;margin:18px 0}.source{font-size:.82rem;color:var(--muted);margin-top:8px}.answer-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}.answer-row input{min-width:220px;flex:1;border:2px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer;background:var(--primary);color:#fff}.btn.soft{background:var(--soft);color:var(--primary);border:1px solid var(--border)}.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border)}.feedback{min-height:26px;margin-top:10px;font-weight:800}.ok{color:var(--success)}.bad{color:var(--danger)}
.hint{display:none;margin-top:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;line-height:1.5}.hint.show{display:block}.solution{display:none;margin-top:14px;padding:15px;background:#fff;border:1px solid var(--border);border-radius:12px;line-height:1.6}.solution.show{display:block}
.second-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,44%);gap:18px;align-items:start}.problem-pane{min-width:0}.scratch{position:sticky;top:112px;padding:14px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.scratch-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.scratch-head strong{color:var(--primary);margin-right:auto}.canvas-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background-color:#fff;background-image:linear-gradient(#e7eadf 1px,transparent 1px),linear-gradient(90deg,#e7eadf 1px,transparent 1px);background-size:22px 22px}.scratch canvas{display:block;width:100%;height:560px;touch-action:none}.scratch-note{font-size:.8rem;color:var(--muted);margin-top:8px}.second-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.stats{padding:22px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;text-align:center;background:var(--soft);border:1px solid var(--border);border-radius:14px}.stat b{display:block;font-size:1.8rem;color:var(--primary)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;max-height:none}.nav{display:flex;overflow-x:auto}.nav button{min-width:150px}.theory-grid{grid-template-columns:1fr}.second-wrap{grid-template-columns:1fr}.scratch{position:relative;top:0}.scratch canvas{height:430px}}
@media(max-width:600px){.layout{padding:10px}.task,.hero,.stats{padding:16px}.stats-grid{grid-template-columns:repeat(2,1fr)}.scratch canvas{height:360px}}
@media print{.topbar,.sidebar,.answer-row,.second-actions,.scratch-head button,.feedback,.hint,.solution{display:none!important}.layout{display:block;padding:0}.card{box-shadow:none;border:0}.screen{display:block!important;page-break-after:always}.screen[data-kind="theory"],.screen[data-kind="stats"]{display:none!important}.task{padding:10mm}.second-wrap{display:block}.scratch{position:relative;top:0;margin-top:10mm;border:1px solid #aaa;box-shadow:none}.scratch canvas{height:150mm}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tabs">
    <button class="tab active" data-group="theory">Теория</button>
    <button class="tab" data-group="basic">Преобразования</button>
    <button class="tab" data-group="relations">Отношения</button>
    <button class="tab" data-group="part2">2 часть</button>
    <button class="tab" data-group="stats">Итоги</button>
  </div>
  <div class="progress-wrap"><div class="progress"><div id="progressBar"></div></div><span class="progress-text" id="progressText">0 / 12 проверено</span></div>
</div>
<div class="layout">
  <aside class="sidebar card"><div class="side-title">Задания</div><div class="nav" id="taskNav"></div></aside>
  <main class="main" id="main"></main>
</div>
<script>
const tasks=[
{id:1,group:'basic',title:'Сокращение дроби',q:String.raw`Найдите значение выражения $$\frac{9x^2-4}{3x+2}-3x.$$`,ans:'-2',src:'№7, преобразование выражений'},
{id:2,group:'basic',title:'Сокращение дроби',q:String.raw`Найдите значение выражения $$\frac{9x^2-49}{3x+7}-3x.$$`,ans:'-7',src:'№7, преобразование выражений'},
{id:3,group:'basic',title:'Вынесение общего множителя',q:String.raw`Найдите значение выражения $$\frac{(11a)^2-11a}{11a^2-a}.$$`,ans:'11',src:'№7, преобразование выражений'},
{id:4,group:'basic',title:'Вынесение общего множителя',q:String.raw`Найдите значение выражения $$\frac{(17a)^2-17a}{17a^2-a}.$$`,ans:'17',src:'№7, преобразование выражений'},
{id:5,group:'basic',title:'Разность алгебраических дробей',q:String.raw`Найдите значение выражения $$\left(25a^2-16\right)\left(\frac1{5a+4}-\frac1{5a-4}\right).$$`,ans:'-8',src:'№7, преобразование выражений'},
{id:6,group:'basic',title:'Разность алгебраических дробей',q:String.raw`Найдите значение выражения $$\left(49a^2-1\right)\left(\frac1{7a-1}-\frac1{7a+1}\right).$$`,ans:'2',src:'№7, преобразование выражений'},
{id:7,group:'relations',title:'Отношение переменных',q:String.raw`Найдите $\frac ab$, если $$\frac{2a+5b}{5a+2b}=1.$$`,ans:'1',src:'№7, выражения по условию'},
{id:8,group:'relations',title:'Отношение переменных',q:String.raw`Найдите $\frac ab$, если $$\frac{3a+6b}{3b+6a}=3.$$`,ans:'-0.2',alts:['-1/5','-0,2'],src:'№7, выражения по условию'},
{id:9,group:'relations',title:'Подстановка отношения',q:String.raw`Найдите $$\frac{a+9b+16}{a+3b+8},$$ если $\frac ab=3$.`,ans:'2',src:'№7, выражения по условию'},
{id:10,group:'relations',title:'Подстановка отношения',q:String.raw`Найдите $$\frac{a+5b+18}{a+b+9},$$ если $\frac ab=3$.`,ans:'2',src:'№7, выражения по условию'},
{id:11,group:'basic',title:'Преобразование и подстановка',q:String.raw`Найдите значение выражения при $b=65$: $$\left(49b^2-36\right)\left(\frac1{7b-6}-\frac1{7b+6}\right)-2b+15.$$`,ans:'-103',src:'№7, преобразование выражений'},
{id:12,group:'basic',title:'Преобразование и подстановка',q:String.raw`Найдите значение выражения при $a=22{,}8$: $$a\left(81a^2-64\right)\left(\frac1{9a+8}-\frac1{9a-8}\right).$$`,ans:'-364.8',alts:['-364,8'],src:'№7, преобразование выражений'},
{id:13,group:'part2',title:'Рациональное уравнение',part2:true,q:String.raw`<b>а)</b> Решите уравнение $$\frac{(x+3)^2}{5}+\frac{20}{(x+3)^2}=8\left(\frac{x+3}{5}-\frac{2}{x+3}\right)+1.$$ <b>б)</b> Найдите его корни, принадлежащие отрезку $[-6;-4]$.`,src:'Задание 13, блок «Рациональные»',hints:[String.raw`Начните с ОДЗ: $x\ne -3$. Затем перенесите всё в одну сторону.`,String.raw`После приведения к общему знаменателю выражение раскладывается на множители.`,String.raw`Получается дробь, числитель которой содержит множители $(x-2)(x+5)(x^2+x-16)$.`],sol:String.raw`ОДЗ: $x\ne-3$. После переноса и упрощения: $$\frac{(x-2)(x+5)(x^2+x-16)}{5(x+3)^2}=0.$$ Поэтому $$x=2,\quad x=-5,\quad x=\frac{-1\pm\sqrt{65}}2.$$ На отрезке $[-6;-4]$ лежат $$-5\quad\text{и}\quad\frac{-1-\sqrt{65}}2.$$`},
{id:14,group:'part2',title:'Рациональное неравенство',part2:true,q:String.raw`Решите неравенство $$x+\frac{20}{x+6}\ge 6.$$`,src:'Задание 15, «Рациональные неравенства», №1',hints:[String.raw`ОДЗ: $x\ne-6$. Перенесите $6$ влево.`,String.raw`Приведите выражение к одной дроби со знаменателем $x+6$.`,String.raw`Числитель раскладывается: $(x-4)(x+4)$.`],sol:String.raw`$$x+\frac{20}{x+6}-6=\frac{(x-4)(x+4)}{x+6}.$$ Метод интервалов даёт $$x\in(-6;-4]\cup[4;+\infty).$$`},
{id:15,group:'part2',title:'Рациональное неравенство',part2:true,q:String.raw`Решите неравенство $$\frac{x^3-13x^2+44x-30}{x^2-11x+30}\ge x-1.$$`,src:'Задание 15, «Рациональные неравенства», №2',hints:[String.raw`ОДЗ: $x\ne5$, $x\ne6$. Перенесите $x-1$ влево.`,String.raw`Общий знаменатель: $(x-5)(x-6)$.`,String.raw`После упрощения получается $\frac{-x(x-3)}{(x-5)(x-6)}\ge0$.`],sol:String.raw`$$\frac{x^3-13x^2+44x-30}{x^2-11x+30}-(x-1)=\frac{-x(x-3)}{(x-5)(x-6)}.$$ Учитывая ОДЗ и знаки на интервалах: $$x\in[0;3]\cup(5;6).$$`},
{id:16,group:'part2',title:'Рациональное неравенство',part2:true,q:String.raw`Решите неравенство $$\frac{x^2-2x-1}{x-2}+\frac{2}{x-3}\le x.$$`,src:'Задание 15, «Рациональные неравенства», №3',hints:[String.raw`ОДЗ: $x\ne2$, $x\ne3$. Перенесите $x$ влево.`,String.raw`Приведите три слагаемых к общему знаменателю $(x-2)(x-3)$.`,String.raw`После сокращения получается $\frac{x-1}{(x-2)(x-3)}\le0$.`],sol:String.raw`После приведения к общему знаменателю: $$\frac{x-1}{(x-2)(x-3)}\le0.$$ По методу интервалов $$x\in(-\infty;1]\cup(2;3).$$`}
];
const groupNames={basic:'Преобразования',relations:'Отношения',part2:'2 часть'};
let state=JSON.parse(localStorage.getItem('ratfrac-state')||'{}'); if(!state.checked)state.checked={}; if(!state.wrong)state.wrong={};
const main=document.getElementById('main'),nav=document.getElementById('taskNav');
function theoryScreen(){return String.raw`<section class="screen card active" data-kind="theory" data-group="theory" id="theory"><div class="hero"><h1>Алгебраические дроби. Преобразование рациональных выражений</h1><p>Цель занятия: уверенно сокращать алгебраические дроби, приводить к общему знаменателю, использовать разложение на множители и применять эти преобразования в уравнениях и неравенствах.</p><div class="theory-grid"><div class="theory"><strong>1. ОДЗ</strong>Перед сокращением или умножением на знаменатель выпишите ограничения: знаменатель не равен нулю.</div><div class="theory"><strong>2. Сокращение</strong>Сокращать можно только <em>множители</em>. Сначала разложите числитель и знаменатель на множители.</div><div class="theory"><strong>3. Общий знаменатель</strong>При сложении и вычитании дробей найдите НОЗ, домножьте каждый числитель и только затем объединяйте дроби.</div><div class="theory"><strong>4. Метод интервалов</strong>Для рационального неравенства перенесите всё в одну сторону, получите одну дробь, разложите на множители и отметьте нули числителя и знаменателя.</div></div><div class="warn"><b>Типичная ошибка:</b> сокращать слагаемые, например в $\frac{x+2}{x}$ «сокращать $x$» нельзя.</div></div></section>`}
function taskScreen(t){if(t.part2)return secondScreen(t);return `<section class="screen card" data-kind="task" data-group="${t.group}" id="task${t.id}"><div class="task"><div class="task-head"><div><h2>Задание ${t.id}</h2><div class="source">${t.src}</div></div><span class="badge">${groupNames[t.group]}</span></div><div class="question">${t.q}</div><div class="answer-row"><label for="a${t.id}">Ответ:</label><input id="a${t.id}" inputmode="decimal" autocomplete="off" value="${state['a'+t.id]||''}"><button class="btn" onclick="check(${t.id})">Проверить</button><button class="btn soft" onclick="document.getElementById('a${t.id}').value=''">Очистить</button></div><div class="feedback" id="f${t.id}"></div></div></section>`}
function secondScreen(t){return `<section class="screen card" data-kind="task" data-group="part2" id="task${t.id}"><div class="task"><div class="task-head"><div><h2>Задание ${t.id}</h2><div class="source">${t.src}</div></div><span class="badge">Развёрнутое решение</span></div><div class="second-wrap"><div class="problem-pane"><div class="question">${t.q}</div><div class="second-actions"><button class="btn soft" onclick="nextHint(${t.id})">Подсказка</button><button class="btn ghost" onclick="toggleSolution(${t.id})">Показать ответ и решение</button><button class="btn" onclick="markDone(${t.id})">Отметить выполненным</button></div><div class="hint" id="hint${t.id}"></div><div class="solution" id="sol${t.id}">${t.sol}</div><p class="scratch-note">Для заданий 2 части автоматическая проверка свободной записи не используется.</p></div><div class="scratch"><div class="scratch-head"><strong>Черновик</strong><button class="btn soft" onclick="setTool(${t.id},'pen')">Ручка</button><button class="btn soft" onclick="setTool(${t.id},'eraser')">Ластик</button><button class="btn ghost" onclick="undoCanvas(${t.id})">↶</button><button class="btn ghost" onclick="clearCanvas(${t.id})">Очистить</button></div><div class="canvas-wrap"><canvas id="canvas${t.id}"></canvas></div><div class="scratch-note">Черновик расположен рядом с условием и не перекрывает его. На планшете рисование не прокручивает страницу.</div></div></div></div></section>`}
function statsScreen(){return `<section class="screen card" data-kind="stats" data-group="stats" id="stats"><div class="stats"><h2 style="color:var(--primary);margin-top:0">Итоги</h2><div class="stats-grid"><div class="stat"><b id="sDone">0</b>выполнено</div><div class="stat"><b id="sCorrect">0</b>верно</div><div class="stat"><b id="sWrong">0</b>неверных попыток</div><div class="stat"><b id="sPct">0%</b>результат</div></div></div></section>`}
main.innerHTML=theoryScreen()+tasks.map(taskScreen).join('')+statsScreen();
function typesetAllWhenReady(){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([main]).catch(()=>{});
  }else{
    setTimeout(typesetAllWhenReady,120);
  }
}
typesetAllWhenReady();
nav.innerHTML=`<button data-target="theory" class="active"><span class="num">T</span>Теория</button>`+tasks.map(t=>`<button data-target="task${t.id}"><span class="num">${t.id}</span>${t.title}</button>`).join('')+`<button data-target="stats"><span class="num">Σ</span>Итоги</button>`;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.target===id));let group=id==='theory'?'theory':id==='stats'?'stats':tasks.find(t=>'task'+t.id===id).group;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.group===group));if(id.startsWith('task')){const t=tasks.find(t=>'task'+t.id===id);if(t.part2)setTimeout(()=>initCanvas(t.id),40)}window.scrollTo({top:0,behavior:'smooth'})}
nav.onclick=e=>{const b=e.target.closest('button[data-target]');if(b)show(b.dataset.target)};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;const g=b.dataset.group;if(g==='theory'||g==='stats')show(g);else{const t=tasks.find(x=>x.group===g);if(t)show('task'+t.id)}};
function norm(v){return v.trim().replace(',','.').replace(/\s+/g,'')}
function check(id){const t=tasks.find(x=>x.id===id),inp=document.getElementById('a'+id),f=document.getElementById('f'+id);state['a'+id]=inp.value;const v=norm(inp.value);let good=norm(t.ans)===v||(t.alts||[]).some(a=>norm(a)===v);if(good){f.textContent='Верно ✓';f.className='feedback ok';state.checked[id]=true}else{f.textContent='Пока неверно. Проверь вычисления.';f.className='feedback bad';state.wrong[id]=(state.wrong[id]||0)+1}save();updateStats()}
function markDone(id){state.checked[id]=true;save();updateStats();const b=[...document.querySelectorAll('.nav button')].find(x=>x.dataset.target==='task'+id);if(b)b.style.boxShadow='inset 4px 0 0 var(--success)'}
const hintStep={};function nextHint(id){const t=tasks.find(x=>x.id===id),box=document.getElementById('hint'+id);hintStep[id]=Math.min((hintStep[id]||0)+1,t.hints.length);box.innerHTML='<b>Подсказка '+hintStep[id]+':</b> '+t.hints[hintStep[id]-1];box.classList.add('show');if(window.MathJax)MathJax.typesetPromise([box])}
function toggleSolution(id){const el=document.getElementById('sol'+id);el.classList.toggle('show');if(el.classList.contains('show')&&window.MathJax)MathJax.typesetPromise([el])}
function save(){localStorage.setItem('ratfrac-state',JSON.stringify(state))}
function updateStats(){const checked=Object.keys(state.checked).filter(k=>state.checked[k]).length;const first=tasks.filter(t=>!t.part2),correct=first.filter(t=>state.checked[t.id]).length;const wrong=Object.values(state.wrong).reduce((a,b)=>a+(+b||0),0);const pct=first.length?Math.round(correct/first.length*100):0;document.getElementById('progressBar').style.width=Math.min(100,correct/first.length*100)+'%';document.getElementById('progressText').textContent=`${correct} / ${first.length} проверено`;document.getElementById('sDone').textContent=checked;document.getElementById('sCorrect').textContent=correct;document.getElementById('sWrong').textContent=wrong;document.getElementById('sPct').textContent=pct+'%'}
const pads={};function initCanvas(id){const c=document.getElementById('canvas'+id);if(!c||pads[id])return;const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(rect.width*dpr));c.height=Math.max(1,Math.floor(rect.height*dpr));ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';pads[id]={c,ctx,tool:'pen',hist:[],drawing:false,x:0,y:0};const img=localStorage.getItem('ratfrac-canvas-'+id);if(img){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=img}function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{e.preventDefault();const p=pads[id];p.hist.push(c.toDataURL());if(p.hist.length>15)p.hist.shift();p.drawing=true;const q=pos(e);p.x=q.x;p.y=q.y;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{const p=pads[id];if(!p.drawing)return;e.preventDefault();const q=pos(e);p.ctx.save();p.ctx.globalCompositeOperation=p.tool==='eraser'?'destination-out':'source-over';p.ctx.strokeStyle='#263125';p.ctx.lineWidth=p.tool==='eraser'?18:2.4;p.ctx.beginPath();p.ctx.moveTo(p.x,p.y);p.ctx.lineTo(q.x,q.y);p.ctx.stroke();p.ctx.restore();p.x=q.x;p.y=q.y};['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>{const p=pads[id];if(p){p.drawing=false;try{localStorage.setItem('ratfrac-canvas-'+id,c.toDataURL())}catch(_){}}}))}
function setTool(id,tool){initCanvas(id);pads[id].tool=tool}function clearCanvas(id){initCanvas(id);const p=pads[id],r=p.c.getBoundingClientRect();p.hist.push(p.c.toDataURL());p.ctx.clearRect(0,0,r.width,r.height);localStorage.removeItem('ratfrac-canvas-'+id)}function undoCanvas(id){initCanvas(id);const p=pads[id];if(!p.hist.length)return;const src=p.hist.pop(),im=new Image(),r=p.c.getBoundingClientRect();im.onload=()=>{p.ctx.clearRect(0,0,r.width,r.height);p.ctx.drawImage(im,0,0,r.width,r.height);try{localStorage.setItem('ratfrac-canvas-'+id,p.c.toDataURL())}catch(_){}};im.src=src}
updateStats();
window.addEventListener('beforeunload',()=>{document.querySelectorAll('input[id^=a]').forEach(i=>state[i.id]=i.value);save()});
</script>
